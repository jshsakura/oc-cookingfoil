      const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

      // Inline placeholder SVGs for the "icon missing" state. We swap the
      // img's `src` to one of these on 404 / no-icon-url, so the browser
      // sees a successfully-loaded image (no broken-glyph X) and
      // `object-fit: cover` paints it edge-to-edge in the 72×72 cover
      // box. The 1:1 viewBox matches the cover aspect so there's no
      // letterbox or weird centering. Adapted from the oc-scraper
      // sibling project's PosterImage — Catppuccin Mocha (dark) and
      // Latte (light) palettes.
      const COVER_PLACEHOLDER_DARK = "data:image/svg+xml;utf8," + encodeURIComponent(
        "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96' preserveAspectRatio='xMidYMid slice'>" +
          "<defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'>" +
            "<stop offset='0%' stop-color='#1e1e2e'/><stop offset='100%' stop-color='#313244'/>" +
          "</linearGradient></defs>" +
          "<rect width='96' height='96' fill='url(#g)'/>" +
          "<rect x='20' y='24' width='56' height='42' rx='6' fill='none' stroke='#7f849c' stroke-width='2'/>" +
          "<circle cx='30' cy='36' r='4' fill='#7f849c'/>" +
          "<path d='M22 60L36 42L48 52L60 38L74 60Z' fill='#6c7086'/>" +
          "<path d='M26 60L36 48L48 56L60 46L70 60Z' fill='#9399b2'/>" +
          "<text x='48' y='82' text-anchor='middle' fill='#a6adc8' font-family='system-ui,sans-serif' font-size='9' font-weight='600'>No Image</text>" +
        "</svg>"
      );
      const COVER_PLACEHOLDER_LIGHT = "data:image/svg+xml;utf8," + encodeURIComponent(
        "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96' preserveAspectRatio='xMidYMid slice'>" +
          "<defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'>" +
            "<stop offset='0%' stop-color='#eff1f5'/><stop offset='100%' stop-color='#ccd0da'/>" +
          "</linearGradient></defs>" +
          "<rect width='96' height='96' fill='url(#g)'/>" +
          "<rect x='20' y='24' width='56' height='42' rx='6' fill='#eff1f5' stroke='#8c8fa1' stroke-width='2'/>" +
          "<circle cx='30' cy='36' r='4' fill='#8c8fa1'/>" +
          "<path d='M22 60L36 42L48 52L60 38L74 60Z' fill='#9ca0b0'/>" +
          "<path d='M26 60L36 48L48 56L60 46L70 60Z' fill='#7c7f93'/>" +
          "<text x='48' y='82' text-anchor='middle' fill='#5c5f77' font-family='system-ui,sans-serif' font-size='9' font-weight='600'>No Image</text>" +
        "</svg>"
      );
      function coverPlaceholder() {
        return currentTheme() === "light" ? COVER_PLACEHOLDER_LIGHT : COVER_PLACEHOLDER_DARK;
      }

      // Pick the display name for the current UI language. The server name
      // is Korean-first (COOK_LANG_PRIORITY) and may arrive already decorated
      // as 'Korean (English)' so on-device Tinfoil search matches.
      //   ko: keep that 'Korean (English)' form for brand recognition.
      //   en: prefer English outright — strip any '(…)' wrapping and swap a
      //       CJK display name for its English alias when one exists.
      // Falls back to the given name whenever no better candidate exists.
      // Toggling the lang button re-renders, so cards update without a refresh.
      const asciiRatio = (s) =>
        s.replace(/[^\x20-\x7E]/g, "").length / Math.max(1, s.length);
      const coreName = (name) =>
        name.replace(/\s*\([^()]*\)\s*$/, "").trim() || name;

      // A base game's name in the page language, as the client picks it: that
      // language, then English, then the shop's own name (titledb names per region).
      function pickName(names, fallback) {
        return (names && (names[lang] || names.en)) || fallback;
      }
      const localName = (r, fallback) =>
        r.kind === "base" ? pickName(sectionOf.get((r.item.titleId || "").toUpperCase())?.names, fallback) : fallback;

      function nameWithAlias(name, aliases) {
        if (!name) return name;
        const list = Array.isArray(aliases) ? aliases : [];
        const core = coreName(name);

        if (lang === "en") {
          if (asciiRatio(core) > 0.7) return core; // already English-y
          const eng = list.find((a) => a && a !== core && asciiRatio(a) > 0.7);
          return eng || name;
        }

        // Korean UI: keep an already-decorated name, else append an English alias.
        if (asciiRatio(core) > 0.7) return name;
        const eng = list.find((a) => a && a !== core && asciiRatio(a) > 0.7);
        return eng ? core + " (" + eng + ")" : name;
      }

      function animateCount(el, target, duration = 700) {
        const start = Number(el.dataset.n) || 0, t0 = performance.now();
        el.dataset.n = target;
        if (start === target) { el.textContent = target.toLocaleString(); return; }
        function step(now) {
          const k = Math.min(1, (now - t0) / duration);
          const eased = 1 - Math.pow(1 - k, 3);
          el.textContent = Math.round(start + (target - start) * eased).toLocaleString();
          if (k < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      // ─── features and session ─────────────────────────────────────────────
      // The shop address and how to connect live on the admin page's overview now.
      // Show the device page only when this shop pairs consoles or issues device logins.
      fetch("/api/shop/info", { headers: { Accept: "application/json" } })
        .then((r) => (r.ok ? r.json() : null))
        .then((info) => {
          const features = info?.features ?? [];
          if (features.includes("device-pairing") || features.includes("device-logins")) document.getElementById("pair-link").hidden = false;
          if (features.includes("client-update") && features.includes("enroll")) showClientCard();
          if (features.includes("retro")) { available.add("retro"); available.add("retro-home"); }
          if (features.includes("user-patches")) available.add("patches");
          if (features.includes("shop-saves")) available.add("saves");
          $("retro-tab").hidden = !available.has("retro");
          $("extras-tab").hidden = !available.has("patches") && !available.has("saves");
          if (features.includes("homebrew")) { available.add("tools"); available.add("ports"); }
          $("homebrew-tab").hidden = !available.has("tools");
          // A link (or the remembered view) that only now turned out to exist.
          if (requestedTab && requestedTab !== current && available.has(requestedTab)) showTab(requestedTab);
        })
        .catch(() => {});
      // Signed in at /login: a sign-out button. A request that finds the session
      // gone sends the page back to /login (the server never shows a password popup).
      let session = null;
      fetch("/auth/me", { headers: { Accept: "application/json" } })
        .then((r) => (r.ok ? r.json() : null))
        .then((d) => {
          session = d;
          $("logout-link").hidden = !d;
          if (d?.user) { $("acct-who").textContent = d.user; $("acct-who").hidden = false; }
          // Only admin accounts can open the admin page; don't offer it to the others.
          if (d && !d.admin) $("admin-link").hidden = true;
          if (d) share.check();
        })
        .catch(() => {});
      $("logout-link").addEventListener("click", async (e) => {
        e.preventDefault();
        try { await fetch("/auth/logout", { method: "POST", headers: { "X-CSRF-Token": session?.csrf ?? "" } }); }
        finally { location.href = "/login"; }
      });
      const pageFetch = window.fetch.bind(window);
      window.fetch = async (...args) => {
        const r = await pageFetch(...args);
        if (r.status === 401 && session && !String(args[0]).startsWith("/auth/")) location.href = "/login?next=" + encodeURIComponent(location.pathname + location.hash);
        return r;
      };

      // ─── state ─────────────────────────────────────────────────────────────
      let shopData = null;
      let renderedItems = [];
      const PAGE_TARGET = 24;
      const state = { kind: "base", q: "", sort: "added-desc", genre: "", steam: "", page: 1, perPage: PAGE_TARGET };

      // Whole rows only: about PAGE_TARGET cards, rounded up to a full row of
      // however many columns fit the window (and zoom level) right now.
      function fitPerPage(grid = $("games")) {
        const cols = getComputedStyle(grid).gridTemplateColumns.split(" ").filter(Boolean).length || 1;
        return cols * Math.ceil(PAGE_TARGET / cols);
      }
      // Genres come from /api/shop/sections as English keys plus a label per
      // language (shop.json stays the plain Tinfoil index without them).
      let genreOf = new Map(); // base title id → [genre key]
      let genreNames = {};    // genre key → { en, ko, ja, zh }
      let scoreOf = new Map(); // base title id → { score, count, label }
      let scoreNames = {};     // score label key → { en, ko, ja, zh }
      let sectionOf = new Map(); // base title id → its sections item (rank, players, languages, price)
      let sectionFiles = new Map(); // "TITLEID:version" → the sections item of any file (an update's version_name)
      let featuredRows = [];     // sections.featured, the admin's picks

      // ─── skeleton placeholders ─────────────────────────────────────────────
      // Shimmering cards in the real card's shape go in before the first paint:
      // whole rows of the grid, the preview's banner and shelves, and the chart
      // row. Replaced by real cards once /shop.json resolves; never shown again
      // after that.
      const BLANK_PIXEL = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
      function skeletonCards(n) {
        return Array.from({ length: n }, () => {
          const card = document.createElement("div");
          card.className = "game skel"; card.setAttribute("aria-hidden", "true");
          card.innerHTML = '<div class="poster"><div class="cover"></div></div><div class="meta"><div class="name"><i></i><i></i></div><div class="sub"><i></i></div></div>';
          return card;
        });
      }
      function skeletonShelves(rows = 3, cards = 8) {
        return Array.from({ length: rows }, () => {
          const block = document.createElement("div"); block.className = "home-row skel"; block.setAttribute("aria-hidden", "true");
          const h = document.createElement("h2"); h.append(document.createElement("i"));
          const list = document.createElement("div"); list.className = "recent"; list.append(...skeletonCards(cards));
          block.append(h, list);
          return block;
        });
      }
      function setHeroSkeleton(on) {
        $("hero").classList.toggle("skel", on);
        $("hero-skel-text").hidden = !on;
        $("hero-text").hidden = on;
        $("hero-cover").hidden = false;
        // a blank pixel, so the cover box shimmers instead of drawing a broken-image frame
        if (on) { $("hero").hidden = false; $("hero-cover").src = BLANK_PIXEL; $("hero-dots").hidden = true; }
      }
      function renderSkeletons() {
        const grid = $("games");
        grid.replaceChildren(...skeletonCards(fitPerPage(grid)));
        grid.setAttribute("aria-busy", "true");
        setHeroSkeleton(true);
        $("home-rows").replaceChildren(...skeletonShelves());
        $("home-rows").setAttribute("aria-busy", "true");
        const charts = $("charts");
        charts.innerHTML = Array.from({ length: 4 }, () => '<div class="chart c3 skel" aria-hidden="true"><i></i><i></i><i></i></div>').join("");
        charts.hidden = false;
        const chips = $("genre-chips");
        chips.replaceChildren(...Array.from({ length: 7 }, () => {
          const b = document.createElement("span"); b.className = "chip skel"; b.setAttribute("aria-hidden", "true"); b.textContent = "\u00a0"; return b;
        }));

      }

      // ─── data flow ─────────────────────────────────────────────────────────
      let lastShopText = "";
      async function loadShop({ quiet = false } = {}) {
        if (!quiet) $("status-text").textContent = t("status.loading");
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 60_000);
        const t0 = performance.now();
        try {
          const r = await fetch("/shop.json", { headers: { Accept: "application/json" }, signal: ctrl.signal });
          if (!r.ok) throw new Error("HTTP " + r.status);
          const text = await r.text();
          const ms = Math.round(performance.now() - t0);
          if (ms > 1500) console.info("[CookingFoil] /shop.json", ms, "ms");
          if (quiet && text === lastShopText) return;
          lastShopText = text;
          shopData = JSON.parse(text);
          renderAll(shopData, { quiet });
        } catch (err) {
          console.error("[CookingFoil] /shop.json failed:", err);
          // A live update that fails keeps what is on screen.
          if (quiet) return;
          $("status").classList.remove("warm"); $("status").classList.add("cold");
          $("status-text").textContent = err.name === "AbortError" ? t("status.timeout") : t("status.error", err.message || String(err));
          $("games").innerHTML = `<div class="empty">${t("empty.err")}</div>`;

          $("games").setAttribute("aria-busy", "false");
          if ($("hero").classList.contains("skel")) { setHeroSkeleton(false); $("hero").hidden = true; $("home-rows").replaceChildren(); }
          if ($("charts").querySelector(".skel")) { $("charts").hidden = true; $("charts").innerHTML = ""; }
        } finally {

      }

      let showcaseKey = "";
      function renderAll(shop, { quiet = false } = {}) {
        const files   = Array.isArray(shop.files) ? shop.files : [];
        const titledb = shop.titledb && typeof shop.titledb === "object" ? shop.titledb : {};

        const baseFiles   = files.filter(f => (f.kind || "base") === "base");
        // A game kept as two files (two regions, or base and a repack) is still one title.
        const baseCount   = new Set(baseFiles.map(f => (f.baseTitleId || f.titleId || f.name || "").toUpperCase())).size;
        const updateCount = files.filter(f => f.kind === "update").length;
        const dlcCount    = files.filter(f => f.kind === "dlc").length;
        const totalSize   = files.reduce((n, f) => n + (Number(f.size) || 0), 0);

        // Show BASE titles in the running marquee — that's what people mean
        // by "how many games". updates + DLC roll up under the base on
        // their cards (the '+N 업데이트' / '+N DLC' pills) and in the
        // /games stat below, so we don't double-count here.
        // Data's here — drop the entry skeletons on the stat values + status.
        for (const id of ["stat-games", "stat-updates", "stat-dlc", "stat-size", "stat-size-sub"]) {
          $(id).classList.remove("sk");
        }
        $("status-text").classList.remove("sk");
        $("games-count").classList.remove("sk");

        $("status").classList.remove("cold", "warm");
        if (files.length === 0) {
          $("status").classList.add("warm");
          $("status-text").textContent = t("status.empty");
        } else {
          $("status-text").textContent = t("status.serving", baseCount);
        }

        animateCount($("stat-games"), baseCount);
        animateCount($("stat-updates"), updateCount);
        animateCount($("stat-dlc"), dlcCount);
        $("stat-size").textContent = fmtBytes(totalSize);
        $("stat-size-sub").textContent = t("stat.size_sub", files.length);
        chartFiles = files;
        renderCharts();

        // Roll up update/DLC counts onto each base title so the card can
        // surface 'this base also has N updates / M DLC in your library'.
        const updByBase = new Map(), dlcByBase = new Map(), updAddedByBase = new Map();
        for (const f of files) {
          if (!f.baseTitleId) continue;
          if (f.kind === "update") {
            updByBase.set(f.baseTitleId, (updByBase.get(f.baseTitleId) || 0) + 1);
            if (typeof f.mtime === "number") updAddedByBase.set(f.baseTitleId, Math.max(updAddedByBase.get(f.baseTitleId) || 0, f.mtime));
          }
          else if (f.kind === "dlc") dlcByBase.set(f.baseTitleId, (dlcByBase.get(f.baseTitleId) || 0) + 1);
        }

        renderedItems = files.map((f, idx) => {
          const tdb = (f.baseTitleId && titledb[f.baseTitleId]) || (f.titleId && titledb[f.titleId]) || null;
          const kind = f.kind || (tdb ? "base" : "custom");
          // Cross-language search blob: displayed name + every alias the
          // server collected across region files (KR.ko / US.en / JP.ja /
          // GB.en / HK.zh). So 'zelda' finds 젤다, 'マリオ' finds Mario, etc.
          const aliases = Array.isArray(tdb?.aliases) ? tdb.aliases : [];
          const searchBlob = [f.name || "", ...aliases].join("  ").toLowerCase();
          return {
            idx, item: f, tdb, kind,
            name: (f.name || "").toLowerCase(),
            added: typeof f.mtime === "number" ? f.mtime : 0,
            tid: (f.titleId || "").toLowerCase(),
            search: searchBlob,
            size: typeof f.size === "number" ? f.size : 0,
            releaseDate: tdb?.releaseDate || 0,
            updateCount: kind === "base" && f.titleId ? (updByBase.get(f.titleId) || 0) : 0,
            dlcCount:    kind === "base" && f.titleId ? (dlcByBase.get(f.titleId) || 0) : 0,
            updAdded:    kind === "base" && f.titleId ? (updAddedByBase.get(f.titleId) || 0) : 0,
          };
        });

        // The preview is rebuilt only when the games in it change, so a live update doesn't reload its covers.
        const nextShowcase = renderedItems.filter((r) => r.kind === "base").map((r) => `${r.tid}|${r.item.name}|${r.item.icon_url}|${r.added}`).join("\n");
        if (!quiet || nextShowcase !== showcaseKey) renderShowcase();
        showcaseKey = nextShowcase;
        if (!quiet) state.page = 1;
        applyFilters();
        loadGenres();
      }

      // ─── filter / sort / paginate ─────────────────────────────────────────
      function visibleSet() {
        const list = renderedItems.filter(r => {
          if (r.kind !== state.kind) return false;
          if (state.genre && !(genreOf.get((r.item.baseTitleId || r.item.titleId || "").toUpperCase()) || []).includes(state.genre)) return false;
          if (state.steam && scoreFor(r)?.label !== state.steam) return false;
          if (state.q && !r.search.includes(state.q) && !r.tid.includes(state.q)) return false;
          return true;
        });
        list.sort((a, b) => {
          switch (state.sort) {
            case "name-desc":    return b.item.name.localeCompare(a.item.name);
            case "size-desc":    return b.size - a.size;
            case "size-asc":     return a.size - b.size;
            case "release-desc": return (b.releaseDate || 0) - (a.releaseDate || 0);
            case "added-desc":   return b.added - a.added;
            case "score-desc":   return (scoreFor(b)?.score ?? -1) - (scoreFor(a)?.score ?? -1) || a.item.name.localeCompare(b.item.name);
            case "name":
            default:             return a.item.name.localeCompare(b.item.name);
          }
        });
        return list;
      }

      let lastListKey = "";
      function applyFilters() {
        state.perPage = fitPerPage();
        const list = visibleSet();
        const total = list.length;
        const pages = Math.max(1, Math.ceil(total / state.perPage));
        state.page = Math.min(state.page, pages);
        const start = (state.page - 1) * state.perPage;
        const slice = list.slice(start, start + state.perPage);

        const listKey = lang + "|" + state.page + "\n" + slice.map((r) => {
          const tid = (r.item.baseTitleId || r.item.titleId || "").toUpperCase();
          return [r.idx, r.item.name, r.item.icon_url, r.item.size, r.updateCount, r.dlcCount, JSON.stringify(scoreFor(r)), JSON.stringify(sectionOf.get(tid) || null)].join("|");
        }).join("\n");
        if (listKey !== lastListKey || !$("games").firstElementChild) renderList(slice);
        lastListKey = listKey;
        $("games-count").textContent = `${total.toLocaleString()} / ${renderedItems.length.toLocaleString()}`;
        renderPager($("pager"), state.page, pages, total, start + 1, Math.min(total, start + slice.length), (n) => {
          state.page = n;
          applyFilters();
          // Intentional: changing pages brings the grid top into view.
          $("games").scrollIntoView({ behavior: "smooth", block: "start" });
        });
      }

      function renderList(list) {
        const grid = $("games");
        grid.innerHTML = "";
        grid.setAttribute("aria-busy", "false");
        if (list.length === 0) {
          grid.innerHTML = `<div class="empty">${t("empty.none")}</div>`;
          return;
        }
        const frag = document.createDocumentFragment();
        for (const r of list) frag.appendChild(makeCard(r));
        grid.appendChild(frag);
        // NOTE: do NOT scrollIntoView here. renderList() runs on initial load,
        // every search keystroke and every filter change — auto-scrolling on all
        // of those yanks the page around ("자꾸 지가 내려감"). Page-change scroll
        // is handled in the pager button click instead, where it's intentional.
      }

      // Badge colour by score band (90+, 80s, 70s, 50–69, below 50), as on the client app.
      const scoreTier = (sc) => (sc.score >= 90 ? "s90" : sc.score >= 80 ? "s80" : sc.score >= 70 ? "s70" : sc.score >= 50 ? "s50" : "low");
      // Steam's review wording, best first, for the filter chips.
      const STEAM_ORDER = [
        "Overwhelmingly Positive", "Very Positive", "Positive", "Mostly Positive", "Mixed",
        "Mostly Negative", "Negative", "Very Negative", "Overwhelmingly Negative",
      ];
      const steamLabelName = (key) => { const n = scoreNames[key] || {}; return n[lang] || n.en || key; };

      function scoreFor(r) {
        return scoreOf.get((r.item.baseTitleId || r.item.titleId || "").toUpperCase()) || null;
      }

      // "75 · 대체로 긍정적" with the label in the page language when Steam gave one.
      function scoreText(score, labelKey, localized) {
        const names = scoreNames[labelKey] || {};
        const label = localized || names[lang] || names.en || labelKey || "";
        return label ? `${score} · ${label}` : String(score);
      }

      function genreLabel(key) {
        const names = genreNames[key] || {};
        return names[lang] || names.en || key;
      }

      async function loadGenres() {
        try {
          const r = await fetch("/api/shop/sections", { headers: { Accept: "application/json" } });
          if (!r.ok) throw new Error("HTTP " + r.status);
          const body = await r.json();
          const next = new Map();
          const scores = new Map();
          const items = new Map();
          const files = new Map();
          for (const section of body.sections || []) {
            for (const item of section.items || []) {
              if (item.title_id) files.set(String(item.title_id).toUpperCase() + ":" + (item.app_version ?? 0), item);
              if (item.app_type !== "base" || !item.title_id) continue;
              const tid = String(item.title_id).toUpperCase();
              items.set(tid, item);
              if (Array.isArray(item.categories)) next.set(tid, item.categories);
              if (Number.isFinite(item.score)) scores.set(tid, { score: item.score, count: item.score_count, label: item.score_label });
            }
          }
          genreOf = next;
          scoreOf = scores;
          sectionOf = items;
          sectionFiles = files;
          featuredRows = Array.isArray(body.featured) ? body.featured : [];
          genreNames = body.genres && typeof body.genres === "object" ? body.genres : {};
          scoreNames = body.score_labels && typeof body.score_labels === "object" ? body.score_labels : {};
          genresLoaded = true;
          const nextFeatured = JSON.stringify(featuredRows);
          if (renderedItems.length && nextFeatured !== featuredKey) renderShowcase();
          featuredKey = nextFeatured;
          if (state.genre && ![...next.values()].some((keys) => keys.includes(state.genre))) state.genre = "";
          renderGenreChips();
          renderSteamChips();
          renderCharts();
          applyFilters();
        } catch (err) {
          console.warn("[CookingFoil] genres unavailable:", err);
          if (!genresLoaded) { genresLoaded = true; $("genre-chips").hidden = true; $("genre-chips").replaceChildren(); renderCharts(); }
        }
      }

      // ─── charts in the stats panel ───────────────────────────────────────
      let chartFiles = [];
      let genresLoaded = false, featuredKey = "", chartHtml = [];
      const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const legendRow = (color, label, value) => `<div><i style="--c:${color}"></i><span>${esc(label)}</span><b>${esc(value)}</b></div>`;
      const chartCard = (title, total, body, cls = "") =>
        `<div class="chart${cls}"><h4><span>${esc(title)}</span>${total ? `<span class="total">${esc(total)}</span>` : ""}</h4>${body}</div>`;

      function donut(parts) {
        const sum = parts.reduce((a, p) => a + p.n, 0) || 1;
        const r = 40, c = 2 * Math.PI * r;
        let offset = 0;
        const rings = parts.filter((p) => p.n > 0).map((p) => {
          const len = (p.n / sum) * c;
          const ring = `<circle r="${r}" cx="52" cy="52" stroke="${p.color}" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-offset}"/>`;
          offset += len;
          return ring;
        }).join("");
        return `<svg class="donut" viewBox="0 0 104 104" aria-hidden="true"><circle r="${r}" cx="52" cy="52" stroke="var(--line)"/>${rings}</svg>`;
      }

      function hbars(rows, max) {
        return `<div class="hbars">${rows.map((r) => `<div class="hbar"><span title="${esc(r.label)}">${esc(r.label)}</span>` +
          `<div class="track"><div class="fill" style="width:${Math.max(2, (r.n / (max || 1)) * 100)}%${r.color ? `;--c:${r.color}` : ""}"></div></div><b>${esc(r.text ?? r.n.toLocaleString())}</b></div>`).join("")}</div>`;
      }

      function renderCharts() {
        const box = $("charts");
        const files = chartFiles;
        if (!files.length) { box.hidden = true; box.innerHTML = ""; chartHtml = []; return; }
        const KINDS = [["base", "var(--c1)", t("chip.base")], ["update", "var(--c2)", t("chip.update")], ["dlc", "var(--c3)", t("chip.dlc")]];
        const kindOf = (f) => f.kind || "base";
        const cards = [];

        const counts = KINDS.map(([k, color, label]) => ({ n: files.filter((f) => kindOf(f) === k).length, color, label }));
        cards.push(chartCard(t("chart.composition"), t("chart.total", files.length.toLocaleString()),
          `<div class="donut-wrap">${donut(counts)}<div class="legend">${counts.map((p) => legendRow(p.color, p.label, p.n.toLocaleString())).join("")}</div></div>`));

        const bytes = KINDS.map(([k, color, label]) => ({ n: files.filter((f) => kindOf(f) === k).reduce((a, f) => a + (typeof f.size === "number" ? f.size : 0), 0), color, label }));
        const allBytes = bytes.reduce((a, b) => a + b.n, 0);
        if (allBytes > 0) {
          cards.push(chartCard(t("chart.storage"), t("chart.total", fmtBytes(allBytes)),
            `<div class="stack">${bytes.filter((b) => b.n > 0).map((b) => `<i style="--c:${b.color};flex:${b.n}"></i>`).join("")}</div>` +
            `<div class="legend">${bytes.map((b) => legendRow(b.color, b.label, fmtBytes(b.n))).join("")}</div>`));
        }

        // base entries added per month over the last year, from file times
        const now = new Date();
        const months = Array.from({ length: 12 }, (_, i) => new Date(now.getFullYear(), now.getMonth() - 11 + i, 1));
        const perMonth = new Array(12).fill(0);
        for (const f of files) {
          if (kindOf(f) !== "base" || typeof f.mtime !== "number") continue;
          const d = new Date(f.mtime < 1e12 ? f.mtime * 1000 : f.mtime);
          const i = (d.getFullYear() - months[0].getFullYear()) * 12 + d.getMonth() - months[0].getMonth();
          if (i >= 0 && i < 12) perMonth[i]++;
        }
        const peak = Math.max(...perMonth);
        if (peak > 0) {
          const fmtMonth = new Intl.DateTimeFormat(lang === "zh" ? "zh-CN" : lang, { month: "numeric" });
          cards.push(chartCard(t("chart.added"), t("chart.total", perMonth.reduce((a, b) => a + b, 0).toLocaleString()),
            `<div class="cols">${perMonth.map((n, i) => `<div class="col" title="${esc(fmtMonth.format(months[i]))}: ${n}"><div class="bar${n ? "" : " zero"}" style="height:${n ? Math.max(4, (n / peak) * 100) : 2}%"></div></div>`).join("")}</div>` +
            `<div class="col-x">${months.map((m) => `<span>${esc(fmtMonth.format(m).replace(/[^0-9]/g, ""))}</span>`).join("")}</div>`));
        }

        const genres = new Map();
        for (const keys of genreOf.values()) for (const key of keys) genres.set(key, (genres.get(key) || 0) + 1);
        // Until the genres answer, their card keeps a shimmering slot so the row never jumps from three to four.
        if (!genresLoaded) cards.push('<div class="chart skel" aria-hidden="true"><i></i><i></i><i></i></div>');
        else if (genres.size) {
          const top = [...genres].sort((a, b) => b[1] - a[1]).slice(0, 4);
          cards.push(chartCard(t("chart.genres"), "", hbars(top.map(([k, n]) => ({ label: genreLabel(k), n })), top[0][1])));
        }

        // Each row is filled evenly whatever the count: the small cards share theirs, and so do the wide ones.
        const isWide = (c) => c.includes('class="chart wide"');
        const small = cards.filter((c) => !isWide(c)), wide = cards.filter(isWide);
        const sized = (list, wideRow) => list.map((c, i) => {
          const span = wideRow ? (list.length === 1 ? 12 : 6) : 12 / Math.min(4, list.length);
          // on a two-column screen the odd one out at the end takes the whole row
          const oddLast = list.length % 2 === 1 && i === list.length - 1 ? " odd-last" : "";
          return c.replace(/class="chart( wide| skel)?"/, (_, m) => `class="chart${m === " skel" ? " skel" : ""} c${span}${oddLast}"`);
        });
        // Only the cards that changed are swapped, so the rest stay put and don't replay their entrance.
        const next = [...sized(small, false), ...sized(wide, true)];
        if (box.children.length !== next.length) box.innerHTML = next.join("");
        else next.forEach((html, i) => {
          if (html === chartHtml[i]) return;
          const tpl = document.createElement("template"); tpl.innerHTML = html;
          box.children[i].replaceWith(tpl.content.firstElementChild);
        });
        chartHtml = next;
        box.hidden = false;
      }

      // One chip per genre key, busiest first, labelled in the page language.
      function renderGenreChips() {
        const box = $("genre-chips");
        const counts = new Map();
        for (const keys of genreOf.values()) for (const key of keys) counts.set(key, (counts.get(key) || 0) + 1);
        box.hidden = counts.size === 0;
        box.innerHTML = "";
        const chip = (key, label, n) => {
          const b = document.createElement("button");
          b.type = "button"; b.className = "chip" + (state.genre === key ? " active" : ""); b.dataset.genre = key;
          b.setAttribute("aria-pressed", String(state.genre === key));
          b.textContent = label;
          if (n) { const c = document.createElement("span"); c.className = "n"; c.textContent = n.toLocaleString(); b.appendChild(c); }
          box.appendChild(b);
        };
        chip("", t("genre.all"));
        for (const [key, n] of [...counts].sort((a, b) => b[1] - a[1])) chip(key, genreLabel(key), n);
      }

      // One chip per Steam review tier present, best first, in the page language.
      function renderSteamChips() {
        const box = $("steam-chips");
        const counts = new Map();
        for (const sc of scoreOf.values()) if (sc.label) counts.set(sc.label, (counts.get(sc.label) || 0) + 1);
        if (state.steam && !counts.has(state.steam)) state.steam = "";
        box.hidden = counts.size === 0;
        box.innerHTML = "";
        const chip = (key, label, n) => {
          const b = document.createElement("button");
          b.type = "button"; b.className = "chip" + (state.steam === key ? " active" : ""); b.dataset.steam = key;
          b.setAttribute("aria-pressed", String(state.steam === key));
          b.textContent = label;
          if (n) { const c = document.createElement("span"); c.className = "n"; c.textContent = n.toLocaleString(); b.appendChild(c); }
          box.appendChild(b);
        };
        chip("", t("score.all"));
        for (const key of STEAM_ORDER) if (counts.has(key)) chip(key, steamLabelName(key), counts.get(key));
      }
      $("steam-chips").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-steam]");
        if (!b) return;
        state.steam = b.dataset.steam;
        state.page = 1;
        renderSteamChips();
        applyFilters();
      });

      $("genre-chips").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-genre]");
        if (!b) return;
        state.genre = b.dataset.genre;
        state.page = 1;
        renderGenreChips();
        applyFilters();
      });

      // File names carry "[TITLEID][vN]" for Tinfoil; people read the title alone.
      function cleanName(name) {
        return String(name).replace(/(\s*\[[0-9A-Fa-f]{16}\])?(\s*\[v\d+\])+\s*$/, "").replace(/\s*\[[0-9A-Fa-f]{16}\]\s*$/, "") || name;
      }

      // ─── home: the client's store front ───────────────────────────────────
      // Same composition as the client app's home (source/core/Catalog.cpp):
      // a rotating banner of up to five picks, then the admin's featured rows
      // and the themed rows, so the web shows how the store will look.
      const HERO_MS = 6000, HERO_SLIDES = 5, HERO_POOL = 40;
      const ROW_LIMIT = 12, ROW_VISIBLE = 6, TOP_POOL = 36, WIDE_POOL = 80;
      const GREAT_SCORE = 85, BIG_SIZE = 10 * 2 ** 30, PARTY = "Party";
      const CATEGORY_ROWS = 3, MIN_CATEGORY_GAMES = 4;
      let heroSlides = [], heroIndex = 0, heroAt = 0, heroPaused = false;

      // A per-day seed: the picks rotate daily but stay put while you browse.
      function seedFor(label) {
        let h = 2166136261;
        for (const c of new Date().toISOString().slice(0, 10) + label) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
        return h >>> 0;
      }
      function seededShuffle(list, seed) {
        const out = [...list];
        let s = seed || 1;
        const next = () => { s = Math.imul(s ^ (s >>> 15), 0x2c1b3c6d) + 0x6d2b79f5 | 0; return ((s ^ (s >>> 14)) >>> 0) / 4294967296; };
        for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
        return out;
      }

      const tidOf = (r) => (r.item.titleId || "").toUpperCase();
      const metaOf = (r) => sectionOf.get(tidOf(r)) || {};
      const releaseOf = (r) => r.releaseDate || metaOf(r).release_date || 0;
      // eShop prices are re-read every 12 hours; a sale past its end no longer counts.
      const saleOf = (r) => {
        const m = metaOf(r);
        if (!m.price_discount) return null;
        const ends = m.price_discount_ends ? Date.parse(m.price_discount_ends) : NaN;
        if (ends <= Date.now()) return null;
        return { price: m.price_discount, ends: Number.isFinite(ends) ? new Date(ends) : null };
      };

      // One theme: filter the base games, then order them like the client does.
      function browse(bases, theme) {
        const list = bases.filter((r) => {
          const m = metaOf(r);
          if (theme.sort === "release" && !releaseOf(r)) return false;
          if (theme.sort === "updated" && !r.updAdded) return false;
          if (theme.onSale && !saleOf(r)) return false;
          if (theme.minPlayers && !((m.players || 0) >= theme.minPlayers)) return false;
          if (theme.minSize && r.size < theme.minSize) return false;
          if (theme.minScore && !((scoreFor(r)?.score || 0) >= theme.minScore)) return false;
          if (theme.steamLabel && scoreFor(r)?.label !== theme.steamLabel) return false;
          if (theme.korean && !(m.languages || []).includes("ko")) return false;
          if (theme.category && !(m.categories || []).includes(theme.category)) return false;
          if (theme.without && (m.categories || []).includes(theme.without)) return false;
          return true;
        });
        const by = {
          recent: (a, b) => b.added - a.added,
          release: (a, b) => releaseOf(b) - releaseOf(a),
          updated: (a, b) => b.updAdded - a.updAdded,
          popular: (a, b) => (metaOf(a).rank || Infinity) - (metaOf(b).rank || Infinity),
          score: (a, b) => (scoreFor(b)?.score || 0) - (scoreFor(a)?.score || 0),
          largest: (a, b) => b.size - a.size,
        }[theme.sort];
        return by ? list.sort(by) : list;
      }

      function buildHeroSlides(bases) {
        const slides = [];
        const used = new Set();
        const feat = featuredRows.find((f) => Array.isArray(f.title_ids) && f.title_ids.length);
        if (feat) {
          const ids = feat.title_ids.map((id) => String(id).toUpperCase());
          const r = ids.map((id) => bases.find((b) => tidOf(b) === id)).find(Boolean);
          if (r) {
            used.add(r);
            slides.push({ r, label: feat.title, banner: feat.banner_url || `/api/shop/banner/${tidOf(r)}` });
          }
        }
        const add = (key, theme, pick) => {
          const pool = browse(bases, theme).filter((r) => !used.has(r)).slice(0, pick ? HERO_POOL : 1);
          if (!pool.length) return;
          const r = pool[pick ? seedFor(key) % pool.length : 0];
          used.add(r);
          slides.push({ r, key });
        };
        add("hero.new", { sort: "recent" }, false);
        add("hero.sale", { sort: "popular", onSale: true }, true);
        add("hero.popular", { sort: "popular" }, false);
        add("hero.party", { sort: "popular", minPlayers: 2, without: PARTY }, true);
        add("hero.today", { sort: "popular", korean: true }, true);
        return slides.slice(0, HERO_SLIDES);
      }

      // Each row carries its whole list; the page draws ROW_LIMIT at a time and
      // the next batch as the row is scrolled near its right end.
      function buildRows(bases, heroGame) {
        const rows = [];
        const shown = new Set(heroGame ? [heroGame] : []);
        const keep = (title, items) => {
          if (!items.length) return;
          items.slice(0, ROW_VISIBLE).forEach((r) => shown.add(r));
          rows.push({ title, items });
        };
        for (const f of featuredRows) {
          const ids = (f.title_ids || []).map((id) => String(id).toUpperCase());
          keep(f.title, ids.map((id) => bases.find((b) => tidOf(b) === id)).filter((r) => r && r !== heroGame));
        }
        const add = (key, theme, pool = 0, title = null) => {
          let items = browse(bases, theme).filter((r) => !shown.has(r));
          // A shuffled row opens with a daily pick from its leaders, then goes on in order.
          if (pool) {
            const head = seededShuffle(items.slice(0, pool), seedFor(key));
            items = [...head, ...items.slice(pool)];
          }
          keep(title ?? t(key), items);
        };
        add("row.recent", { sort: "recent" });
        add("row.sale", { onSale: true }, WIDE_POOL);
        add("row.new", { sort: "release" });
        add("row.updated", { sort: "updated" });
        add("row.popular", { sort: "popular" }, TOP_POOL);
        add("row.great", { sort: "score", minScore: GREAT_SCORE }, WIDE_POOL);
        add("row.steamTop", { sort: "score", steamLabel: "Overwhelmingly Positive" }, WIDE_POOL, steamLabelName("Overwhelmingly Positive"));
        add("row.together", { sort: "popular", minPlayers: 2, without: PARTY }, WIDE_POOL);
        add("row.party", { sort: "popular", category: PARTY }, WIDE_POOL);
        add("row.big", { sort: "largest", minSize: BIG_SIZE }, Infinity);
        add("row.korean", { sort: "release", korean: true }, WIDE_POOL);
        const counts = new Map();
        for (const r of bases) for (const g of metaOf(r).categories || []) if (g !== PARTY) counts.set(g, (counts.get(g) || 0) + 1);
        const top = [...counts].sort((a, b) => b[1] - a[1]).slice(0, CATEGORY_ROWS);
        for (const [g, n] of top) if (n >= MIN_CATEGORY_GAMES) add("genre." + g, { sort: "recent", category: g }, WIDE_POOL, genreLabel(g));
        return rows;
      }

      function renderShowcase() {
        const bases = renderedItems.filter((r) => r.kind === "base");
        heroSlides = buildHeroSlides(bases);
        setHeroSkeleton(false);
        $("hero").hidden = !heroSlides.length;
        $("home-rows").setAttribute("aria-busy", "false");
        if (heroIndex >= heroSlides.length) heroIndex = 0;
        if (heroSlides.length) showHero(heroIndex, false);
        const box = $("home-rows"); box.innerHTML = "";
        for (const row of buildRows(bases, heroSlides[0]?.r)) {
          const block = document.createElement("div"); block.className = "home-row";
          const h = document.createElement("h2"); h.textContent = row.title;
          const list = document.createElement("div"); list.className = "recent";
          let drawn = 0;
          const more = () => {
            for (const r of row.items.slice(drawn, drawn + ROW_LIMIT)) list.appendChild(makeCard(r));
            drawn = Math.min(row.items.length, drawn + ROW_LIMIT);
          };
          more();
          list.addEventListener("scroll", () => {
            if (drawn < row.items.length && list.scrollLeft + list.clientWidth > list.scrollWidth - 600) more();
          }, { passive: true });
          if (row.items.length > ROW_LIMIT) {
            const n = document.createElement("span"); n.className = "row-count"; n.textContent = row.items.length.toLocaleString();
            h.appendChild(n);
          }
          block.append(h, list);
          box.appendChild(block);
        }
      }

      // Tags keep to their rows (max-height) and never wrap inside: from the first
      // one that would start a row past them, or is wider than the box, the rest go.
      function fitHeroTags() {
        const box = $("hero-tags");
        const tags = [...box.children];
        for (const el of tags) el.hidden = false;
        const top = box.getBoundingClientRect().top;
        const limit = parseFloat(getComputedStyle(box).maxHeight);
        if (!box.clientWidth || !Number.isFinite(limit)) return;
        let cut = false;
        for (const el of tags) {
          const r = el.getBoundingClientRect();
          cut ||= r.bottom - top > limit + 0.5 || r.width > box.clientWidth;
          el.hidden = cut;
        }
      }
      window.addEventListener("resize", debounce(() => { if (!$("hero").hidden) fitHeroTags(); }, 150));

      function showHero(n, animate = true) {
        heroIndex = (n + heroSlides.length) % heroSlides.length;
        heroAt = Date.now();
        const { r, key, label, banner } = heroSlides[heroIndex];
        const coverSrc = r.item.icon_url ? r.item.icon_url + (r.item.icon_url.includes("?") ? "&" : "?") + "size=lg" : coverPlaceholder();
        const cover = $("hero-cover");
        cover.onerror = () => { cover.onerror = null; cover.src = coverPlaceholder(); };
        cover.src = coverSrc;
        const bg = $("hero-bg");
        bg.className = "hero-bg " + (banner ? "banner" : "blur");
        bg.style.backgroundImage = `url("${banner || coverSrc}")`;
        $("hero-eyebrow").textContent = label || t(key);
        const aliases = Array.isArray(r.tdb?.aliases) ? r.tdb.aliases : [];
        $("hero-title").textContent = localName(r, cleanName(nameWithAlias(r.item.name || "", aliases)));
        $("hero-pub").textContent = r.tdb?.publisher || "";
        const tags = $("hero-tags"); tags.innerHTML = "";
        const addTag = (text) => { const el = document.createElement("span"); el.textContent = text; tags.appendChild(el); return el; };
        const m = metaOf(r);
        const sc = scoreFor(r);
        // A bare number reads as nothing, so the score says what it is when Steam gave no label.
        if (sc) addTag(sc.label ? scoreText(sc.score, sc.label) : `${t("modal.score")} ${sc.score}`).classList.add("score", scoreTier(sc));
        const sale = saleOf(r);
        if (sale) addTag(t("hero.discount", sale.price) + (sale.ends ? " · " + t("hero.until", sale.ends) : ""));
        // What a download decides on first; on a narrow screen the later ones give way.
        if ((m.languages || []).includes("ko")) addTag(t("pill.korean"));
        addTag(fmtBytes(r.size));
        for (const g of (m.categories || []).slice(0, 2)) addTag(genreLabel(g));
        const players = Number(r.tdb?.numberOfPlayers ?? m.players);
        if (players > 1) addTag(fmtPlayers(players));
        const released = fmtDate(r.tdb?.releaseDate || m.release_date);
        if (released) addTag(t("hero.released", released));
        if (r.updateCount) addTag(t("hero.updates", r.updateCount));
        if (r.dlcCount) addTag(t("hero.dlc", r.dlcCount));
        fitHeroTags();
        $("hero").onclick = () => openModal(r);
        const dots = $("hero-dots");
        dots.hidden = heroSlides.length < 2;
        dots.innerHTML = "";
        heroSlides.forEach((_, i) => {
          const b = document.createElement("button");
          b.type = "button"; b.className = i === heroIndex ? "on" : "";
          b.setAttribute("aria-label", t("hero.slide", i + 1));
          b.addEventListener("click", (e) => { e.stopPropagation(); showHero(i); });
          dots.appendChild(b);
        });
        if (animate) { const h = $("hero"); h.classList.remove("swap"); void h.offsetWidth; h.classList.add("swap"); }
      }

      // ─── retro games (/api/retro) ───────────────────────────────────────────
      // One chip per console, square tiles the server draws, pages loaded as
      // the list scrolls. A multi-disc game downloads as its bundle (discs + .m3u).
      const retro = (() => {
        let systems = null, system = "", page = 1, shownPer = 0, seq = 0;
        const box = () => $("retro-games");
        const nameOf = (s) => s.names?.[lang] || s.name;
        async function getJson(url) {
          const r = await fetch(url, { headers: { Accept: "application/json" } });
          if (!r.ok) throw new Error(String(r.status));
          return r.json();
        }
        function renderSystems() {
          const row = $("retro-systems");
          row.replaceChildren();
          const all = systems.reduce((n, s) => n + s.romCount, 0);
          const chip = (id, label, count, icon) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "chip" + (id === system ? " active" : "");
            if (icon) { const im = document.createElement("img"); im.src = icon; im.alt = ""; im.loading = "lazy"; b.append(im); }
            const n = document.createElement("span"); n.className = "n"; n.textContent = count;
            b.append(document.createTextNode(label), n);
            b.addEventListener("click", () => { system = id; renderSystems(); reload(); });
            return b;
          };
          row.append(chip("", t("retro.all"), all, null));
          for (const s of systems.filter((s) => s.romCount > 0)) row.append(chip(s.id, nameOf(s), s.romCount, s.iconUrl));
        }
        function card(g) {
          const a = document.createElement("button");
          a.type = "button";
          a.className = "game";
          a.title = g.name;
          a.addEventListener("click", () => openRetroModal(g, systems?.find((s) => s.id === g.system)));
          const poster = document.createElement("div"); poster.className = "poster";
          const letterCover = () => {
            const d = document.createElement("div"); d.className = "cover letter"; d.textContent = [...g.name.trim()][0] || "?";
            return d;
          };
          let cover;
          if (g.iconUrl) {
            cover = document.createElement("img"); cover.className = "cover"; cover.src = g.iconUrl; cover.alt = ""; cover.loading = "lazy"; cover.decoding = "async";
            // Retry once (the server may be restarting), then show the letter tile, never a broken image.
            let retried = false;
            cover.addEventListener("error", () => {
              if (!retried) { retried = true; setTimeout(() => { cover.src = g.iconUrl + "&retry=1"; }, 3000); return; }
              cover.replaceWith(letterCover());
            });
          } else {
            cover = letterCover();
          }
          const size = document.createElement("span"); size.className = "poster-badge size-badge"; size.textContent = fmtBytes(g.size);
          poster.append(cover, size);
          const meta = document.createElement("div"); meta.className = "meta";
          const name = document.createElement("div"); name.className = "name"; name.textContent = g.name; name.title = g.name;
          const sub = document.createElement("div"); sub.className = "sub";
          const pill = (text, cls = "") => { const p = document.createElement("span"); p.className = "pill " + cls; p.textContent = text; return p; };
          const sys = systems?.find((s) => s.id === g.system);
          if (!system && sys) {
            const p = pill(nameOf(sys), "sys-pill");
            if (sys.iconUrl) { const im = document.createElement("img"); im.src = sys.iconUrl; im.alt = ""; im.loading = "lazy"; p.prepend(im); }
            sub.append(p);
          }
          if (g.file.endsWith(".m3u")) sub.append(pill(t("retro.discs")));
          // Patch variants of one game share a name; the tags tell them apart.
          if (g.variant) { const v = pill(g.variant, "variant"); v.title = g.variant; sub.append(v); }
          // Other versions of the game (patches, regions) are picked in its window.
          if (g.variants > 1) sub.append(pill(t("retro.versions", g.variants)));
          if (g.bezel?.hasBezel && !g.bezel.generic) sub.append(pill(t("retro.bezel")));
          meta.append(name, sub);
          a.append(poster, meta);
          return a;
        }
        // One page at a time, whole rows of cards, with the same pager as the game list.
        async function show(n, scroll = false) {
          const mine = ++seq;
          const perPage = fitPerPage(box());
          box().setAttribute("aria-busy", "true");
          if (!box().querySelector(".game")) box().replaceChildren(...skeletonCards(perPage));
          const q = new URLSearchParams({ page: String(n), pageSize: String(perPage), sort: $("retro-sort").value });
          if (system) q.set("system", system);
          const search = $("retro-search").value.trim();
          if (search) q.set("search", search);
          try {
            const d = await getJson("/api/retro/games?" + q);
            if (mine !== seq) return; // a newer search or system took over
            const pages = Math.max(1, Math.ceil(d.total / perPage));
            if (d.total && n > pages) return show(pages, scroll);
            page = n;
            shownPer = perPage;
            box().replaceChildren(...d.games.map(card));
            $("retro-count").textContent = d.total;
            $("retro-empty").hidden = d.total > 0;
            $("retro-empty").textContent = t("retro.empty");
            const from = (n - 1) * perPage;
            renderPager($("retro-pager"), n, pages, d.total, from + 1, from + d.games.length, (to) => show(to, true));
            if (scroll) box().scrollIntoView({ behavior: "smooth", block: "start" });
          } catch {
            if (mine === seq) { box().replaceChildren(); $("retro-pager").replaceChildren(); }
          } finally {
            if (mine === seq) box().setAttribute("aria-busy", "false");
          }
        }
        const reload = () => show(1);
        let searchTimer = null;
        $("retro-search").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(reload, 250); });
        $("retro-sort").addEventListener("change", reload);
        // A resize changes how many cards fit a page; keep the first card on screen.
        window.addEventListener("resize", debounce(() => {
          if (!systems || !shownPer || box().offsetParent === null) return;
          const per = fitPerPage(box());
          if (per !== shownPer) show(Math.floor(((page - 1) * shownPer) / per) + 1);
        }, 150));
        return {
          async open() {
            if (systems) return;
            try {
              systems = (await getJson("/api/retro/systems")).systems;
            } catch {
              systems = [];
            }
            renderSystems();
            reload();
          },
          // Preview: each console's best-rated games on a shelf, as the client app's home shows them.
          async openHome() {
            const rows = $("retro-rows");
            if (rows.dataset.lang === lang) return;
            rows.dataset.lang = lang;
            rows.setAttribute("aria-busy", "true");
            if (!rows.querySelector(".home-row")) rows.replaceChildren(...skeletonShelves(2));
            if (!systems) await this.open(); // cards name their console from the system list
            let d;
            try {
              d = await getJson("/api/retro/home?limit=20");
            } catch {
              rows.replaceChildren();
              rows.setAttribute("aria-busy", "false");
              return;
            }
            rows.replaceChildren(...d.systems.filter((s) => s.games.length).map((s) => {
              const block = document.createElement("div"); block.className = "home-row";
              const h = document.createElement("h2");
              if (s.iconUrl) { const im = document.createElement("img"); im.className = "sys-icon"; im.src = s.iconUrl; im.alt = ""; im.loading = "lazy"; h.append(im); }
              h.append(document.createTextNode(nameOf(s)));
              const n = document.createElement("span"); n.className = "row-count"; n.textContent = s.romCount.toLocaleString();
              h.append(n);
              const list = document.createElement("div"); list.className = "recent";
              list.append(...s.games.map(card));
              block.append(h, list);
              return block;
            }));
            rows.setAttribute("aria-busy", "false");
          },
          relabel() {
            if (systems) renderSystems();
            if (current === "retro-home") this.openHome();
          },
        };
      })();

      // One patch, save or homebrew app in detail, opened from its list row.
      const xmodal = (() => {
        const node = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
        function show({ icon, title, sub, pills = [], meta = [], desc = "", source = null, sections = [], download = null }) {
          const img = $("xm-icon");
          img.hidden = !icon; if (icon) img.src = icon; else img.removeAttribute("src");
          img.onerror = () => { img.hidden = true; };
          $("xm-title").textContent = title || "—";
          $("xm-sub").textContent = sub || "";
          $("xm-pills").replaceChildren(...pills.map(([text, cls]) => node("span", "pill" + (cls ? " " + cls : ""), text)));
          $("xm-pills").hidden = !pills.length;
          $("xm-meta").replaceChildren(...meta.filter(([, v]) => v != null && v !== "").map(([k, v]) => {
            const d = node("div", null, k); d.append(node("strong", null, String(v))); return d;
          }));
          $("xm-desc").textContent = desc || "";
          const src = $("xm-source");
          src.hidden = !source;
          if (source) {
            src.replaceChildren(document.createTextNode(source.label + ": "));
            if (source.url) { const a = node("a", null, source.name); a.href = source.url; a.target = "_blank"; a.rel = "noopener noreferrer"; src.append(a); }
            else src.append(document.createTextNode(source.name));
          }
          $("xm-sections").replaceChildren(...sections.filter((x) => x.items.length).map((x) => {
            const sec = node("section", "xm-section"); sec.append(node("h4", null, x.title), ...x.items); return sec;
          }));
          const dl = $("xm-download");
          dl.hidden = !download;
          if (download) dl.href = download;
          $("xmodal").classList.add("open"); $("xmodal").setAttribute("aria-hidden", "false");
          $("xm-close").focus();
        }
        function close() { $("xmodal").classList.remove("open"); $("xmodal").setAttribute("aria-hidden", "true"); }
        $("xmodal").addEventListener("click", (e) => { if (e.target === $("xmodal")) close(); });
        $("xm-close").addEventListener("click", close);
        document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("xmodal").classList.contains("open")) close(); });
        return { show, close };
      })();

      // A game's patches in its detail, as the console shows them: the ones it needs
      // to run as a notice at the top; the group of the others is returned for
      // the "what to install" panel (null when there are none).
      function renderModalPatches(list) {
        const box = $("modal-patches");
        const group = (cls, title, items, note) => {
          const g = document.createElement("section"); g.className = "mp-group" + (cls ? " " + cls : "");
          const h = document.createElement("h4"); h.textContent = title;
          const n = document.createElement("span"); n.className = "count"; n.textContent = String(items.length); h.append(n);
          g.append(h);
          if (note) { const p = document.createElement("p"); p.className = "mp-note"; p.textContent = note; g.append(p); }
          for (const it of items) g.append(extras.row("patches", it));
          return g;
        };
        const need = list.filter((p) => p.required === true);
        const rest = list.filter((p) => p.required !== true);
        box.replaceChildren(...(need.length ? [group("need", t("patches.need"), need, t("patches.needNote"))] : []));
        box.hidden = !need.length;
        return rest.length ? group("", t("patches.related"), rest) : null;
      }

      // Patches and saves: one block per game with its files, filtered by a search.
      // Patches, saves, tools and ports open newest update first; the order picked is kept per list.
      const XSORT_KEY = "cookingfoil:xsort:";
      const xsortOf = (view) => { try { return localStorage.getItem(XSORT_KEY + view) || "updated"; } catch { return "updated"; } };
      const timeOf = (v) => { if (v == null || v === "") return 0; const n = typeof v === "number" ? v : Date.parse(v); return Number.isFinite(n) ? n : 0; };
      for (const sel of document.querySelectorAll("select[data-xsort]")) {
        const view = sel.dataset.xsort;
        sel.value = xsortOf(view);
        if (!sel.value) sel.value = "updated";
        sel.addEventListener("change", () => {
          try { localStorage.setItem(XSORT_KEY + view, sel.value); } catch { /* this visit only */ }
          if (view === "patches" || view === "saves") extras.resort(view); else homebrew.resort(view);
        });
      }
      const xorder = (view) => $(view + "-sort").value || "updated";

      const extras = (() => {
        const data = {};   // kind → items
        const loadedLang = {};
        const iconPath = (u) => { try { return new URL(u, location.href).pathname + "?size=sm"; } catch { return ""; } };
        const gameName = (it) => (it.homebrew ? homebrew.nameOf(it.homebrew) : it.game?.names?.[lang] || it.game?.name || it.titleId || it.title_id);
        const folded = (x) => String(x ?? "").normalize("NFC").toLowerCase();
        const updateLabel = (it) => `v${it.update_version}` + (it.game_version ? ` (${it.game_version})` : "");
        function itemRow(kind, it) {
          const row = document.createElement("div"); row.className = "xitem";
          const head = document.createElement("div");
          const name = document.createElement("div"); name.className = "xname"; name.textContent = it.name;
          const meta = document.createElement("div"); meta.className = "xmeta";
          const pill = (text) => { const p = document.createElement("span"); p.className = "pill"; p.textContent = text; return p; };
          for (const k of it.kinds ?? []) meta.append(pill(t("kind." + k)));
          meta.append(document.createTextNode(`${fmtBytes(it.size)} · ${t("extras.files", it.files)}`));
          // The update a patch was made for, as a reference; which update to install stays the reader's choice.
          if (it.update_version) meta.append(document.createTextNode(` · ${t("extras.forUpdate", updateLabel(it))}`));
          head.append(name, meta);
          const dl = document.createElement("a");
          dl.className = "btn"; dl.textContent = t("extras.download"); dl.setAttribute("download", "");
          dl.href = kind === "patches" ? `/api/patches/${encodeURIComponent(it.id)}/download` : it.url;
          row.append(head, dl);
          // Saves credit their source on the description's last line; show it as a link instead.
          let text = it.description || "";
          if (kind === "saves" && it.source) text = text.split("\n").slice(0, -1).join("\n");
          if (text) {
            const desc = document.createElement("div"); desc.className = "xdesc"; desc.textContent = text;
            desc.addEventListener("click", () => desc.classList.toggle("open"));
            row.append(desc);
          }
          if (kind === "saves" && it.source) {
            const src = document.createElement("div"); src.className = "xsrc";
            src.append(document.createTextNode(t("extras.source") + ": "));
            if (it.source.url) {
              const a = document.createElement("a"); a.href = it.source.url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = it.source.name;
              src.append(a);
            } else src.append(document.createTextNode(it.source.name));
            row.append(src);
          }
          return row;
        }
        // Patch and save dates come as Unix seconds; an ISO string or milliseconds also read right.
        const day = (at) => (at ? new Date(typeof at === "number" && at < 1e12 ? at * 1000 : at).toLocaleDateString(lang) : "");
        // What a patch or save shows in its detail.
        function detail(kind, it) {
          const icon = it.homebrew ? homebrew.iconOf(it.homebrew) : it.game?.icon ? iconPath(it.game.icon).replace("size=sm", "size=md") : "";
          const text = kind === "saves" && it.source ? String(it.description || "").split("\n").slice(0, -1).join("\n") : it.description;
          return {
            icon,
            title: it.name,
            sub: gameName(it),
            pills: [...(it.required === true ? [[t("xm.required"), "need"]] : []), ...(it.kinds ?? []).map((k) => [t("kind." + k)])],
            meta: [
              [t("xm.size"), fmtBytes(it.size)],
              [t("xm.files"), it.files],
              [t("xm.version"), it.version],
              [t("xm.gameVersion"), it.game_version || it.gameVersion],
              [t("xm.forUpdate"), it.update_version ? `v${it.update_version}` : ""],
              [t("xm.author"), it.author],
              [t("xm.updated"), day(it.updatedAt || it.updated_at)],
            ],
            desc: text,
            source: kind === "saves" && it.source ? { label: t("extras.source"), name: it.source.name, url: it.source.url } : null,
            download: kind === "patches" ? `/api/patches/${encodeURIComponent(it.id)}/download` : it.url,
          };
        }
        // One line per item, as on the client; the row opens its detail.
        function listRow(kind, it) {
          const row = document.createElement("button"); row.type = "button"; row.className = "xrow";
          const head = document.createElement("div");
          const name = document.createElement("div"); name.className = "xname"; name.textContent = it.name;
          const meta = document.createElement("div"); meta.className = "xmeta";
          const pill = (text, cls) => { const p = document.createElement("span"); p.className = "pill" + (cls ? " " + cls : ""); p.textContent = text; return p; };
          if (it.required === true) meta.append(pill(t("xm.required"), "need"));
          for (const k of it.kinds ?? []) meta.append(pill(t("kind." + k)));
          meta.append(document.createTextNode(fmtBytes(it.size)));
          head.append(name, meta);
          // The description's first line, so a row says what it is before it is opened.
          const first = String(it.description || "").split("\n").find((x) => x.trim()) ?? "";
          if (first && !(kind === "saves" && it.source && first === String(it.description).trim())) {
            const line = document.createElement("div"); line.className = "xline"; line.textContent = first; head.append(line);
          }
          const more = document.createElement("span"); more.className = "more"; more.textContent = t("xm.more");
          row.append(head, more);
          row.addEventListener("click", () => xmodal.show(detail(kind, it)));
          return row;
        }
        const PAGE = 20;   // games per page
        const pageOf = { patches: 1, saves: 1 };
        const opened = { patches: new Set(), saves: new Set() };   // games the reader opened
        // Shimmering groups in the list's shape while it loads.
        function skeleton(kind) {
          const bar = (w) => { const b = document.createElement("b"); b.className = "sk"; b.style.width = w; return b; };
          const groups = [0, 1, 2].map(() => {
            const g = document.createElement("section"); g.className = "xgroup xskel"; g.setAttribute("aria-hidden", "true");
            const head = document.createElement("header");
            const icon = document.createElement("i"); icon.className = "sk";
            head.append(icon, bar("40%"));
            g.append(head);
            for (const w of ["62%", "46%"]) { const row = document.createElement("div"); row.className = "xitem"; row.append(bar(w)); g.append(row); }
            return g;
          });
          $(kind + "-list").replaceChildren(...groups);
          $(kind + "-empty").hidden = true;
          $(kind + "-pager").replaceChildren();
        }
        function render(kind) {
          const list = $(kind + "-list");
          const q = folded($(kind + "-search").value.trim());
          const byName = (a, b) => String(a).localeCompare(String(b), lang, { numeric: true });
          const updated = (it) => timeOf(it.updated_at ?? it.updatedAt);
          // A game's items stay together: the games are ordered by the pick (newest item, name, total size), then its items.
          const order = xorder(kind);
          const games = new Map();
          for (const it of (data[kind] ?? []).filter((it) => !q || [gameName(it), it.name, it.description].some((x) => folded(x).includes(q)))) {
            const tid = it.titleId || it.title_id || "hb:" + it.homebrew;
            if (!games.has(tid)) games.set(tid, []);
            games.get(tid).push(it);
          }
          const gameKey = (list) => ({ updated: Math.max(...list.map(updated)), size: list.reduce((n, it) => n + (Number(it.size) || 0), 0) });
          const ranked = [...games.values()].map((list) => ({ list, name: gameName(list[0]), ...gameKey(list) }));
          ranked.sort((a, b) =>
            order === "updated" ? b.updated - a.updated || byName(a.name, b.name)
            : order === "size" ? b.size - a.size || byName(a.name, b.name)
            : order === "name-desc" ? byName(b.name, a.name)
            : byName(a.name, b.name));
          const within = (a, b) =>
            order === "updated" ? updated(b) - updated(a) || byName(a.name, b.name)
            : order === "size" ? (Number(b.size) || 0) - (Number(a.size) || 0) || byName(a.name, b.name)
            : order === "name-desc" ? byName(b.name, a.name)
            : byName(a.name, b.name);
          const items = ranked.flatMap((g) => g.list);
          // Pages hold whole games, so a game with many items never runs across pages.
          const pages = Math.max(1, Math.ceil(ranked.length / PAGE));
          const page = Math.min(pageOf[kind], pages);
          pageOf[kind] = page;
