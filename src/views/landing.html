            const r = await fetch(`/api/art/retro/${encodeURIComponent(g.id)}/boxart`, { method: "POST", body: fd, headers: { Accept: "application/json" } });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) { toast(d.error || t("art.failed")); return; }
          } catch { toast(t("art.failed")); return; }
          toast(t("art.saved"));
          for (const k of [...retroDetailCache.keys()]) if (k.startsWith(g.id + ":")) retroDetailCache.delete(k);
          for (const kind of ["icon", "boxart"]) refreshArtImages(`/api/retro/games/${g.id}/${kind}`, null);
          window.dispatchEvent(new CustomEvent("cf-art-changed", { detail: { kind: "retro", id: g.id } }));
          const d = await retroDetail(g.id);
          if (d && mine === retroSeq && $("modal").classList.contains("open")) renderRetroModal({ ...g, ...d }, sys, false);
        }
        box.append(artEditor({ slots: { icon: { url: g.boxartUrl || null, caption: t("art.boxart") }, shots: null }, upload, cut: false, note: t("art.retroNote"),
          find: { q: "", slot: "boxart", retro: g.id } }));
        box.hidden = false;
      }

      // The files of a game (a patch beside the official release, an arcade set's
      // other regions), one even when it is alone: the list shows one card, the
      // window picks among them and redraws itself as the version picked.
      function showRetroVersions(g, sys) {
        const box = $("modal-extras");
        box.replaceChildren();
        if (!Array.isArray(g.variants) || !g.variants.length) return;
        const head = document.createElement("div");
        head.className = "extras-head";
        head.textContent = t("retro.versionsCount", g.variants.length);
        box.append(head);
        for (const v of g.variants) {
          const row = document.createElement("button");
          row.type = "button";
          row.classList.add("version-row");
          const current = v.id === g.id;
          row.setAttribute("aria-pressed", String(current));
          const sub = [
            v.edition?.korean ? t("pill.korean") : "",
            v.representative && g.variants.length > 1 ? t("retro.listed") : "",
            v.missing ? t("retro.cantRun") : "",
          ].filter(Boolean).join(" · ");
          detailRow(row, { name: v.variant || v.name, sub, size: v.size, flag: REGION_FLAGS[v.region] || "", mark: true, title: v.file });
          row.addEventListener("click", () => { if (!current) openRetroModal(v, sys); });
          box.append(row);
        }
      }

      function closeModal() {
        $("modal").classList.remove("open"); $("modal").setAttribute("aria-hidden", "true"); gameEdit.leave();
        // A hidden player keeps playing: drop it, and any answer still on its way.
        videosSeq++; fillVideos([]);
      }
      $("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal(); });
      $("modal-close").addEventListener("click", closeModal);
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

      // The top-right close does what the window's own close button does.
      for (const x of document.querySelectorAll(".modal-x")) {
        x.addEventListener("click", () => x.closest(".modal-backdrop")?.querySelector('.modal-actions [id$="close"], [id$="-close"]')?.click());
      }

      // ─── toolbar wiring ───────────────────────────────────────────────────
      $("search").addEventListener("input", debounce(() => { state.q = $("search").value.trim().toLowerCase(); state.page = 1; applyFilters(); }, 100));
      $("chips").addEventListener("click", (e) => {
        if (!(e.target instanceof HTMLButtonElement)) return;
        for (const c of $("chips").children) c.classList.toggle("active", c === e.target);
        state.kind = e.target.dataset.kind; state.page = 1; applyFilters();
      });
      // Zooming or resizing changes the column count; keep the first visible card on screen.
      window.addEventListener("resize", debounce(() => {
        const next = fitPerPage();
        if (next === state.perPage) return;
        const first = (state.page - 1) * state.perPage;
        state.page = Math.floor(first / next) + 1;
        applyFilters();
      }, 150));
      $("sort").addEventListener("change", () => { state.sort = $("sort").value; state.page = 1; applyFilters(); });
      $("refresh-btn").addEventListener("click", async () => {
        $("refresh-btn").disabled = true;
        await loadCatalog();
        $("refresh-btn").disabled = false;
        toast(t("toast.refresh"));
      });

      // language toggle
      const langList = $("lang-list");
      function setLangMenu(open) {
        langList.hidden = !open;
        $("lang-btn").setAttribute("aria-expanded", String(open));
        if (!open) return;
        langList.style.left = ""; langList.style.right = "";
        if (langList.getBoundingClientRect().left < 8) { langList.style.left = "0"; langList.style.right = "auto"; }
        langList.querySelector(".active")?.focus();
      }
      $("lang-btn").addEventListener("click", (e) => { e.stopPropagation(); setAcctMenu(false); setLangMenu(langList.hidden); });
      langList.addEventListener("click", (e) => {
        const b = e.target.closest("[data-lang]");
        if (!b) return;
        lang = b.dataset.lang;
        try { localStorage.setItem(LANG_KEY, lang); } catch { /* storage blocked: keep it for this visit */ }
        setLangMenu(false);
        $("lang-btn").focus();
        applyI18n();
        renderGenreChips();
        renderSteamChips();
        retro.relabel();
        extras.relabel();
        activityMenu.relabel();
        homebrew.relabel();
        share.relabel();
        if (current) renderSubtabs(current);
      });
      document.addEventListener("click", (e) => { if (!langList.hidden && !e.target.closest("#lang-menu")) setLangMenu(false); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !langList.hidden) { setLangMenu(false); $("lang-btn").focus(); } });

      // account menu: devices, admin, sign out
      const acctList = $("acct-list");
      function setAcctMenu(open) {
        acctList.hidden = !open;
        $("acct-btn").setAttribute("aria-expanded", String(open));
        activityMenu.setOpen(open);
        if (open) activityMenu.permissions(session);
        if (open) acctList.querySelector("a:not([hidden])")?.focus();
      }
      $("acct-btn").addEventListener("click", (e) => { e.stopPropagation(); setLangMenu(false); setAcctMenu(acctList.hidden); });
      document.addEventListener("click", (e) => { if (!acctList.hidden && !e.target.closest("#acct-menu")) setAcctMenu(false); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !acctList.hidden) { setAcctMenu(false); $("acct-btn").focus(); } });

      // ─── theme ────────────────────────────────────────────────────────────
      // The system setting until the switch in the account menu is used; the choice is kept
      // under one key with the admin pages. The head script applies it before paint and keeps
      // the address-bar colour in step.
      const THEME_KEY = "cookingfoil:theme";
      const systemLight = window.matchMedia("(prefers-color-scheme: light)");
      const currentTheme = () => document.documentElement.dataset.theme || (systemLight.matches ? "light" : "dark");
      function syncThemeChrome() {
        $("theme-toggle").setAttribute("aria-checked", String(currentTheme() === "dark"));
        // covers already showing the no-image card take the one drawn for this theme
        for (const img of document.querySelectorAll("img")) {
          if (img.src === COVER_PLACEHOLDER_LIGHT || img.src === COVER_PLACEHOLDER_DARK) img.src = coverPlaceholder();
        }
      }
      function setTheme(choice) {
        document.documentElement.dataset.theme = choice;
        try { localStorage.setItem(THEME_KEY, choice); } catch { /* storage blocked: keep it for this visit */ }
        syncThemeChrome();
      }
      $("theme-toggle").addEventListener("click", () => setTheme(currentTheme() === "dark" ? "light" : "dark"));
      systemLight.addEventListener("change", syncThemeChrome);
      syncThemeChrome();

      // ─── scroll progress ──────────────────────────────────────────────────
      let scrollTicking = false;
      function flushScroll() {
        const h = document.documentElement;
        const max = (h.scrollHeight - h.clientHeight) || 1;
        const pct = Math.min(100, Math.max(0, (h.scrollTop / max) * 100));
        $("scroll-progress").style.width = pct + "%";
        scrollTicking = false;
      }
      document.addEventListener("scroll", () => {
        if (!scrollTicking) { scrollTicking = true; requestAnimationFrame(flushScroll); }
      }, { passive: true });

      // Clicking a stat card jumps to the library, swapping the filter
      // when the stat maps to a kind.
      function bindStatClick(id, kind) {
        const el = $(id)?.parentElement; if (!el) return;
        el.addEventListener("click", () => {
          if (kind) {
            for (const c of $("chips").children) c.classList.toggle("active", c.dataset.kind === kind);
            state.kind = kind; state.page = 1; applyFilters();
          }
          $("games").scrollIntoView({ behavior: "smooth", block: "start" });
        });
      }
      bindStatClick("stat-games",   "base");
      bindStatClick("stat-updates", "update");
      bindStatClick("stat-dlc",     "dlc");
      bindStatClick("stat-size",    null);

      applyI18n();
      renderSkeletons();
      loadCatalog();

      // ─── share inbox ──────────────────────────────────────────────────────
      // Signed-in people leave files, a note and links for the admin (POST /api/inbox).
      // The account menu offers it once the server says the inbox is on.
      const share = (() => {
        let picked = [];   // [{ file, path }]
        let maxBytes = 0;
        const total = () => picked.reduce((n, p) => n + p.file.size, 0);
        function relabel() {
          $("share-chosen").textContent = picked.length ? t("share.chosen", picked.length, fmtBytes(total())) : t("share.none");
          $("share-drop").classList.toggle("has", picked.length > 0);
        }
        function say(text, kind = "") { const m = $("share-msg"); m.textContent = text; m.className = "share-msg" + (kind ? " " + kind : ""); }
        function choose(list) { picked = list; say(""); relabel(); }
        async function check() {
          try {
            const r = await fetch("/api/inbox", { headers: { Accept: "application/json" } });
            const d = r.ok ? await r.json() : null;
            maxBytes = d?.maxBytes || 0;
            $("inbox-link").hidden = !d?.enabled;
          } catch { $("inbox-link").hidden = true; }
        }
        function open() {
          setAcctMenu(false);
          say(""); relabel();
          openSheet("share-modal");
          if (finePointer()) $("share-memo").focus();
          else $("share-modal").querySelector(".modal").focus({ preventScroll: true });
        }
        function close() { $("share-modal").classList.remove("open"); $("share-modal").setAttribute("aria-hidden", "true"); }
        // A dropped folder arrives as an entry to walk; its files keep their paths inside it.
        async function walk(entry, prefix = "") {
          if (entry.isFile) return [{ file: await new Promise((res, rej) => entry.file(res, rej)), path: prefix + entry.name }];
          const reader = entry.createReader();
          const out = [];
          for (;;) {
            const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
            if (!batch.length) return out;
            for (const e of batch) out.push(...(await walk(e, prefix + entry.name + "/")));
          }
        }
        const badLinks = (text) => text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean).some((l) => {
          try { const u = new URL(l); return u.protocol !== "http:" && u.protocol !== "https:"; } catch { return true; }
        });
        const ERR = { empty: "share.empty", "bad-link": "share.bad_link", "too-many-links": "share.bad_link", "memo-too-long": "share.memo_long", full: "share.full", rate: "share.rate",
          signin: "share.signin", off: "share.off", limit: "share.limit", error: "share.server" };
        function send() {
          const memo = $("share-memo").value.trim(), links = $("share-links").value.trim();
          if (!picked.length && !memo && !links) return say(t("share.empty"), "bad");
          if (badLinks(links)) return say(t("share.bad_link"), "bad");
          if (maxBytes && total() > maxBytes) return say(t("share.too_big", fmtBytes(maxBytes)), "bad");
          const fd = new FormData();
          for (const p of picked) fd.append("files", p.file, p.file.name);
          if (picked.some((p) => p.path !== p.file.name)) fd.append("paths", JSON.stringify(picked.map((p) => p.path)));
          fd.append("memo", memo);
          fd.append("links", links);
          const xhr = new XMLHttpRequest();
          xhr.open("POST", "/api/inbox");
          xhr.setRequestHeader("X-CSRF-Token", session?.csrf ?? "");
          $("share-send").disabled = true;
          $("share-progress").hidden = false; $("share-bar").style.width = "0%";
          say(t("share.sending", 0));
          xhr.upload.addEventListener("progress", (e) => {
            if (!e.lengthComputable) return;
            const pct = Math.round((e.loaded / e.total) * 100);
            $("share-bar").style.width = pct + "%";
            say(t("share.sending", pct));
          });
          const finish = () => { $("share-send").disabled = false; $("share-progress").hidden = true; };
          xhr.addEventListener("load", () => {
            finish();
            let body = {};
            try { body = JSON.parse(xhr.responseText); } catch { /* not JSON */ }
            if (xhr.status === 201) {
              $("share-form").reset(); picked = []; relabel();
              return say(t("share.done"), "ok");
            }
            if (body.code === "too-big") return say(t("share.too_big", fmtBytes(maxBytes)), "bad");
            say(ERR[body.code] ? t(ERR[body.code]) : t("share.failed", body.error || "HTTP " + xhr.status), "bad");
          });
          xhr.addEventListener("error", () => { finish(); say(t("share.failed", t("share.network")), "bad"); });
          xhr.send(fd);
        }
        $("inbox-link").addEventListener("click", (e) => { e.preventDefault(); open(); });
        $("share-close").addEventListener("click", close);
        $("share-modal").addEventListener("click", (e) => { if (e.target === $("share-modal")) close(); });
        document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("share-modal").classList.contains("open")) close(); });
        $("share-pick-files").addEventListener("click", () => $("share-files").click());
        $("share-pick-folder").addEventListener("click", () => $("share-folder").click());
        $("share-files").addEventListener("change", (e) => choose([...e.target.files].map((file) => ({ file, path: file.name }))));
        $("share-folder").addEventListener("change", (e) => choose([...e.target.files].map((file) => ({ file, path: file.webkitRelativePath || file.name }))));
        const drop = $("share-drop");
        drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
        drop.addEventListener("dragleave", () => drop.classList.remove("over"));
        drop.addEventListener("drop", async (e) => {
          e.preventDefault(); drop.classList.remove("over");
          const entries = [...(e.dataTransfer?.items ?? [])].map((i) => i.webkitGetAsEntry?.()).filter(Boolean);
          if (entries.length) choose((await Promise.all(entries.map((en) => walk(en)))).flat());
          else choose([...(e.dataTransfer?.files ?? [])].map((file) => ({ file, path: file.name })));
        });
        $("share-form").addEventListener("submit", (e) => { e.preventDefault(); send(); });
        relabel();
        return { check, relabel, open };
      })();

      // ─── picture editing ────────────────────────────────────────────────
      // The edit page in a detail window (pictures and facts) is for admin accounts, whatever the
      // web-uploads setting says: /api/art/access answers 200 to an admin and 403 to anyone else.
      let canEditArt = false;
      fetch("/api/art/access", { headers: { Accept: "application/json" } })
        .then((r) => { canEditArt = r.ok; })
        .catch(() => { /* off for this visit */ });

      __ACTIVITY_SCRIPT__

      // ─── realtime: WebSocket library push ─────────────────────────────────
      // The dashboard re-fetches /api/library/sections on every library-updated event so
      // additions, removals and metadata refreshes appear without a manual
      // reload. We never push the body itself — the ETag short-circuits
      // unchanged responses to 304.
      let ws = null;
      let wsRetry = 0;
      let wsReloadTimer = null;
      let wsReloadAt = 0;
      let wsPending = false;
      const LIVE_GAP_MS = 15_000;
      function scheduleReload() {
        // The server rebuilds once per file it reads (names, icons), so a scan sends a stream of these.
        // They fold into one quiet reload at most every 15 seconds, and wait while the tab is hidden.
        if (document.hidden) { wsPending = true; return; }
        if (wsReloadTimer) return;
        const wait = Math.max(1500, LIVE_GAP_MS - (Date.now() - wsReloadAt));
        wsReloadTimer = setTimeout(() => { wsReloadTimer = null; wsReloadAt = Date.now(); loadCatalog({ quiet: true }); }, wait);
      }
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && wsPending) { wsPending = false; scheduleReload(); }
      });
      let restartShown = null;
      function showRestart(notice) {
        const id = notice.restart_id;
        if (!id || id === restartShown) return;
        restartShown = id;
        const banner = $("restart-banner");
        banner.textContent = t("restart.notice");
        banner.hidden = false;
      }
      function hideRestart() { $("restart-banner").hidden = true; }
      function connectWs() {
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        try {
          ws = new WebSocket(`${proto}//${location.host}/ws/library`);
        } catch (err) {
          console.warn("[CookingFoil] ws construct failed:", err);
          scheduleReconnect();
          return;
        }
        ws.addEventListener("open", () => {
          wsRetry = 0;
          activityMenu.setLive(true);
          console.info("[CookingFoil] ws connected");
        });
        ws.addEventListener("message", (ev) => {
          let msg;
          try { msg = JSON.parse(ev.data); } catch { return; }
          if (msg.type === "activity") activityMenu.apply(msg);
          if (msg.type === "library-updated") scheduleReload();
          // Safe restart: shown once per restart, gone when the server answers again.
          if (msg.type === "restarting") showRestart(msg);
          if (msg.type === "hello") { if (msg.restarting) showRestart(msg.restarting); else hideRestart(); }
        });
        ws.addEventListener("close", () => { ws = null; activityMenu.setLive(false); scheduleReconnect(); });
        ws.addEventListener("error", () => { /* close fires next */ });
      }
      function scheduleReconnect() {
        // Exponential backoff capped at 30s.
        const delay = Math.min(30_000, 1000 * Math.pow(2, Math.min(wsRetry++, 5)));
        setTimeout(connectWs, delay);
      }
      connectWs();
    </script>
  </body>
</html>
