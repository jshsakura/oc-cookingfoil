          line.append(h, ...labels.map((l) => Object.assign(document.createElement("span"), { className: "chip", textContent: l })));
          box.append(line);
        }
      }
      function fillShots(urls, loading) {
        const scr = $("modal-screens"); scr.replaceChildren(...(loading ? shotSkeletons() : []));
        for (const url of urls) {
          const im = document.createElement("img");
          im.loading = "lazy"; im.src = bustUrl(url); im.alt = "";
          // A screenshot that is not on disk yet is hidden, never a broken-image glyph.
          im.onerror = () => im.remove();
          scr.append(im);
        }
      }
      // One row of a list in the window: [mark?, flag?] name over a second line, size on the right.
      function detailRow(el, { name, sub = "", size = 0, flag = "", mark = false, title = "" }) {
        el.classList.add("extra-row");
        const main = document.createElement("span"); main.className = "extra-main";
        if (mark) main.append(Object.assign(document.createElement("span"), { className: "mark" }));
        if (flag) main.append(Object.assign(document.createElement("span"), { className: "flag", textContent: flag }));
        const text = document.createElement("span"); text.className = "extra-text";
        const nameEl = document.createElement("span"); nameEl.className = "extra-name"; nameEl.textContent = name;
        if (title) nameEl.title = title;
        text.append(nameEl, Object.assign(document.createElement("span"), { className: "extra-sub", textContent: sub }));
        main.append(text);
        const sizeEl = document.createElement("span"); sizeEl.className = "extra-size"; sizeEl.textContent = size > 0 ? fmtBytes(size) : "";
        el.append(main, sizeEl);
        return el;
      }

      // A file's version from its `[v65536]` name stamp.
      const fileVersion = (f) => Number((f.name || "").match(/\[v(\d+)\]/)?.[1] ?? 0);
      // The shop's display version ("1.4.1") of one file, when it has read it.
      const versionName = (titleId, version) => sectionFiles.get(String(titleId || "").toUpperCase() + ":" + version)?.version_name;

      // What the window shows about a Switch game, from the list row, its sections
      // item and (once fetched) its detail; detail wins over the sparse rows.
      function switchFacts(r, detail, baseId) {
        const f = r.item;
        const td = { ...(r.tdb || {}), ...detail };
        const m = sectionOf.get(baseId) || {};
        const group = renderedItems.filter((x) => (x.item.baseTitleId || x.item.titleId || "").toUpperCase() === baseId);
        const p = detail.price
          ? { regular: detail.price.regular, discount: detail.price.discount, ends: detail.price.discountEnds }
          : m.price_regular ? { regular: m.price_regular, discount: m.price_discount, ends: m.price_discount_ends } : null;
        const sale = Boolean(p?.discount) && !(Date.parse(p.ends) <= Date.now());
        const sc = Number.isFinite(td.score)
          ? { score: td.score, count: td.scoreCount, key: td.scoreLabelKey, label: td.scoreLabel }
          : scoreOf.has(baseId) ? { ...scoreOf.get(baseId), key: scoreOf.get(baseId).label, label: null } : null;
        const latest = td.latestVersion ?? m.latest_version ?? null;
        const latestFile = group.find((x) => x.kind === "update" && fileVersion(x.item) === latest);
        return {
          td, group,
          name: pickName(r.kind === "base" ? (td.names || m.names) : null, cleanName(nameWithAlias(f.name || t("misc.unnamed"), td.aliases || []))),
          publisher: td.publisher || m.publisher || "",
          languages: td.languages || m.languages || [],
          price: p ? { ...p, sale } : null,
          score: sc,
          genres: Array.isArray(td.categoryLabels) ? td.categoryLabels : (m.categories || []).map(genreLabel),
          release: fmtDate(td.releaseDate || m.release_date),
          players: fmtPlayers(Number(td.numberOfPlayers ?? m.players)),
          baseSize: group.find((x) => x.kind === "base")?.size || (r.kind === "base" ? r.size : 0) || td.size || 0,
          installSize: m.install_size || 0,
          firmware: td.requiredFirmware || m.required_firmware || "",
          rating: [td.rating != null ? String(td.rating) : "", (td.ratingContent || []).join(", ")].filter(Boolean).join(" · "),
          dlcTotal: Number(td.dlcTotal ?? m.dlc_total) || 0,
          dlcHere: group.filter((x) => x.kind === "dlc").length,
          latest: latest != null ? fmtVersion(latest, latestFile && versionName(latestFile.item.titleId, latest)) : "",
          region: td.region || m.region || "",
        };
      }

      // Header, pills, notes, description, info table and chips of a Switch game.
      function renderSwitchModal(r, detail, baseId, loading) {
        const f = r.item;
        const x = switchFacts(r, detail, baseId);
        $("modal-title").textContent = x.name;
        $("modal-publisher").textContent = x.publisher === "CookingFoil" ? "" : x.publisher;
        const genreText = x.genres.join(", ");
        fillPills([
          [x.languages.includes("ko") ? t("pill.korean") : "", "need"],
          [x.score ? t("pill.score", x.score.score) : ""],
          [x.price ? (x.price.sale ? t("pill.discount", x.price.discount) : t("pill.price", x.price.regular)) : ""],
          [genreText.length <= 24 ? genreText : ""],
        ]);
        $("modal-notes-text").textContent = x.td.notes || "";
        $("modal-notes").hidden = !x.td.notes;
        fillDesc(x.td.description, loading);
        const known = (v) => (loading && !v ? null : v || "");
        const dlc = [x.dlcTotal ? t("modal.dlcOut", x.dlcTotal) : "", x.dlcHere ? t("modal.dlcHere", x.dlcHere) : ""].filter(Boolean).join(" · ");
        fillMeta([
          [t("modal.price"), known(x.price ? (x.price.sale ? `${x.price.discount} (${x.price.regular})` : x.price.regular) : "")],
          [x.score?.count ? t("modal.scoreN", x.score.count) : t("modal.score"), known(x.score ? scoreText(x.score.score, x.score.key, x.score.label) : "")],
          [t("modal.release"), known(x.release)],
          [t("modal.publisher"), known(x.publisher)],
          [t("modal.players"), known(x.players)],
          [t("modal.baseSize"), x.baseSize > 0 ? fmtBytes(x.baseSize) : ""],
          [t("modal.installSize"), x.installSize > 0 ? fmtBytes(x.installSize) : ""],
          [t("modal.firmware"), known(x.firmware)],
          [t("modal.ageRating"), known(x.rating)],
          [t("chip.dlc"), known(dlc)],
          [t("modal.latest"), known(x.latest)],
          [t("modal.format"), fmtExt(f.url || f.name)],
          [t("modal.region"), known(x.region)],
          [t("modal.titleId"), f.titleId || "", true],
        ]);
        fillChips([[t("modal.languages"), x.languages.map(langName)], [t("modal.category"), x.genres]]);
        return x;
      }

      // "What to install", as the console's panel lists it: the base game, the
      // newest update only, every DLC, then the patches that are not required.
      function renderInstall(group, patchGroup) {
        const box = $("modal-install");
        const rows = [];
        const link = (f) => {
          const a = document.createElement("a");
          a.href = f.url || "#"; a.target = "_blank"; a.rel = "noopener";
          return a;
        };
        const base = group.find((x) => x.kind === "base");
        if (base) {
          const v = fileVersion(base.item);
          rows.push(detailRow(link(base.item), { name: t("install.base"), sub: [fmtVersion(v, versionName(base.item.titleId, v)), t("install.required")].join(" · "), size: base.size }));
        }
        const update = group.filter((x) => x.kind === "update").sort((a, b) => fileVersion(b.item) - fileVersion(a.item))[0];
        if (update) {
          const v = fileVersion(update.item);
          rows.push(detailRow(link(update.item), { name: t("install.update"), sub: [fmtVersion(v, versionName(update.item.titleId, v)), t("install.latest")].join(" · "), size: update.size }));
        }
        for (const d of group.filter((x) => x.kind === "dlc")) {
          rows.push(detailRow(link(d.item), { name: cleanName(d.item.name || t("misc.unnamed")), sub: t("chip.dlc"), size: d.size }));
        }
        box.replaceChildren();
        if (!rows.length && !patchGroup) { box.hidden = true; return; }
        const head = document.createElement("div"); head.className = "extras-head"; head.textContent = t("install.head");
        box.append(head, ...rows, ...(patchGroup ? [patchGroup] : []));
        box.hidden = false;
      }

      async function openModal(r) {
        currentModal = r;
        retroSeq++; // a retro detail still on its way must not land in this window
        const f = r.item;
        const baseId = (f.baseTitleId || f.titleId || "").toUpperCase();
        const validBase = /^[0-9A-F]{16}$/.test(baseId);
        const modalEl = document.querySelector("#modal .modal");
        const iconUrl = f.icon_url || (validBase ? `/api/shop/icon/${baseId}` : "");
        const cached = validBase ? detailCache.get(baseId + ":" + lang) : null;

        // Open at once with what the row already knows, shimmering where the
        // detail will land, instead of waiting on the network with nothing shown.
        modalEl.classList.toggle("loading", validBase && !cached);
        setCover(iconUrl);
        setPoster("");
        $("modal-flag").hidden = true; $("modal-where").hidden = true;
        const bannerBox = $("modal-banner");
        bannerBox.dataset.want = ""; bannerBox.classList.remove("no-art"); bannerBox.style.backgroundImage = "";
        renderSwitchModal(r, cached ? cached.detail : {}, baseId, validBase && !cached);
        fillShots([], validBase && !cached);
        $("modal-extras").replaceChildren(); $("modal-art").hidden = true;
        $("modal-install").replaceChildren(); $("modal-install").hidden = true;
        $("modal-patches").replaceChildren(); $("modal-patches").hidden = true;
        $("modal-download").href = f.url || "#";
        $("modal-download").removeAttribute("download");
        $("modal-download").textContent = t("action.download");
        $("modal").classList.add("open"); $("modal").setAttribute("aria-hidden", "false");

        // Rich metadata (description, publisher, screenshots, release, region,
        // rating, players) lives behind /api/title/:id because the shop
        // response drops the top-level titledb map (CyberFoil ghost-row
        // avoidance). Fetch that detail alongside operator-supplied art
        // (best effort) so the modal shows full info instead of "—".
        let art = { icon: false, banner: false, screens: [] };
        let detail = {};
        if (cached) {
          ({ art, detail } = cached);
        } else if (validBase) {
          const [ar, dr] = await Promise.all([
            fetch(`/api/art/${baseId}`, { headers: { Accept: "application/json" } }).catch(() => null),
            fetch(`/api/title/${baseId}?lang=${lang}`, { headers: { Accept: "application/json" } }).catch(() => null),
          ]);
          try { if (ar && ar.ok) art = await ar.json(); } catch { /* best effort */ }
          try { if (dr && dr.ok) detail = await dr.json(); } catch { /* best effort */ }
          detailCache.set(baseId + ":" + lang, { art, detail });
        }
        if (currentModal !== r) return; // another title was opened meanwhile
        modalEl.classList.remove("loading");
        const x = renderSwitchModal(r, detail, baseId, false);

        // The banner, or the blurred icon when the game has none.
        const bannerUrl = x.td.bannerUrl || (validBase && art.banner ? `/api/shop/banner/${baseId}` : "");
        setBanner(bannerUrl, iconUrl);

        const shots = Array.isArray(x.td.screenshots) ? [...x.td.screenshots] : [];
        if (validBase) for (const i of (art.screens || [])) shots.push(`/api/shop/screenshot/${baseId}/${i}`);
        fillShots(shots, false);

        // The patches a game needs sit above its notes; the rest go with what to install.
        const related = renderModalPatches(Array.isArray(detail.patches) ? detail.patches : []);
        if (validBase) renderInstall(x.group, related);

        // Artwork edit controls — only when uploads are enabled.
        renderArtEditor(baseId, validBase, art);

        // The other files in the title's folder, which only the web lists.
        if (validBase) loadExtras(baseId, $("modal-extras"));
      }

      // ─── artwork editor (upload / replace / remove) ────────────────────────
      function artBtn(label, cls, onClick) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "btn " + cls + " tiny"; b.textContent = label;
        b.addEventListener("click", onClick);
        return b;
      }
      function pickAndUpload(baseId, kind) {
        const input = document.createElement("input");
        input.type = "file"; input.accept = "image/*";
        input.addEventListener("change", () => {
          if (input.files && input.files[0]) uploadArt(baseId, kind, input.files[0]);
        });
        input.click();
      }
      // A small live preview thumbnail. Hides itself on 404 so empty slots
      // (no custom art and no titledb art) just show no image.
      function artThumb(url, w, h) {
        const img = document.createElement("img");
        img.className = "art-thumb"; img.loading = "lazy"; img.alt = "";
        img.style.width = w + "px"; img.style.height = h + "px";
        img.onerror = () => { img.style.display = "none"; };
        img.src = bustUrl(url);
        return img;
      }
      function artSlotRow(baseId, kind, label, hasCustom) {
        const row = document.createElement("div"); row.className = "art-row";
        const lab = document.createElement("span"); lab.className = "art-label"; lab.textContent = label;
        row.appendChild(lab);
        const url = kind === "icon"
          ? `/api/shop/icon/${baseId}?size=sm`
          : `/api/shop/banner/${baseId}`;
        row.appendChild(kind === "icon" ? artThumb(url, 42, 42) : artThumb(url, 72, 40));
        row.appendChild(artBtn(hasCustom ? t("art.replace") : t("art.upload"), "", () => pickAndUpload(baseId, kind)));
        if (hasCustom) row.appendChild(artBtn(t("art.remove"), "ghost", () => removeArt(baseId, kind)));
        return row;
      }
      function artScreensRow(baseId, screens) {
        const row = document.createElement("div"); row.className = "art-row";
        const lab = document.createElement("span"); lab.className = "art-label"; lab.textContent = t("art.screens");
        row.appendChild(lab);
        row.appendChild(artBtn(t("art.add"), "", () => pickAndUpload(baseId, "screenshot")));
        for (const i of screens) {
          const wrap = document.createElement("div"); wrap.className = "art-shot";
          wrap.appendChild(artThumb(`/api/shop/screenshot/${baseId}/${i}`, 64, 36));
          const x = document.createElement("button");
          x.type = "button"; x.className = "art-shot-x"; x.textContent = "✕"; x.title = t("art.remove");
          x.addEventListener("click", () => removeArt(baseId, "screenshot", i));
          wrap.appendChild(x);
          row.appendChild(wrap);
        }
        return row;
      }
      function renderArtEditor(baseId, validBase, art) {
        const box = $("modal-art");
        box.innerHTML = ""; box.hidden = true;
        if (!uploadsEnabled || !validBase) return;
        box.hidden = false;
        const head = document.createElement("div");
        head.className = "art-head"; head.textContent = t("art.head");
        box.appendChild(head);
        box.appendChild(artSlotRow(baseId, "icon", t("art.icon"), art.icon));
        box.appendChild(artSlotRow(baseId, "banner", t("art.banner"), art.banner));
        box.appendChild(artScreensRow(baseId, art.screens || []));
        box.appendChild(artDescRow(baseId, art));
      }
      // The game's own text: edit it in place, Korean and English apart; what
      // the admin wrote replaces titledb's description, line breaks included.
      function artDescRow(baseId, art) {
        const row = document.createElement("div"); row.className = "art-row";
        const lab = document.createElement("span"); lab.className = "art-label"; lab.textContent = t("art.desc");
        const showButtons = () => {
          row.replaceChildren(lab);
          row.appendChild(artBtn(t("art.desc.edit"), "", () => showForm()));
          if (art.description) row.appendChild(artBtn(t("art.desc.clear"), "ghost", () => clearDesc(baseId)));
        };
        const showForm = () => {
          const form = document.createElement("div"); form.className = "art-desc-form";
          const hint = document.createElement("div"); hint.className = "art-desc-hint"; hint.textContent = t("art.desc.hint");
          form.appendChild(hint);
          const fields = [["ko", "한국어"], ["en", "English"]].map(([code, label]) => {
            const ta = document.createElement("textarea");
            ta.value = art.description?.[code] || ""; ta.placeholder = label; ta.setAttribute("aria-label", label);
            form.appendChild(ta);
            return ta;
          });
          const actions = document.createElement("div"); actions.className = "art-desc-actions";
          actions.append(
            artBtn(t("art.desc.save"), "", async () => {
              try {
                const res = await fetch(`/api/art/${baseId}/description`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json", Accept: "application/json" },
                  body: JSON.stringify({ ko: fields[0].value, en: fields[1].value }),
                });
                const d = await res.json().catch(() => ({}));
                if (!res.ok) { toast(d.error || t("art.failed")); return; }
                toast(t("art.saved"));
                refreshAfterDesc(baseId);
              } catch { toast(t("art.failed")); }
            }),
            artBtn(t("art.desc.cancel"), "ghost", showButtons),
          );
          form.appendChild(actions);
          row.replaceChildren(lab, form);
          fields[0].focus();
        };
        showButtons();
        return row;
      }
      async function clearDesc(baseId) {
        try {
          const res = await fetch(`/api/art/${baseId}/description`, { method: "DELETE" });
          if (!res.ok) { toast(t("art.failed")); return; }
          toast(t("art.removed"));
          refreshAfterDesc(baseId);
        } catch { toast(t("art.failed")); }
      }
      // Drop the cached detail of every language, then repaint the open modal.
      function refreshAfterDesc(baseId) {
        for (const k of [...detailCache.keys()]) if (k.startsWith(baseId + ":")) detailCache.delete(k);
        if (currentModal) openModal(currentModal);
      }
      async function uploadArt(baseId, kind, file) {
        const fd = new FormData(); fd.append("file", file, file.name);
        try {
          const res = await fetch(`/api/art/${baseId}/${kind}`, { method: "POST", body: fd });
          const d = await res.json().catch(() => ({}));
          if (!res.ok) { toast(d.error || t("art.failed")); return; }
          toast(t("art.saved"));
          artVersion++;
          if (currentModal) openModal(currentModal); // re-render with fresh art + cache-bust
        } catch { toast(t("art.failed")); }
      }
      async function removeArt(baseId, kind, idx) {
        const url = kind === "screenshot"
          ? `/api/art/${baseId}/screenshot/${idx}`
          : `/api/art/${baseId}/${kind}`;
        try {
          const res = await fetch(url, { method: "DELETE" });
          if (!res.ok) { toast(t("art.failed")); return; }
          toast(t("art.removed"));
          artVersion++;
          if (currentModal) openModal(currentModal);
        } catch { toast(t("art.failed")); }
      }

      // Fetch + render a title's auxiliary files (mods/patches/zips). Best
      // effort: any failure just leaves the section empty. Filenames go in via
      // textContent (never innerHTML) so odd names can't inject markup. A
      // request token guards against a slow response from a previously-closed
      // modal painting into the currently-open one.
      let extrasReq = 0;
      async function loadExtras(baseId, box) {
        const token = ++extrasReq;
        try {
          const res = await fetch(`/api/title/${baseId}/extras`, {
            headers: { Accept: "application/json" },
          });
          if (token !== extrasReq || !res.ok) return;
          const data = await res.json();
          const items = Array.isArray(data.extras) ? data.extras : [];
          if (token !== extrasReq || items.length === 0) return;

          const head = document.createElement("div");
          head.className = "extras-head";
          head.textContent = t("modal.extras") + " (" + items.length + ")";
          box.appendChild(head);

          for (const x of items) {
            const row = document.createElement("a");
            row.className = "extra-row";
            row.href = x.url; row.target = "_blank"; row.rel = "noopener";
            row.setAttribute("download", x.name);
            const nameEl = document.createElement("span");
            nameEl.className = "extra-name"; nameEl.textContent = x.name;
            const sizeEl = document.createElement("span");
            sizeEl.className = "extra-size"; sizeEl.textContent = fmtBytes(x.size);
            row.appendChild(nameEl); row.appendChild(sizeEl);
            box.appendChild(row);
          }
        } catch { /* extras are best-effort */ }
      }
      // A retro game's details: the square art as cover, its bezel as the banner
      // (the blurred cover when it has none), and the name split into the
      // original title and the patch notes the file name carries. It opens at
      // once with what the list row carries, then fills in what only the game's
      // own reply has: description, makers, release, genres, screenshots and its versions.
      const retroDetailCache = new Map();
      let retroSeq = 0;
      function retroDetail(id) {
        const key = id + ":" + lang;
        if (!retroDetailCache.has(key)) {
          const got = fetch(`/api/retro/games/${encodeURIComponent(id)}?lang=${encodeURIComponent(lang)}`, { headers: { Accept: "application/json" } })
            .then((r) => (r.ok ? r.json() : null))
            .catch(() => null)
            .then((d) => { if (!d) retroDetailCache.delete(key); return d; });
          retroDetailCache.set(key, got);
        }
        return retroDetailCache.get(key);
      }

      function openRetroModal(g, sys) {
        currentModal = null;
        const mine = ++retroSeq;
        renderRetroModal(g, sys, true);
        $("modal").classList.add("open"); $("modal").setAttribute("aria-hidden", "false");
        retroDetail(g.id).then((d) => {
          if (mine !== retroSeq) return;
          renderRetroModal(d ? { ...g, ...d } : g, sys, false);
        });
      }

      // Laid out as the console shows a retro game: a screenshot (else the box
      // art, else the blurred icon) as the banner, the icon with its region flag,
      // pills for what the file is, the description, the info table, where it
      // installs, genres, screenshots and the versions to pick from.
      function renderRetroModal(g, sys, loading) {
        const modalEl = document.querySelector("#modal .modal");
        modalEl.classList.toggle("loading", loading);
        const sysName = sys ? (sys.names?.[lang] || sys.name) : g.system;
        // The original title, from the reply or the name's last "(…)"; shown only when it differs.
        const tail = (g.name.match(/\(([^()]*(?:\([^()]*\)[^()]*)*)\)\s*$/) || [])[1] || "";
        const title = tail && (!g.original || tail === g.original) ? g.name.slice(0, g.name.lastIndexOf("(" + tail)).trim() || g.name : g.name;
        const original = g.original || tail;
        $("modal-title").textContent = title;
        $("modal-publisher").textContent = [original && original !== title ? original : "", sysName].filter(Boolean).join(" · ");
        setCover(g.iconUrl || "");
        const flag = $("modal-flag");
        flag.hidden = !REGION_FLAGS[g.region];
        flag.textContent = REGION_FLAGS[g.region] || ""; flag.title = regionName(g.region);

        const banner = $("modal-banner");
        const shot = Array.isArray(g.screenshots) ? g.screenshots[0] : "";
        if (loading) {
          banner.dataset.want = ""; banner.classList.remove("no-art"); banner.style.backgroundImage = "";
          setPoster("");
        } else {
          setBanner(shot || "", g.iconUrl || "");
          setPoster(shot ? "" : g.boxartUrl || "");
        }

        const ed = g.edition || null;
        const own = g.bezel?.hasBezel && !g.bezel.generic;
        const variant = g.variant && g.variant.length > 28 ? g.variant.slice(0, 27) + "…" : g.variant;
        fillPills([
          [fmtExt(g.file)],
          [g.bezel?.hasBezel ? t(own ? "retro.pillBezelOwn" : "retro.pillBezelDefault") : ""],
          [ed?.source ? t(ed.source === "official" ? "retro.official" : "retro.patched") : "", "need"],
          [["jp", "us", "eu", "world"].includes(ed?.from) ? t(`retro.from.${ed.from}`) : ""],
          [ed?.version || ""],
          [!g.region && !ed ? variant : ""],
          [Number.isFinite(g.rating) ? t("pill.score", g.rating) : ""],
        ]);
        fillDesc(g.description, loading, t("modal.noDescSub"));

        // A value only the game's own reply has shimmers until it arrives.
        const known = (v) => (loading && !v ? null : v || "");
        fillMeta([
          [g.ratingCount ? t("modal.scoreN", g.ratingCount) : t("modal.score"), Number.isFinite(g.rating) ? String(g.rating) : ""],
          [t("modal.release"), known(fmtDate(g.releaseDate))],
          [t("retro.maker"), known(g.publisher)],
          [t("modal.developer"), g.developer && g.developer === g.publisher ? "" : known(g.developer)],
          [t("modal.players"), known(fmtPlayers(Number(g.numberOfPlayers)))],
          [t("retro.system"), sysName],
          [t("retro.core"), g.core],
          [t("modal.size"), g.size > 0 ? fmtBytes(g.size) : ""],
          [t("modal.format"), fmtExt(g.file)],
          [t("modal.region"), regionName(g.region)],
          [t("retro.bezelLabel"), own ? t("retro.bezelOwn") : g.bezel?.hasBezel ? t("retro.bezelDefault") : t("retro.bezelNone")],
          [t("retro.forwarder"), g.forwarderUrl ? t("retro.forwarderWith") : ""],
        ]);
        const where = $("modal-where");
        where.replaceChildren();
        if (g.install?.rom) where.append(document.createTextNode(t("retro.installAt") + " "), Object.assign(document.createElement("code"), { textContent: g.install.rom }));
        where.hidden = !g.install?.rom;
        fillChips([[t("modal.category"), g.genres || []]]);
        fillShots(Array.isArray(g.screenshots) ? g.screenshots : [], loading && !g.screenshots);

        $("modal-art").hidden = true;
        $("modal-notes").hidden = true;
        $("modal-patches").replaceChildren(); $("modal-patches").hidden = true;
        $("modal-install").replaceChildren(); $("modal-install").hidden = true;
        showRetroVersions(g, sys);
        const discs = g.file.endsWith(".m3u") ? g.install?.extras?.filter((x) => !/\.(bin|img|sub)$/i.test(x)).length || 0 : 0;
        const dl = $("modal-download");
        dl.href = discs ? g.bundleUrl : g.romUrl;
        dl.setAttribute("download", "");
        dl.textContent = discs ? t("retro.downloadDiscs") : t("retro.downloadRom");
      }

      // The files of a game (a patch beside the official release, an arcade set's
      // other regions), one even when it is alone: the list shows one card, the
      // window picks among them and redraws itself as the version picked.
      function showRetroVersions(g, sys) {
        const box = $("modal-extras");
        box.replaceChildren();
        if (!Array.isArray(g.variants) || !g.variants.length) return;
        const head = document.createElement("div");
        head.className = "extras-head";
        head.textContent = t("retro.versionsCount", g.variants.length);
        box.append(head);
        for (const v of g.variants) {
          const row = document.createElement("button");
          row.type = "button";
          row.classList.add("version-row");
          const current = v.id === g.id;
          row.setAttribute("aria-pressed", String(current));
          const sub = [
            v.edition?.korean ? t("pill.korean") : "",
            v.representative && g.variants.length > 1 ? t("retro.listed") : "",
            v.missing ? t("retro.cantRun") : "",
          ].filter(Boolean).join(" · ");
          detailRow(row, { name: v.variant || v.name, sub, size: v.size, flag: REGION_FLAGS[v.region] || "", mark: true, title: v.file });
          row.addEventListener("click", () => { if (!current) openRetroModal(v, sys); });
          box.append(row);
        }
      }

      function closeModal() { $("modal").classList.remove("open"); $("modal").setAttribute("aria-hidden", "true"); }
      $("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal(); });
      $("modal-close").addEventListener("click", closeModal);
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

      // The top-right close does what the window's own close button does.
      for (const x of document.querySelectorAll(".modal-x")) {
        x.addEventListener("click", () => x.closest(".modal-backdrop")?.querySelector('.modal-actions [id$="close"], [id$="-close"]')?.click());
      }

      // ─── toolbar wiring ───────────────────────────────────────────────────
      $("search").addEventListener("input", debounce(() => { state.q = $("search").value.trim().toLowerCase(); state.page = 1; applyFilters(); }, 100));
      $("chips").addEventListener("click", (e) => {
        if (!(e.target instanceof HTMLButtonElement)) return;
        for (const c of $("chips").children) c.classList.toggle("active", c === e.target);
        state.kind = e.target.dataset.kind; state.page = 1; applyFilters();
      });
      // Zooming or resizing changes the column count; keep the first visible card on screen.
      window.addEventListener("resize", debounce(() => {
        const next = fitPerPage();
        if (next === state.perPage) return;
        const first = (state.page - 1) * state.perPage;
        state.page = Math.floor(first / next) + 1;
        applyFilters();
      }, 150));
      $("sort").addEventListener("change", () => { state.sort = $("sort").value; state.page = 1; applyFilters(); });
      $("refresh-btn").addEventListener("click", async () => {
        $("refresh-btn").disabled = true;
        await loadShop();
        $("refresh-btn").disabled = false;
        toast(t("toast.refresh"));
      });

      // language toggle
      const langList = $("lang-list");
      function setLangMenu(open) {
        langList.hidden = !open;
        $("lang-btn").setAttribute("aria-expanded", String(open));
        if (!open) return;
        langList.style.left = ""; langList.style.right = "";
        if (langList.getBoundingClientRect().left < 8) { langList.style.left = "0"; langList.style.right = "auto"; }
        langList.querySelector(".active")?.focus();
      }
      $("lang-btn").addEventListener("click", (e) => { e.stopPropagation(); setAcctMenu(false); setLangMenu(langList.hidden); });
      langList.addEventListener("click", (e) => {
        const b = e.target.closest("[data-lang]");
        if (!b) return;
        lang = b.dataset.lang;
        try { localStorage.setItem(LANG_KEY, lang); } catch { /* storage blocked: keep it for this visit */ }
        setLangMenu(false);
        $("lang-btn").focus();
        applyI18n();
        renderGenreChips();
        renderSteamChips();
        retro.relabel();
        extras.relabel();
        homebrew.relabel();
        share.relabel();
        if (current) renderSubtabs(current);
      });
      document.addEventListener("click", (e) => { if (!langList.hidden && !e.target.closest("#lang-menu")) setLangMenu(false); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !langList.hidden) { setLangMenu(false); $("lang-btn").focus(); } });

      // account menu: devices, admin, sign out
      const acctList = $("acct-list");
      function setAcctMenu(open) {
        acctList.hidden = !open;
        $("acct-btn").setAttribute("aria-expanded", String(open));
        if (open) acctList.querySelector("a:not([hidden])")?.focus();
      }
      $("acct-btn").addEventListener("click", (e) => { e.stopPropagation(); setLangMenu(false); setAcctMenu(acctList.hidden); });
      document.addEventListener("click", (e) => { if (!acctList.hidden && !e.target.closest("#acct-menu")) setAcctMenu(false); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !acctList.hidden) { setAcctMenu(false); $("acct-btn").focus(); } });

      // ─── theme ────────────────────────────────────────────────────────────
      // The system setting until the switch in the account menu is used; the choice is kept
      // under one key with the admin pages. The head script applies it before paint and keeps
      // the address-bar colour in step.
      const THEME_KEY = "cookingfoil:theme";
      const systemLight = window.matchMedia("(prefers-color-scheme: light)");
      const currentTheme = () => document.documentElement.dataset.theme || (systemLight.matches ? "light" : "dark");
      function syncThemeChrome() {
        $("theme-toggle").setAttribute("aria-checked", String(currentTheme() === "dark"));
        // covers already showing the no-image card take the one drawn for this theme
        for (const img of document.querySelectorAll("img")) {
          if (img.src === COVER_PLACEHOLDER_LIGHT || img.src === COVER_PLACEHOLDER_DARK) img.src = coverPlaceholder();
        }
      }
      function setTheme(choice) {
        document.documentElement.dataset.theme = choice;
        try { localStorage.setItem(THEME_KEY, choice); } catch { /* storage blocked: keep it for this visit */ }
        syncThemeChrome();
      }
      $("theme-toggle").addEventListener("click", () => setTheme(currentTheme() === "dark" ? "light" : "dark"));
      systemLight.addEventListener("change", syncThemeChrome);
      syncThemeChrome();

      // ─── scroll progress ──────────────────────────────────────────────────
      let scrollTicking = false;
      function flushScroll() {
        const h = document.documentElement;
        const max = (h.scrollHeight - h.clientHeight) || 1;
        const pct = Math.min(100, Math.max(0, (h.scrollTop / max) * 100));
        $("scroll-progress").style.width = pct + "%";
        scrollTicking = false;
      }
      document.addEventListener("scroll", () => {
        if (!scrollTicking) { scrollTicking = true; requestAnimationFrame(flushScroll); }
      }, { passive: true });

      // Clicking a stat card jumps to the library, swapping the filter
      // when the stat maps to a kind.
      function bindStatClick(id, kind) {
        const el = $(id)?.parentElement; if (!el) return;
        el.addEventListener("click", () => {
          if (kind) {
            for (const c of $("chips").children) c.classList.toggle("active", c.dataset.kind === kind);
            state.kind = kind; state.page = 1; applyFilters();
          }
          $("games").scrollIntoView({ behavior: "smooth", block: "start" });
        });
      }
      bindStatClick("stat-games",   "base");
      bindStatClick("stat-updates", "update");
      bindStatClick("stat-dlc",     "dlc");
      bindStatClick("stat-size",    null);

      applyI18n();
      renderSkeletons();
      loadShop();

      // ─── share inbox ──────────────────────────────────────────────────────
      // Signed-in people leave files, a note and links for the admin (POST /api/inbox).
      // The account menu offers it once the server says the inbox is on.
      const share = (() => {
        let picked = [];   // [{ file, path }]
        let maxBytes = 0;
        const total = () => picked.reduce((n, p) => n + p.file.size, 0);
        function relabel() {
          $("share-chosen").textContent = picked.length ? t("share.chosen", picked.length, fmtBytes(total())) : t("share.none");
          $("share-drop").classList.toggle("has", picked.length > 0);
        }
        function say(text, kind = "") { const m = $("share-msg"); m.textContent = text; m.className = "share-msg" + (kind ? " " + kind : ""); }
        function choose(list) { picked = list; say(""); relabel(); }
        async function check() {
          try {
            const r = await fetch("/api/inbox", { headers: { Accept: "application/json" } });
            const d = r.ok ? await r.json() : null;
            maxBytes = d?.maxBytes || 0;
            $("inbox-link").hidden = !d?.enabled;
          } catch { $("inbox-link").hidden = true; }
        }
        function open() {
          setAcctMenu(false);
          say(""); relabel();
          $("share-modal").classList.add("open"); $("share-modal").setAttribute("aria-hidden", "false");
          $("share-memo").focus();
        }
        function close() { $("share-modal").classList.remove("open"); $("share-modal").setAttribute("aria-hidden", "true"); }
        // A dropped folder arrives as an entry to walk; its files keep their paths inside it.
        async function walk(entry, prefix = "") {
          if (entry.isFile) return [{ file: await new Promise((res, rej) => entry.file(res, rej)), path: prefix + entry.name }];
          const reader = entry.createReader();
          const out = [];
          for (;;) {
            const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
            if (!batch.length) return out;
            for (const e of batch) out.push(...(await walk(e, prefix + entry.name + "/")));
          }
        }
        const badLinks = (text) => text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean).some((l) => {
          try { const u = new URL(l); return u.protocol !== "http:" && u.protocol !== "https:"; } catch { return true; }
        });
        const ERR = { empty: "share.empty", "bad-link": "share.bad_link", "too-many-links": "share.bad_link", "memo-too-long": "share.memo_long", full: "share.full", rate: "share.rate" };
        function send() {
          const memo = $("share-memo").value.trim(), links = $("share-links").value.trim();
          if (!picked.length && !memo && !links) return say(t("share.empty"), "bad");
          if (badLinks(links)) return say(t("share.bad_link"), "bad");
          if (maxBytes && total() > maxBytes) return say(t("share.too_big", fmtBytes(maxBytes)), "bad");
          const fd = new FormData();
          for (const p of picked) fd.append("files", p.file, p.file.name);
          if (picked.some((p) => p.path !== p.file.name)) fd.append("paths", JSON.stringify(picked.map((p) => p.path)));
          fd.append("memo", memo);
          fd.append("links", links);
          const xhr = new XMLHttpRequest();
          xhr.open("POST", "/api/inbox");
          xhr.setRequestHeader("X-CSRF-Token", session?.csrf ?? "");
          $("share-send").disabled = true;
          $("share-progress").hidden = false; $("share-bar").style.width = "0%";
          say(t("share.sending", 0));
          xhr.upload.addEventListener("progress", (e) => {
            if (!e.lengthComputable) return;
            const pct = Math.round((e.loaded / e.total) * 100);
            $("share-bar").style.width = pct + "%";
            say(t("share.sending", pct));
          });
          const finish = () => { $("share-send").disabled = false; $("share-progress").hidden = true; };
          xhr.addEventListener("load", () => {
            finish();
            let body = {};
            try { body = JSON.parse(xhr.responseText); } catch { /* not JSON */ }
            if (xhr.status === 201) {
              $("share-form").reset(); picked = []; relabel();
              return say(t("share.done"), "ok");
            }
            if (body.code === "too-big") return say(t("share.too_big", fmtBytes(maxBytes)), "bad");
            say(ERR[body.code] ? t(ERR[body.code]) : t("share.failed", body.error || "HTTP " + xhr.status), "bad");
          });
          xhr.addEventListener("error", () => { finish(); say(t("share.failed", "network error"), "bad"); });
          xhr.send(fd);
        }
        $("inbox-link").addEventListener("click", (e) => { e.preventDefault(); open(); });
        $("share-close").addEventListener("click", close);
        $("share-modal").addEventListener("click", (e) => { if (e.target === $("share-modal")) close(); });
        document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("share-modal").classList.contains("open")) close(); });
        $("share-pick-files").addEventListener("click", () => $("share-files").click());
        $("share-pick-folder").addEventListener("click", () => $("share-folder").click());
        $("share-files").addEventListener("change", (e) => choose([...e.target.files].map((file) => ({ file, path: file.name }))));
        $("share-folder").addEventListener("change", (e) => choose([...e.target.files].map((file) => ({ file, path: file.webkitRelativePath || file.name }))));
        const drop = $("share-drop");
        drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
        drop.addEventListener("dragleave", () => drop.classList.remove("over"));
        drop.addEventListener("drop", async (e) => {
          e.preventDefault(); drop.classList.remove("over");
          const entries = [...(e.dataTransfer?.items ?? [])].map((i) => i.webkitGetAsEntry?.()).filter(Boolean);
          if (entries.length) choose((await Promise.all(entries.map((en) => walk(en)))).flat());
          else choose([...(e.dataTransfer?.files ?? [])].map((file) => ({ file, path: file.name })));
        });
        $("share-form").addEventListener("submit", (e) => { e.preventDefault(); send(); });
        relabel();
        return { check, relabel, open };
      })();

      // ─── uploads on the server ──────────────────────────────────────────
      // Files are put into the library from the admin page. The artwork controls in a
      // game's window are shown only to admin accounts, and only when the server takes uploads (503 when it doesn't, 403 for anyone else).
      let uploadsEnabled = false;
      fetch("/api/uploads", { headers: { Accept: "application/json" } })
        .then((r) => { uploadsEnabled = r.ok; })
        .catch(() => { /* off for this visit */ });

      // ─── realtime: WebSocket library push ─────────────────────────────────
      // The dashboard re-fetches /shop.json on every shop-updated event so
      // additions, removals and metadata refreshes appear without a manual
      // reload. We never push the body itself — the ETag short-circuits
      // unchanged responses to 304.
      let ws = null;
      let wsRetry = 0;
      let wsReloadTimer = null;
      let wsReloadAt = 0;
      let wsPending = false;
      const LIVE_GAP_MS = 15_000;
      function scheduleReload() {
        // The server rebuilds once per file it reads (names, icons), so a scan sends a stream of these.
        // They fold into one quiet reload at most every 15 seconds, and wait while the tab is hidden.
        if (document.hidden) { wsPending = true; return; }
        if (wsReloadTimer) return;
        const wait = Math.max(1500, LIVE_GAP_MS - (Date.now() - wsReloadAt));
        wsReloadTimer = setTimeout(() => { wsReloadTimer = null; wsReloadAt = Date.now(); loadShop({ quiet: true }); }, wait);
      }
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && wsPending) { wsPending = false; scheduleReload(); }
      });
      let restartShown = null;
      function showRestart(notice) {
        const id = notice.restart_id;
        if (!id || id === restartShown) return;
        restartShown = id;
        const banner = $("restart-banner");
        banner.textContent = t("restart.notice");
        banner.hidden = false;
      }
      function hideRestart() { $("restart-banner").hidden = true; }
      function connectWs() {
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        try {
          ws = new WebSocket(`${proto}//${location.host}/ws/library`);
        } catch (err) {
          console.warn("[CookingFoil] ws construct failed:", err);
          scheduleReconnect();
          return;
        }
        ws.addEventListener("open", () => {
          wsRetry = 0;
          console.info("[CookingFoil] ws connected");
        });
        ws.addEventListener("message", (ev) => {
          let msg;
          try { msg = JSON.parse(ev.data); } catch { return; }
          if (msg.type === "shop-updated") scheduleReload();
          // Safe restart: shown once per restart, gone when the server answers again.
          if (msg.type === "restarting") showRestart(msg);
          if (msg.type === "hello") { if (msg.restarting) showRestart(msg.restarting); else hideRestart(); }
        });
        ws.addEventListener("close", () => { ws = null; scheduleReconnect(); });
        ws.addEventListener("error", () => { /* close fires next */ });
      }
      function scheduleReconnect() {
        // Exponential backoff capped at 30s.
        const delay = Math.min(30_000, 1000 * Math.pow(2, Math.min(wsRetry++, 5)));
        setTimeout(connectWs, delay);
      }
      connectWs();
    </script>
  </body>
</html>
