<!doctype html>
<html lang="ko" data-lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f1ee" />
    <title>CookingFoil</title>
    <link rel="icon" href="/assets/cookingfoil.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" />
    <script>
      try { const saved = localStorage.getItem("cookingfoil:theme"); if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved; } catch { /* storage blocked: follow the system */ }
    </script>
    <style>
      /* The Switch client's palette (include/ui/Theme.hpp): warm ground, white
         surfaces, ink text and the butter accent. Dark mode keeps the same
         accent on an ink ground. The legacy names (--base, --surface0 ...) stay
         so every rule below reads from one set of tokens. */
      :root {
        --ground: #16161a; --surface: #1f1f24; --sunk: #26262c; --ink: #f2f1ee;
        --line: #303037; --line2: #41414a; --secondary: #a9a8a3; --faint: #75747c;
        --butter: #ffc23d; --butter-ink: #16161a; --hero: #0c0c0e;
        --good: #3fbf83; --pending: #e3a43a; --bad: #ef6b5f;
        --butter-rgb: 255, 194, 61; --good-rgb: 63, 191, 131; --bad-rgb: 239, 107, 95; --shadow-rgb: 0, 0, 0;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          --ground: #f2f1ee; --surface: #ffffff; --sunk: #ebe9e4; --ink: #16161a;
          --line: #e2e0da; --line2: #d3d0c8; --secondary: #55555e; --faint: #8d8c93;
          --butter: #ffc23d; --butter-ink: #16161a; --hero: #16161a;
          --good: #1e8e5a; --pending: #c47c00; --bad: #cc3e34;
          --good-rgb: 30, 142, 90; --bad-rgb: 204, 62, 52; --shadow-rgb: 22, 22, 26;
          color-scheme: light;
        }
      }
      :root[data-theme="light"] {
        --ground: #f2f1ee; --surface: #ffffff; --sunk: #ebe9e4; --ink: #16161a;
        --line: #e2e0da; --line2: #d3d0c8; --secondary: #55555e; --faint: #8d8c93;
        --butter: #ffc23d; --butter-ink: #16161a; --hero: #16161a;
        --good: #1e8e5a; --pending: #c47c00; --bad: #cc3e34;
        --good-rgb: 30, 142, 90; --bad-rgb: 204, 62, 52; --shadow-rgb: 22, 22, 26;
        color-scheme: light;
      }
      :root {
        --font-body: "Inter", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
        --radius: 18px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
      html { scroll-behavior: smooth; }
      body {
        font-family: var(--font-body); background: var(--ground); color: var(--ink);
        min-height: 100dvh; padding: 28px 32px 80px;
        -webkit-font-smoothing: antialiased;
        word-break: keep-all; overflow-wrap: anywhere;
      }
      .scanlines { display: none; }
      .scroll-progress {
        position: fixed; top: 0; left: 0; height: 3px; width: 0; z-index: 50;
        background: var(--butter); transition: width 0.12s ease; pointer-events: none;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }

      .wrap { width: 100%; max-width: 1240px; margin: 0 auto; }
      .card { animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

      /* TOP BAR: wordmark on the left, admin + toggles on the right */
      .top-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
      .top-row, .top-row * { white-space: nowrap; }
      .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; text-decoration: none; color: var(--ink); }
      .logo { width: 44px; height: 44px; flex-shrink: 0; }
      .wordmark { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
      .wordmark .foil { margin-left: 6px; background: var(--butter); color: var(--butter-ink); padding: 0 8px 2px; border-radius: 9px; }
      .lang-toggle, .theme-toggle {
        display: inline-flex; gap: 2px; padding: 3px;
        background: var(--surface); border: 1px solid var(--line); border-radius: 100px;
      }
      .lang-toggle button, .theme-toggle button {
        background: transparent; border: none; color: var(--secondary);
        padding: 6px 11px; border-radius: 100px; font: 600 12px var(--font-body); cursor: pointer;
      }
      .theme-toggle button { display: grid; place-items: center; padding: 6px 10px; }
      .theme-toggle svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .lang-toggle button.active, .theme-toggle button.active { background: var(--ink); color: var(--ground); }
      .lang-toggle button:hover:not(.active), .theme-toggle button:hover:not(.active) { color: var(--ink); }
      .admin-link {
        display: inline-flex; align-items: center; height: 36px; padding: 0 16px;
        border-radius: 100px; border: 1px solid var(--line); background: var(--surface);
        color: var(--ink); font-size: 13px; font-weight: 600; text-decoration: none;
      }
      .admin-link:hover { border-color: var(--ink); }

      /* HERO: the newest arrival on the dark band the client opens with */
      .hero {
        display: flex; align-items: center; gap: 36px; padding: 36px 40px; margin-bottom: 34px;
        border-radius: 28px; color: #f2f1ee; cursor: pointer; position: relative; overflow: hidden;
        background: radial-gradient(120% 140% at 0% 0%, #3a2c18 0%, var(--hero) 55%);
        min-height: 260px;
      }
      .hero[hidden] { display: none; }
      /* slide backdrop: an admin banner under a dark wash, otherwise the cover blurred */
      .hero .hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; pointer-events: none; }
      .hero .hero-bg.banner::after { content: ""; position: absolute; inset: 0; background: rgba(10, 10, 14, 0.6); }
      .hero .hero-bg.blur { filter: blur(40px) saturate(1.2); transform: scale(1.3); opacity: 0.45; }
      .hero > :not(.hero-bg) { position: relative; }
      .hero.swap .hero-cover, .hero.swap .hero-text { animation: fadeIn 0.45s ease; }
      .hero .hero-dots { position: absolute; right: 30px; bottom: 24px; display: flex; gap: 8px; align-items: center; }
      .hero .hero-dots button {
        width: 8px; height: 8px; padding: 0; border: none; border-radius: 4px; cursor: pointer;
        background: rgba(255, 255, 255, 0.43); transition: width 0.25s ease, background 0.25s ease;
      }
      .hero .hero-dots button::before { content: ""; position: absolute; margin: -12px -4px; width: 100%; height: 32px; padding: 0 4px; }
      .hero .hero-dots button.on { width: 24px; background: var(--butter); }
      .hero .hero-cover { width: 200px; height: 200px; border-radius: 20px; object-fit: cover; flex-shrink: 0; background: #2a2a30; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45); }
      .hero .hero-text { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
      .hero .eyebrow { color: var(--butter); font-weight: 700; font-size: 15px; }
      .hero .hero-title { font-size: clamp(26px, 3.4vw, 42px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
      .hero .hero-pub { color: rgba(242, 241, 238, 0.75); font-size: 16px; }
      .hero .hero-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
      .hero .hero-tags span { padding: 7px 14px; border-radius: 100px; background: rgba(255, 255, 255, 0.12); font-size: 13px; font-weight: 600; }

      /* SECTION HEADINGS: bold and plain, like the client's rows */
      h2 {
        font-size: 22px; font-weight: 800; letter-spacing: -0.01em; color: var(--ink);
        margin: 34px 0 14px; display: flex; align-items: center; gap: 12px;
      }
      h2 .rule { flex: 1; }
      .h2-action, .count {
        padding: 7px 14px; border-radius: 100px; font: 600 13px var(--font-body);
        background: var(--surface); border: 1px solid var(--line); color: var(--secondary);
        white-space: nowrap; flex-shrink: 0;
      }
      .h2-action { cursor: pointer; }
      .h2-action:hover { color: var(--ink); border-color: var(--ink); }

      /* STATUS + INFO PANELS */
      .badge {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 7px 14px; border-radius: 100px; font-size: 13px; font-weight: 600;
        background: var(--surface); border: 1px solid var(--line); color: var(--good);
      }
      .badge.warm { color: var(--pending); }
      .badge.cold { color: var(--bad); }
      .badge-dot { width: 8px; height: 8px; background: currentColor; border-radius: 50%; animation: pulse 2s infinite; }
      .panels { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
      .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; }
      .panel h3 { font-size: 16px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
      .panel h3 .rule { flex: 1; }
      .description { font-size: 14px; color: var(--secondary); line-height: 1.6; margin-bottom: 14px; }

      .connect-row { display: flex; gap: 10px; }
      .url-pill {
        flex: 1; padding: 14px 18px; border-radius: 14px; background: var(--sunk);
        font: 500 14px var(--font-mono); color: var(--ink);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        padding: 12px 20px; border-radius: 14px; font: 700 14px var(--font-body);
        background: var(--butter); color: var(--butter-ink); border: none; cursor: pointer;
        text-decoration: none; white-space: nowrap; transition: transform 0.15s ease, filter 0.15s ease;
      }
      .btn:hover { filter: brightness(1.04); transform: translateY(-1px); }
      .btn:active { transform: none; }
      .btn.ghost { background: var(--sunk); color: var(--ink); }
      .btn.ghost:hover { background: var(--line); }
      .hint { font-size: 13px; color: var(--secondary); line-height: 1.65; margin-top: 12px; }
      .hint code { font-family: var(--font-mono); background: var(--sunk); padding: 2px 8px; border-radius: 6px; font-size: 12.5px; }

      .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .stat { background: var(--sunk); border-radius: 14px; padding: 12px 16px; cursor: pointer; transition: background 0.15s ease; }
      .stat:hover { background: var(--line); }
      .stat .label { font-size: 12px; font-weight: 600; color: var(--secondary); margin-bottom: 2px; }
      .stat .value { font-size: 24px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
      .stat .sub { font-size: 12px; color: var(--faint); margin-top: 2px; }

      .namehealth { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
      .nh-state {
        display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
        padding: 6px 14px; border-radius: 100px; font-size: 13px; font-weight: 700;
        background: rgba(var(--good-rgb), 0.12); color: var(--good); max-width: 100%;
      }
      .nh-state.warn { background: rgba(var(--butter-rgb), 0.18); color: var(--pending); }
      .nh-state.bad  { background: rgba(var(--bad-rgb), 0.12); color: var(--bad); }
      .nh-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
      .nh-state.bad .nh-dot { animation: pulse 1.6s infinite; }
      .nh-rows { display: grid; gap: 6px; }
      .nh-row { display: flex; gap: 10px; align-items: baseline; font-size: 13px; min-width: 0; }
      .nh-label { color: var(--secondary); font-size: 12px; font-weight: 600; flex-shrink: 0; min-width: 96px; }
      .nh-val { color: var(--ink); font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
      .nh-val.good { color: var(--good); }
      .nh-val.off  { color: var(--pending); }
      .nh-hint { font-size: 13px; color: var(--bad); line-height: 1.55; background: rgba(var(--bad-rgb), 0.08); border-radius: 10px; padding: 9px 12px; }

      /* RECENT ROW + LIBRARY: square art with the name under it */
      .recent { display: grid; grid-auto-flow: column; grid-auto-columns: 168px; gap: 18px; overflow-x: auto; padding: 14px 12px 14px; margin: -10px -12px 0; scroll-padding-inline: 12px; scroll-snap-type: x proximity; }
      .recent .game { scroll-snap-align: start; }
      .home-row { margin-bottom: 26px; }
      .home-row h2 { margin-bottom: 4px; }
      .toolbar {
        display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
        padding: 10px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line);
        position: sticky; top: 10px; z-index: 10; box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.06);
      }
      .search {
        flex: 1; min-width: 200px; padding: 11px 16px; border-radius: 12px;
        background: var(--sunk); border: 1px solid transparent; color: var(--ink); font: 14px var(--font-body);
      }
      .search:focus, .sort-select:focus { outline: none; border-color: var(--butter); box-shadow: 0 0 0 3px rgba(var(--butter-rgb), 0.3); }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip {
        padding: 9px 16px; border-radius: 100px; font: 600 13px var(--font-body);
        background: var(--sunk); border: none; color: var(--secondary); cursor: pointer;
      }
      .chip:hover { color: var(--ink); }
      .chip.active { background: var(--ink); color: var(--ground); }
      .genre-chips { display: flex; gap: 6px; overflow-x: auto; padding: 12px 2px 2px; scrollbar-width: none; }
      .genre-chips[hidden] { display: none; }
      .genre-chips .chip { flex-shrink: 0; background: var(--surface); border: 1px solid var(--line); }
      .genre-chips .chip.active { background: var(--ink); border-color: var(--ink); color: var(--ground); }
      .genre-chips .chip .n { margin-left: 6px; font-weight: 500; opacity: 0.6; }
      .sort-select {
        padding: 10px 14px; border-radius: 12px; background: var(--sunk); border: 1px solid transparent;
        color: var(--ink); font: 600 13px var(--font-body); cursor: pointer;
      }

      .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 26px 18px; margin-top: 22px; }
      .game {
        display: flex; flex-direction: column; gap: 10px; min-width: 0;
        text-decoration: none; color: inherit; cursor: pointer; outline: none;
      }
      .game .poster { position: relative; transition: transform 0.18s ease; }
      .game .cover {
        width: 100%; aspect-ratio: 1; border-radius: 16px; object-fit: cover; display: block;
        background: var(--sunk); box-shadow: 0 2px 10px rgba(var(--shadow-rgb), 0.1);
        transition: box-shadow 0.18s ease;
      }
      /* the client's focus ring: butter outside, a ground-colored band inside */
      .game:hover .poster, .game:focus-visible .poster { transform: translateY(-3px); }
      .game:hover .cover, .game:focus-visible .cover {
        box-shadow: 0 0 0 3px var(--ground), 0 0 0 7px var(--butter), 0 14px 30px rgba(var(--shadow-rgb), 0.18);
      }
      /* review score stamped on the poster's top-right, coloured by tier */
      .game .score-badge {
        position: absolute; top: 8px; right: 8px; min-width: 34px; padding: 4px 7px;
        border-radius: 9px; text-align: center; color: #fff;
        font: 800 15px/1 var(--font-body); font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); background: var(--bad);
      }
      .game .score-badge.high { background: var(--good); }
      .game .score-badge.mid  { background: var(--pending); }
      .game .meta { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
      .game .name {
        font-size: 15px; font-weight: 600; color: var(--ink); line-height: 1.35;
        overflow-wrap: anywhere;
      }
      .game .sub { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; min-width: 0; }
      .game .sub .pill {
        padding: 3px 9px; border-radius: 100px; font-size: 11.5px; font-weight: 600;
        background: var(--surface); border: 1px solid var(--line); color: var(--secondary);
        white-space: nowrap; flex-shrink: 0; line-height: 1.4;
      }
      .game .sub .pill.base { display: none; }
      .game .sub .pill.update, .game .sub .pill.dlc { background: var(--ink); border-color: var(--ink); color: var(--ground); }
      .game .sub .pill.custom { background: rgba(var(--butter-rgb), 0.25); border-color: transparent; color: var(--ink); }
      .game .sub .pill.mono { font-family: var(--font-mono); font-weight: 500; }
      .game .sub .pill.pub { display: none; }

      .empty {
        grid-column: 1 / -1; padding: 48px; text-align: center; color: var(--secondary); font-size: 14px;
        background: var(--surface); border: 1px dashed var(--line2); border-radius: var(--radius);
      }

      .game.skel { cursor: default; pointer-events: none; }
      .skel .cover, .skel .name-skel, .skel .sub-skel, .sk, .game .cover.loading {
        background: linear-gradient(90deg, var(--sunk) 0%, var(--line) 50%, var(--sunk) 100%);
        background-size: 200% 100%; animation: shimmer 1.4s infinite linear;
      }
      .skel .cover { box-shadow: none; }
      .skel .name-skel { width: 80%; height: 14px; border-radius: 6px; }
      .skel .sub-skel  { width: 50%; height: 11px; border-radius: 6px; }
      @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
      .sk { color: transparent !important; border-radius: 6px; }
      .stat .value.sk { display: inline-block; min-width: 60px; height: 28px; vertical-align: middle; }
      .stat .sub.sk   { display: inline-block; min-width: 78px; height: 11px; }
      #status-text.sk { display: inline-block; min-width: 150px; height: 13px; vertical-align: middle; }

      .pager { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 30px; flex-wrap: wrap; }
      .pager .info { margin-right: auto; font-size: 13px; color: var(--secondary); }
      .pager-btn {
        min-width: 40px; height: 40px; padding: 0 14px; border-radius: 12px;
        background: var(--surface); border: 1px solid var(--line); color: var(--ink);
        font: 600 13px var(--font-body); cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center;
      }
      .pager-btn:hover:not(:disabled) { border-color: var(--ink); }
      .pager-btn:disabled { opacity: 0.35; cursor: not-allowed; }
      .pager-btn.current { background: var(--ink); color: var(--ground); border-color: var(--ink); }
      .pager-ellipsis { color: var(--faint); padding: 0 4px; }

      /* DETAIL MODAL: dark header band over a light body, as on the client */
      .modal-backdrop {
        position: fixed; inset: 0; background: rgba(12, 12, 14, 0.6); backdrop-filter: blur(6px);
        display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px;
        animation: fadeIn 0.2s ease;
      }
      .modal-backdrop.open { display: flex; }
      .modal {
        background: var(--ground); border-radius: 26px; max-width: 760px; width: 100%; max-height: 90vh;
        overflow: hidden auto; animation: rise 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
      }
      /* capped so a zoomed-in or short window still shows the title and details */
      .modal .banner { width: 100%; aspect-ratio: 16 / 9; max-height: 34vh; background: var(--hero); background-size: cover; background-position: center; }
      .modal .body { padding: 26px 30px 28px; }
      .modal .modal-head { display: flex; gap: 18px; align-items: flex-start; margin: 0 0 20px; }
      .modal .modal-head .modal-cover { margin-top: -64px; }
      .modal .modal-cover {
        width: 112px; height: 112px; flex-shrink: 0; border-radius: 20px; object-fit: cover; background: var(--sunk);
        border: 4px solid var(--ground); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
      }
      .modal .modal-head-text { min-width: 0; padding-top: 6px; }
      .modal h3 { font-size: 26px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.02em; line-height: 1.2; }
      .modal .publisher { font-size: 15px; color: var(--secondary); }
      .modal .modal-meta {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px;
        background: var(--surface); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px;
      }
      .modal .modal-meta div { font-size: 12px; color: var(--secondary); }
      .modal .modal-meta strong { display: block; color: var(--ink); font-size: 15px; font-weight: 700; margin-top: 3px; }
      .modal .desc { font-size: 14.5px; color: var(--ink); line-height: 1.7; margin-bottom: 18px; max-height: 220px; overflow-y: auto; }
      .modal .screenshots { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 18px; }
      .modal .screenshots img { width: 240px; height: 135px; border-radius: 12px; object-fit: cover; flex-shrink: 0; background: var(--sunk); cursor: zoom-in; }
      .modal .extras { margin-bottom: 16px; }
      .modal .extras .extras-head { font-size: 15px; font-weight: 800; color: var(--ink); margin-bottom: 10px; }
      .modal .extras .extra-row {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 12px 16px; margin-bottom: 6px; border-radius: 14px; background: var(--surface);
        color: var(--ink); text-decoration: none; font-size: 14px; border: 1px solid transparent;
      }
      .modal .extras .extra-row:hover { border-color: var(--butter); }
      .modal .extras .extra-name { font-weight: 600; word-break: break-all; }
      .modal .extras .extra-size { color: var(--secondary); flex-shrink: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
      .modal .art-edit { margin-bottom: 16px; padding: 14px 16px; border-radius: var(--radius); background: var(--surface); }
      .modal .art-edit .art-head { font-size: 15px; font-weight: 800; margin-bottom: 10px; }
      .modal .art-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
      .modal .art-row:last-child { margin-bottom: 0; }
      .modal .art-row .art-label { width: 64px; flex-shrink: 0; color: var(--secondary); font-size: 12px; }
      .modal .art-thumb { border-radius: 8px; object-fit: cover; background: var(--sunk); flex-shrink: 0; }
      .modal .art-shot { position: relative; display: inline-flex; }
      .modal .art-shot-x {
        position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 50%;
        border: none; cursor: pointer; padding: 0; background: var(--bad); color: #fff; font-size: 11px; line-height: 20px;
      }
      .btn.tiny { padding: 6px 12px; font-size: 12px; border-radius: 9px; }
      .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .modal-actions .btn { flex: 1; padding: 15px 20px; font-size: 16px; border-radius: 16px; }

      .toast-rack { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 200; pointer-events: none; }
      .toast {
        background: var(--ink); color: var(--ground); padding: 12px 22px; border-radius: 100px;
        font-size: 14px; font-weight: 600; margin-top: 8px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

      .fab {
        position: fixed; right: 24px; bottom: 24px; z-index: 90; height: 56px; padding: 0 24px; border-radius: 28px;
        background: var(--butter); color: var(--butter-ink); font: 700 15px var(--font-body);
        border: none; cursor: pointer; display: none; gap: 8px; align-items: center;
        box-shadow: 0 12px 30px rgba(var(--butter-rgb), 0.45);
      }
      .fab:hover { transform: translateY(-1px); }
      .fab.show { display: inline-flex; }
      .upload-tray {
        position: fixed; right: 24px; bottom: 92px; z-index: 95; width: 380px; max-width: calc(100vw - 48px);
        max-height: 70vh; overflow: auto; background: var(--surface); border: 1px solid var(--line);
        border-radius: 22px; padding: 18px; display: none; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }
      .upload-tray.open { display: block; }
      .upload-tray h3 { margin: 0 0 12px; font-size: 17px; font-weight: 800; }
      .drop-zone { border: 2px dashed var(--line2); border-radius: 16px; padding: 24px 16px; text-align: center; color: var(--secondary); font-size: 13px; cursor: pointer; }
      .drop-zone.dragover { border-color: var(--butter); color: var(--ink); background: rgba(var(--butter-rgb), 0.1); }
      .upload-list { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
      .upload-row { background: var(--sunk); border-radius: 14px; padding: 10px 12px; font-size: 12.5px; }
      .upload-row .name { font-weight: 600; word-break: break-all; margin-bottom: 6px; }
      .upload-row .meta { color: var(--secondary); margin-bottom: 8px; font-family: var(--font-mono); font-size: 11px; }
      .upload-row .actions { display: flex; gap: 6px; }
      .upload-row .actions button {
        flex: 1; padding: 7px 10px; border-radius: 10px; font: 600 12px var(--font-body);
        border: 1px solid var(--line2); background: transparent; color: var(--ink); cursor: pointer;
      }
      .upload-row .actions button.primary { background: var(--butter); color: var(--butter-ink); border-color: transparent; }
      .upload-row .actions button:hover { background: var(--line); }
      .upload-empty, .upload-disabled { color: var(--secondary); font-size: 12.5px; text-align: center; padding: 14px 0; }
      .upload-progress { margin-top: 10px; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; display: none; }
      .upload-progress.show { display: block; }
      .upload-progress .bar { height: 100%; width: 0%; background: var(--butter); transition: width 0.15s; }
      .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); margin-right: 6px; vertical-align: middle; }
      .live-dot.on  { background: var(--good); }
      .live-dot.off { background: var(--pending); }

      .footer { margin-top: 48px; text-align: center; font-size: 13px; color: var(--faint); }
      .footer code { font-family: var(--font-mono); }
      .footer a { color: var(--ink); text-decoration: none; font-weight: 600; }
      .footer a:hover { text-decoration: underline; }

      @media (max-width: 900px) {
        .panels { grid-template-columns: 1fr; }
      }
      @media (max-width: 640px) {
        body { padding: 16px 16px 80px; }
        .wordmark { font-size: 21px; }
        .logo { width: 36px; height: 36px; }
        .hero { flex-direction: column; align-items: flex-start; gap: 20px; padding: 24px; }
        .hero .hero-cover { width: 132px; height: 132px; }
        .connect-row { flex-wrap: wrap; }
        .connect-row .url-pill { flex: 1 1 100%; }
        .connect-row .btn { flex: 1; }
        .games { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 14px; }
        .recent { grid-auto-columns: 140px; }
        .modal-backdrop { padding: 0; align-items: flex-end; }
        .modal { border-radius: 24px 24px 0 0; max-height: 94vh; }
        .modal .body { padding: 22px 20px; }
        .modal .modal-head { flex-direction: column; gap: 10px; }
        .pager .info { width: 100%; margin-bottom: 8px; text-align: center; }
      }

                  <span class="nh-val sk" id="nh-titledb">—</span>
