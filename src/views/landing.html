          if ($("hero").classList.contains("skel")) { setHeroSkeleton(false); $("hero").hidden = true; $("home-rows").replaceChildren(); }
          if ($("charts").querySelector(".skel")) { $("charts").hidden = true; $("charts").innerHTML = ""; }
        } finally {
          clearTimeout(timer);
        }
      }

      let showcaseKey = "";
      // Every file in the catalog, in the shape the page works with.
      function catalogFiles(body) {
        return (body.sections || []).flatMap((section) => section.items || []).map((it) => ({
          url: it.url, name: it.name || "", size: it.size, mtime: it.added_at,
          titleId: it.title_id, baseTitleId: it.base_title_id, kind: it.app_type, version: it.app_version ?? 0,
          icon_url: it.icon_url,
        }));
      }

      function renderAll(library, { quiet = false } = {}) {
        const featuredChanged = indexSections(library);
        extras.refreshAvailability();
        const files = catalogFiles(library);

        const baseFiles   = files.filter(f => (f.kind || "base") === "base");
        // A game kept as two files (two regions, or base and a repack) is still one title.
        const baseCount   = new Set(baseFiles.map(f => (f.baseTitleId || f.titleId || f.name || "").toUpperCase())).size;
        const updateCount = files.filter(f => f.kind === "update").length;
        const dlcCount    = files.filter(f => f.kind === "dlc").length;
        const totalSize   = files.reduce((n, f) => n + (Number(f.size) || 0), 0);

        // Show BASE titles in the running marquee — that's what people mean
        // by "how many games". updates + DLC roll up under the base on
        // their cards (the '+N 업데이트' / '+N DLC' pills) and in the
        // /games stat below, so we don't double-count here.
        // Data's here — drop the entry skeletons on the stat values + status.
        for (const id of ["stat-games", "stat-updates", "stat-dlc", "stat-size", "stat-size-sub"]) {
          $(id).classList.remove("sk");
        }
        $("status-text").classList.remove("sk");
        $("games-count").classList.remove("sk");

        $("status").classList.remove("cold", "warm");
        if (files.length === 0) {
          $("status").classList.add("warm");
          $("status-text").textContent = t("status.empty");
        } else {
          $("status-text").textContent = t("status.serving", baseCount);
        }

        animateCount($("stat-games"), baseCount);
        animateCount($("stat-updates"), updateCount);
        animateCount($("stat-dlc"), dlcCount);
        $("stat-size").textContent = fmtBytes(totalSize);
        $("stat-size-sub").textContent = t("stat.size_sub", files.length);
        chartFiles = files;
        renderCharts();

        // Roll up update/DLC counts onto each base title so the card can
        // surface 'this base also has N updates / M DLC in your library'.
        const updByBase = new Map(), dlcByBase = new Map(), updAddedByBase = new Map();
        for (const f of files) {
          if (!f.baseTitleId) continue;
          if (f.kind === "update") {
            updByBase.set(f.baseTitleId, (updByBase.get(f.baseTitleId) || 0) + 1);
            if (typeof f.mtime === "number") updAddedByBase.set(f.baseTitleId, Math.max(updAddedByBase.get(f.baseTitleId) || 0, f.mtime));
          }
          else if (f.kind === "dlc") dlcByBase.set(f.baseTitleId, (dlcByBase.get(f.baseTitleId) || 0) + 1);
        }

        renderedItems = files.map((f, idx) => {
          const kind = f.kind || "custom";
          // Search matches the shown name and the title's name in every language.
          const names = Object.values(sectionOf.get((f.titleId || "").toUpperCase())?.names || {});
          return {
            idx, item: f, kind,
            name: (f.name || "").toLowerCase(),
            added: typeof f.mtime === "number" ? f.mtime : 0,
            tid: (f.titleId || "").toLowerCase(),
            search: [f.name, ...names].join("  ").toLowerCase(),
            size: typeof f.size === "number" ? f.size : 0,
            releaseDate: sectionOf.get((f.titleId || "").toUpperCase())?.release_date || 0,
            updateCount: kind === "base" && f.titleId ? (updByBase.get(f.titleId) || 0) : 0,
            dlcCount:    kind === "base" && f.titleId ? (dlcByBase.get(f.titleId) || 0) : 0,
            updAdded:    kind === "base" && f.titleId ? (updAddedByBase.get(f.titleId) || 0) : 0,
          };
        });

        // The preview is rebuilt only when the games in it change, so a live update doesn't reload its covers.
        const nextShowcase = renderedItems.filter((r) => r.kind === "base").map((r) => `${r.tid}|${r.item.name}|${r.item.icon_url}|${r.added}`).join("\n");
        if (!quiet || featuredChanged || nextShowcase !== showcaseKey) renderShowcase();
        showcaseKey = nextShowcase;
        if (!quiet) state.page = 1;
        renderGenreChips();
        renderSteamChips();
        applyFilters();
      }

      // ─── filter / sort / paginate ─────────────────────────────────────────
      // A game kept as several base files (an XCI and an NSP, or an older dump) is one card.
      // The highest version stands for it, then the newest file; the card sorts by the newest
      // file of the title. The detail still offers every file.
      const titleKeyOf = (r) => (r.item.baseTitleId || r.item.titleId || "").toUpperCase();
      const baseRank = (a, b) => fileVersion(b.item) - fileVersion(a.item) || b.added - a.added || a.idx - b.idx;
      function oneCardPerTitle(list) {
        const groups = new Map();
        for (const r of list) {
          const key = titleKeyOf(r) || "#" + r.idx;
          if (groups.has(key)) groups.get(key).push(r); else groups.set(key, [r]);
        }
        return [...groups.values()].map((group) => {
          if (group.length === 1) return group[0];
          const [best] = [...group].sort(baseRank);
          return { ...best, added: Math.max(...group.map((r) => r.added)) };
        });
      }

      function visibleSet() {
        const matched = renderedItems.filter(r => {
          if (r.kind !== state.kind) return false;
          if (state.genre && !(genreOf.get((r.item.baseTitleId || r.item.titleId || "").toUpperCase()) || []).includes(state.genre)) return false;
          if (state.steam && scoreFor(r)?.label !== state.steam) return false;
          if (state.q && !r.search.includes(state.q) && !r.tid.includes(state.q)) return false;
          return true;
        });
        const list = state.kind === "base" ? oneCardPerTitle(matched) : matched;
        list.sort((a, b) => {
          switch (state.sort) {
            case "name-desc":    return b.item.name.localeCompare(a.item.name);
            case "size-desc":    return b.size - a.size;
            case "size-asc":     return a.size - b.size;
            case "release-desc": return (b.releaseDate || 0) - (a.releaseDate || 0);
            case "added-desc":   return b.added - a.added;
            case "score-desc":   return (scoreFor(b)?.score ?? -1) - (scoreFor(a)?.score ?? -1) || a.item.name.localeCompare(b.item.name);
            case "name":
            default:             return a.item.name.localeCompare(b.item.name);
          }
        });
        return list;
      }

      let lastListKey = "";
      function applyFilters() {
        state.perPage = fitPerPage();
        const list = visibleSet();
        const total = list.length;
        const pages = Math.max(1, Math.ceil(total / state.perPage));
        state.page = Math.min(state.page, pages);
        const start = (state.page - 1) * state.perPage;
        const slice = list.slice(start, start + state.perPage);

        const listKey = lang + "|" + state.page + "\n" + slice.map((r) => {
          const tid = (r.item.baseTitleId || r.item.titleId || "").toUpperCase();
          return [r.idx, r.item.name, r.item.icon_url, r.item.size, r.updateCount, r.dlcCount, JSON.stringify(scoreFor(r)), JSON.stringify(sectionOf.get(tid) || null)].join("|");
        }).join("\n");
        if (listKey !== lastListKey || !$("games").firstElementChild) renderList(slice);
        lastListKey = listKey;
        $("games-count").textContent = `${total.toLocaleString()} / ${renderedItems.length.toLocaleString()}`;
        renderPager($("pager"), state.page, pages, total, start + 1, Math.min(total, start + slice.length), (n) => {
          state.page = n;
          applyFilters();
          // Intentional: changing pages brings the grid top into view.
          $("games").scrollIntoView({ behavior: "smooth", block: "start" });
        });
      }

      function renderList(list) {
        const grid = $("games");
        grid.innerHTML = "";
        grid.setAttribute("aria-busy", "false");
        if (list.length === 0) {
          grid.innerHTML = `<div class="empty">${t(renderedItems.length ? "empty.none" : "empty.library")}</div>`;
          return;
        }
        const frag = document.createDocumentFragment();
        for (const r of list) frag.appendChild(makeCard(r));
        grid.appendChild(frag);
        // NOTE: do NOT scrollIntoView here. renderList() runs on initial load,
        // every search keystroke and every filter change — auto-scrolling on all
        // of those yanks the page around ("자꾸 지가 내려감"). Page-change scroll
        // is handled in the pager button click instead, where it's intentional.
      }

      // Badge colour by score band (90+, 80s, 70s, 50–69, below 50), as on the client app.
      const scoreTier = (sc) => (sc.score >= 90 ? "s90" : sc.score >= 80 ? "s80" : sc.score >= 70 ? "s70" : sc.score >= 50 ? "s50" : "low");
      // Steam's review wording, best first, for the filter chips.
      const STEAM_ORDER = [
        "Overwhelmingly Positive", "Very Positive", "Positive", "Mostly Positive", "Mixed",
        "Mostly Negative", "Negative", "Very Negative", "Overwhelmingly Negative",
      ];
      const steamLabelName = (key) => { const n = scoreNames[key] || {}; return n[lang] || n.en || key; };

      function scoreFor(r) {
        return scoreOf.get((r.item.baseTitleId || r.item.titleId || "").toUpperCase()) || null;
      }

      // "75 · 대체로 긍정적" with the label in the page language when Steam gave one.
      function scoreText(score, labelKey, localized) {
        const names = scoreNames[labelKey] || {};
        const label = localized || names[lang] || names.en || labelKey || "";
        return label ? `${score} · ${label}` : String(score);
      }

      function genreLabel(key) {
        const names = genreNames[key] || {};
        return names[lang] || names.en || key;
      }

      // Genres, scores, per-title facts and the admin's featured rows from the catalog.
      // Returns whether the featured rows changed.
      function indexSections(body) {
        const next = new Map();
        const scores = new Map();
        const items = new Map();
        const files = new Map();
        for (const section of body.sections || []) {
          for (const item of section.items || []) {
            if (item.title_id) files.set(String(item.title_id).toUpperCase() + ":" + (item.app_version ?? 0), item);
            if (item.app_type !== "base" || !item.title_id) continue;
            const tid = String(item.title_id).toUpperCase();
            items.set(tid, item);
            if (Array.isArray(item.categories)) next.set(tid, item.categories);
            if (Number.isFinite(item.score)) scores.set(tid, { score: item.score, count: item.score_count, label: item.score_label });
          }
        }
        genreOf = next;
        scoreOf = scores;
        sectionOf = items;
        sectionFiles = files;
        featuredRows = Array.isArray(body.featured) ? body.featured : [];
        genreNames = body.genres && typeof body.genres === "object" ? body.genres : {};
        scoreNames = body.score_labels && typeof body.score_labels === "object" ? body.score_labels : {};
        if (state.genre && ![...next.values()].some((keys) => keys.includes(state.genre))) state.genre = "";
        const nextFeatured = JSON.stringify(featuredRows);
        const changed = nextFeatured !== featuredKey;
        featuredKey = nextFeatured;
        return changed;
      }

      // ─── charts in the stats panel ───────────────────────────────────────
      let chartFiles = [];
      let featuredKey = "", chartHtml = [];
      const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const legendRow = (color, label, value) => `<div><i style="--c:${color}"></i><span>${esc(label)}</span><b>${esc(value)}</b></div>`;
      const chartCard = (title, total, body, cls = "") =>
        `<div class="chart${cls}"><h4><span>${esc(title)}</span>${total ? `<span class="total">${esc(total)}</span>` : ""}</h4>${body}</div>`;

      function donut(parts) {
        const sum = parts.reduce((a, p) => a + p.n, 0) || 1;
        const r = 40, c = 2 * Math.PI * r;
        let offset = 0;
        const rings = parts.filter((p) => p.n > 0).map((p) => {
          const len = (p.n / sum) * c;
          const ring = `<circle r="${r}" cx="52" cy="52" stroke="${p.color}" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-offset}"/>`;
          offset += len;
          return ring;
        }).join("");
        return `<svg class="donut" viewBox="0 0 104 104" aria-hidden="true"><circle r="${r}" cx="52" cy="52" stroke="var(--line)"/>${rings}</svg>`;
      }

      function hbars(rows, max) {
        return `<div class="hbars">${rows.map((r) => `<div class="hbar"><span title="${esc(r.label)}">${esc(r.label)}</span>` +
          `<div class="track"><div class="fill" style="width:${Math.max(2, (r.n / (max || 1)) * 100)}%${r.color ? `;--c:${r.color}` : ""}"></div></div><b>${esc(r.text ?? r.n.toLocaleString())}</b></div>`).join("")}</div>`;
      }

      function renderCharts() {
        const box = $("charts");
        const files = chartFiles;
        if (!files.length) { box.hidden = true; box.innerHTML = ""; chartHtml = []; return; }
        const KINDS = [["base", "var(--c1)", t("chip.base")], ["update", "var(--c2)", t("chip.update")], ["dlc", "var(--c3)", t("chip.dlc")]];
        const kindOf = (f) => f.kind || "base";
        const cards = [];

        const counts = KINDS.map(([k, color, label]) => ({ n: files.filter((f) => kindOf(f) === k).length, color, label }));
        cards.push(chartCard(t("chart.composition"), t("chart.total", files.length.toLocaleString()),
          `<div class="donut-wrap">${donut(counts)}<div class="legend">${counts.map((p) => legendRow(p.color, p.label, p.n.toLocaleString())).join("")}</div></div>`));

        const bytes = KINDS.map(([k, color, label]) => ({ n: files.filter((f) => kindOf(f) === k).reduce((a, f) => a + (typeof f.size === "number" ? f.size : 0), 0), color, label }));
        const allBytes = bytes.reduce((a, b) => a + b.n, 0);
        if (allBytes > 0) {
          cards.push(chartCard(t("chart.storage"), t("chart.total", fmtBytes(allBytes)),
            `<div class="stack">${bytes.filter((b) => b.n > 0).map((b) => `<i style="--c:${b.color};flex:${b.n}"></i>`).join("")}</div>` +
            `<div class="legend">${bytes.map((b) => legendRow(b.color, b.label, fmtBytes(b.n))).join("")}</div>`));
        }

        // base entries added per month over the last year, from file times
        const now = new Date();
        const months = Array.from({ length: 12 }, (_, i) => new Date(now.getFullYear(), now.getMonth() - 11 + i, 1));
        const perMonth = new Array(12).fill(0);
        for (const f of files) {
          if (kindOf(f) !== "base" || typeof f.mtime !== "number") continue;
          const d = new Date(f.mtime < 1e12 ? f.mtime * 1000 : f.mtime);
          const i = (d.getFullYear() - months[0].getFullYear()) * 12 + d.getMonth() - months[0].getMonth();
          if (i >= 0 && i < 12) perMonth[i]++;
        }
        const peak = Math.max(...perMonth);
        if (peak > 0) {
          const fmtMonth = new Intl.DateTimeFormat(lang === "zh" ? "zh-CN" : lang, { month: "numeric" });
          cards.push(chartCard(t("chart.added"), t("chart.total", perMonth.reduce((a, b) => a + b, 0).toLocaleString()),
            `<div class="cols">${perMonth.map((n, i) => `<div class="col" title="${esc(fmtMonth.format(months[i]))}: ${n}"><div class="bar${n ? "" : " zero"}" style="height:${n ? Math.max(4, (n / peak) * 100) : 2}%"></div></div>`).join("")}</div>` +
            `<div class="col-x">${months.map((m) => `<span>${esc(fmtMonth.format(m).replace(/[^0-9]/g, ""))}</span>`).join("")}</div>`));
        }

        const genres = new Map();
        for (const keys of genreOf.values()) for (const key of keys) genres.set(key, (genres.get(key) || 0) + 1);
        if (genres.size) {
          const top = [...genres].sort((a, b) => b[1] - a[1]).slice(0, 4);
          cards.push(chartCard(t("chart.genres"), "", hbars(top.map(([k, n]) => ({ label: genreLabel(k), n })), top[0][1])));
        }

        // Each row is filled evenly whatever the count: the small cards share theirs, and so do the wide ones.
        const isWide = (c) => c.includes('class="chart wide"');
        const small = cards.filter((c) => !isWide(c)), wide = cards.filter(isWide);
        const sized = (list, wideRow) => list.map((c, i) => {
          const span = wideRow ? (list.length === 1 ? 12 : 6) : 12 / Math.min(4, list.length);
          // on a two-column screen the odd one out at the end takes the whole row
          const oddLast = list.length % 2 === 1 && i === list.length - 1 ? " odd-last" : "";
          return c.replace(/class="chart( wide| skel)?"/, (_, m) => `class="chart${m === " skel" ? " skel" : ""} c${span}${oddLast}"`);
        });
        // Only the cards that changed are swapped, so the rest stay put and don't replay their entrance.
        const next = [...sized(small, false), ...sized(wide, true)];
        if (box.children.length !== next.length) box.innerHTML = next.join("");
        else next.forEach((html, i) => {
          if (html === chartHtml[i]) return;
          const tpl = document.createElement("template"); tpl.innerHTML = html;
          box.children[i].replaceWith(tpl.content.firstElementChild);
        });
        chartHtml = next;
        box.hidden = false;
      }

      // One chip per genre key, busiest first, labelled in the page language.
      function renderGenreChips() {
        const box = $("genre-chips");
        const counts = new Map();
        for (const keys of genreOf.values()) for (const key of keys) counts.set(key, (counts.get(key) || 0) + 1);
        box.hidden = counts.size === 0;
        box.innerHTML = "";
        const chip = (key, label, n) => {
          const b = document.createElement("button");
          b.type = "button"; b.className = "chip" + (state.genre === key ? " active" : ""); b.dataset.genre = key;
          b.setAttribute("aria-pressed", String(state.genre === key));
          b.textContent = label;
          if (n) { const c = document.createElement("span"); c.className = "n"; c.textContent = n.toLocaleString(); b.appendChild(c); }
          box.appendChild(b);
        };
        chip("", t("genre.all"));
        for (const [key, n] of [...counts].sort((a, b) => b[1] - a[1])) chip(key, genreLabel(key), n);
      }

      // One chip per Steam review tier present, best first, in the page language.
      function renderSteamChips() {
        const box = $("steam-chips");
        const counts = new Map();
        for (const sc of scoreOf.values()) if (sc.label) counts.set(sc.label, (counts.get(sc.label) || 0) + 1);
        if (state.steam && !counts.has(state.steam)) state.steam = "";
        box.hidden = counts.size === 0;
        box.innerHTML = "";
        const chip = (key, label, n) => {
          const b = document.createElement("button");
          b.type = "button"; b.className = "chip" + (state.steam === key ? " active" : ""); b.dataset.steam = key;
          b.setAttribute("aria-pressed", String(state.steam === key));
          b.textContent = label;
          if (n) { const c = document.createElement("span"); c.className = "n"; c.textContent = n.toLocaleString(); b.appendChild(c); }
          box.appendChild(b);
        };
        chip("", t("score.all"));
        for (const key of STEAM_ORDER) if (counts.has(key)) chip(key, steamLabelName(key), counts.get(key));
      }
      $("steam-chips").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-steam]");
        if (!b) return;
        state.steam = b.dataset.steam;
        state.page = 1;
        renderSteamChips();
        applyFilters();
      });

      $("genre-chips").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-genre]");
        if (!b) return;
        state.genre = b.dataset.genre;
        state.page = 1;
        renderGenreChips();
        applyFilters();
      });


      // ─── home: the client's store front ───────────────────────────────────
      // Same composition as the client app's home (source/core/Catalog.cpp):
      // a rotating banner of up to five picks, then the admin's featured rows
      // and the themed rows, so the web shows how the store will look.
      const HERO_MS = 6000, HERO_SLIDES = 5, HERO_POOL = 40;
      const ROW_LIMIT = 12, ROW_VISIBLE = 6, TOP_POOL = 36, WIDE_POOL = 80;
      const GREAT_SCORE = 85, BIG_SIZE = 10 * 2 ** 30, PARTY = "Party";
      const CATEGORY_ROWS = 3, MIN_CATEGORY_GAMES = 4;
      let heroSlides = [], heroIndex = 0, heroAt = 0, heroPaused = false, heroDragged = false;

      // A per-day seed: the picks rotate daily but stay put while you browse.
      function seedFor(label) {
        let h = 2166136261;
        for (const c of new Date().toISOString().slice(0, 10) + label) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
        return h >>> 0;
      }
      function seededShuffle(list, seed) {
        const out = [...list];
        let s = seed || 1;
        const next = () => { s = Math.imul(s ^ (s >>> 15), 0x2c1b3c6d) + 0x6d2b79f5 | 0; return ((s ^ (s >>> 14)) >>> 0) / 4294967296; };
        for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
        return out;
      }

      const tidOf = (r) => (r.item.titleId || "").toUpperCase();
      const metaOf = (r) => sectionOf.get(tidOf(r)) || {};
      const releaseOf = (r) => r.releaseDate || metaOf(r).release_date || 0;

      // One theme: filter the base games, then order them like the client does.
      function browse(bases, theme) {
        const list = bases.filter((r) => {
          const m = metaOf(r);
          if (theme.sort === "release" && !releaseOf(r)) return false;
          if (theme.sort === "updated" && !r.updAdded) return false;
          if (theme.minPlayers && !((m.players || 0) >= theme.minPlayers)) return false;
          if (theme.minSize && r.size < theme.minSize) return false;
          if (theme.minScore && !((scoreFor(r)?.score || 0) >= theme.minScore)) return false;
          if (theme.steamLabel && scoreFor(r)?.label !== theme.steamLabel) return false;
          if (theme.korean && !(m.languages || []).includes("ko")) return false;
          if (theme.category && !(m.categories || []).includes(theme.category)) return false;
          if (theme.without && (m.categories || []).includes(theme.without)) return false;
          return true;
        });
        const by = {
          recent: (a, b) => b.added - a.added,
          release: (a, b) => releaseOf(b) - releaseOf(a),
          updated: (a, b) => b.updAdded - a.updAdded,
          popular: (a, b) => (metaOf(a).rank || Number.MAX_SAFE_INTEGER) - (metaOf(b).rank || Number.MAX_SAFE_INTEGER),
          score: (a, b) => (scoreFor(b)?.score || 0) - (scoreFor(a)?.score || 0),
          largest: (a, b) => b.size - a.size,
        }[theme.sort];
        return by ? list.sort(by) : list;
      }

      function buildHeroSlides(bases) {
        const slides = [];
        const used = new Set();
        const feat = featuredRows.find((f) => Array.isArray(f.title_ids) && f.title_ids.length);
        if (feat) {
          const ids = feat.title_ids.map((id) => String(id).toUpperCase());
          const r = ids.map((id) => bases.find((b) => tidOf(b) === id)).find(Boolean);
          if (r) {
            used.add(r);
            slides.push({ r, label: feat.title, banner: feat.banner_url || `/api/library/banner/${tidOf(r)}` });
          }
        }
        const add = (key, theme, pick) => {
          const pool = browse(bases, theme).filter((r) => !used.has(r)).slice(0, pick ? HERO_POOL : 1);
          if (!pool.length) return;
          const r = pool[pick ? seedFor(key) % pool.length : 0];
          used.add(r);
          slides.push({ r, key });
        };
        add("hero.new", { sort: "recent" }, false);
        add("hero.popular", { sort: "popular" }, false);
        add("hero.party", { sort: "popular", minPlayers: 2, without: PARTY }, true);
        add("hero.today", { sort: "popular", korean: true }, true);
        return slides.slice(0, HERO_SLIDES);
      }

      // Each row carries its whole list; the page draws ROW_LIMIT at a time and
      // the next batch as the row is scrolled near its right end.
      function buildRows(bases, heroGame) {
        const rows = [];
        const shown = new Set(heroGame ? [heroGame] : []);
        const keep = (title, items) => {
          if (!items.length) return;
          items.slice(0, ROW_VISIBLE).forEach((r) => shown.add(r));
          rows.push({ title, items });
        };
        for (const f of featuredRows) {
          const ids = (f.title_ids || []).map((id) => String(id).toUpperCase());
          keep(f.title, ids.map((id) => bases.find((b) => tidOf(b) === id)).filter((r) => r && r !== heroGame));
        }
        const add = (key, theme, pool = 0, title = null) => {
          let items = browse(bases, theme).filter((r) => !shown.has(r));
          // A shuffled row opens with a daily pick from its leaders, then goes on in order.
          if (pool) {
            const head = seededShuffle(items.slice(0, pool), seedFor(key));
            items = [...head, ...items.slice(pool)];
          }
          keep(title ?? t(key), items);
        };
        add("row.recent", { sort: "recent" });
        add("row.new", { sort: "release" });
        add("row.updated", { sort: "updated" });
        add("row.popular", { sort: "popular" }, TOP_POOL);
        add("row.great", { sort: "score", minScore: GREAT_SCORE }, WIDE_POOL);
        add("row.steamTop", { sort: "score", steamLabel: "Overwhelmingly Positive" }, WIDE_POOL, steamLabelName("Overwhelmingly Positive"));
        add("row.together", { sort: "popular", minPlayers: 2, without: PARTY }, WIDE_POOL);
        add("row.party", { sort: "popular", category: PARTY }, WIDE_POOL);
        add("row.big", { sort: "largest", minSize: BIG_SIZE }, Infinity);
        add("row.korean", { sort: "release", korean: true }, WIDE_POOL);
        const counts = new Map();
        for (const r of bases) for (const g of metaOf(r).categories || []) if (g !== PARTY) counts.set(g, (counts.get(g) || 0) + 1);
        const top = [...counts].sort((a, b) => b[1] - a[1]).slice(0, CATEGORY_ROWS);
        for (const [g, n] of top) if (n >= MIN_CATEGORY_GAMES) add("genre." + g, { sort: "recent", category: g }, WIDE_POOL, genreLabel(g));
        return rows;
      }

      function renderShowcase() {
        const bases = oneCardPerTitle(renderedItems.filter((r) => r.kind === "base"));
        heroSlides = buildHeroSlides(bases);
        setHeroSkeleton(false);
        $("hero").hidden = !heroSlides.length;
        $("home-rows").setAttribute("aria-busy", "false");
        if (heroIndex >= heroSlides.length) heroIndex = 0;
        if (heroSlides.length) showHero(heroIndex, false);
        const box = $("home-rows"); box.innerHTML = "";
        if (!bases.length) box.innerHTML = `<div class="empty">${t("empty.library")}</div>`;
        for (const row of buildRows(bases, heroSlides[0]?.r)) {
          const block = document.createElement("div"); block.className = "home-row";
          const h = document.createElement("h2"); h.textContent = row.title;
          const list = document.createElement("div"); list.className = "recent";
          const shelf = row.items.slice(0, SHELF_MAX);
          list.append(...shelf.map(makeCard));
          // "See all" opens the shelf out into every game of the row, a chunk at a time.
          let all = null, drawn = 0, sync = () => {};
          const chip = row.items.length > 0 ? iconButton("", "arrowright", "", t("row.seeAll")) : null;
          const expand = (on) => {
            list.classList.toggle("expanded", on);
            list.replaceChildren();
            if (!on) { list.append(...shelf.map(makeCard), seeAllCard(() => expand(true))); chip.lastChild.textContent = t("row.seeAll"); list.scrollLeft = 0; sync(); return; }
            drawn = 0; chip.lastChild.textContent = t("row.collapse");
            const more = () => {
              list.querySelector(":scope > .more")?.remove();
              for (const r of row.items.slice(drawn, drawn + SHELF_CHUNK)) list.appendChild(makeCard(r));
              drawn = Math.min(row.items.length, drawn + SHELF_CHUNK);
              if (drawn < row.items.length) {
                const b = document.createElement("button"); b.type = "button"; b.className = "game see-all more";
                b.innerHTML = '<span class="face"><span></span></span><span class="meta"><span class="name">&nbsp;</span></span>';
                b.querySelector(".face span").textContent = (row.items.length - drawn).toLocaleString() + " +";
                b.addEventListener("click", more); list.appendChild(b);
              }
            };
            more(); sync();
          };
          list.append(seeAllCard(() => expand(true)));
          if (chip) chip.addEventListener("click", () => expand(!list.classList.contains("expanded")));
          if (row.items.length > ROW_LIMIT) {
            const n = document.createElement("span"); n.className = "row-count"; n.textContent = row.items.length.toLocaleString();
            h.appendChild(n);
          }
          block.append(h, list);
          sync = shelfControls(block, list, chip);
          box.appendChild(block);
        }
      }

      // Tags keep to their rows (max-height) and never wrap inside: from the first
      // one that would start a row past them, or is wider than the box, the rest go.
      function fitHeroTags() {
        const box = $("hero-tags");
        const tags = [...box.children];
        for (const el of tags) el.hidden = false;
        const top = box.getBoundingClientRect().top;
        const limit = parseFloat(getComputedStyle(box).maxHeight);
        if (!box.clientWidth || !Number.isFinite(limit)) return;
        let cut = false;
        for (const el of tags) {
          const r = el.getBoundingClientRect();
          cut ||= r.bottom - top > limit + 0.5 || r.width > box.clientWidth;
          el.hidden = cut;
        }
      }
      window.addEventListener("resize", debounce(() => { if (!$("hero").hidden) fitHeroTags(); }, 150));

      function showHero(n, animate = true) {
        heroIndex = (n + heroSlides.length) % heroSlides.length;
        heroAt = Date.now();
        const { r, key, label, banner } = heroSlides[heroIndex];
        const coverSrc = r.item.icon_url ? r.item.icon_url + (r.item.icon_url.includes("?") ? "&" : "?") + "size=lg" : coverPlaceholder();
        const cover = $("hero-cover");
        cover.onerror = () => { cover.onerror = null; cover.src = coverPlaceholder(); };
        cover.src = coverSrc;
        const bg = $("hero-bg");
        bg.className = "hero-bg " + (banner ? "banner" : "blur");
        bg.style.backgroundImage = `url("${banner || coverSrc}")`;
        $("hero-eyebrow").textContent = label || t(key);
        $("hero-title").textContent = localName(r, nameWithAlias(r.item.name || ""));
        const tags = $("hero-tags"); tags.innerHTML = "";
        const addTag = (text) => { const el = document.createElement("span"); el.textContent = text; tags.appendChild(el); return el; };
        const m = metaOf(r);
        const sc = scoreFor(r);
        // A bare number reads as nothing, so the score says what it is when Steam gave no label.
        if (sc) addTag(sc.label ? scoreText(sc.score, sc.label) : `${t("modal.score")} ${sc.score}`).classList.add("score", scoreTier(sc));
        // What a download decides on first; on a narrow screen the later ones give way.
        if ((m.languages || []).includes("ko")) addTag(t("pill.korean"));
        addTag(fmtBytes(r.size));
        for (const g of (m.categories || []).slice(0, 2)) addTag(genreLabel(g));
        const players = Number(m.players);
        if (players > 1) addTag(fmtPlayers(players));
        const released = fmtDate(m.release_date);
        if (released) addTag(t("hero.released", released));
        if (r.updateCount) addTag(t("hero.updates", r.updateCount));
        if (r.dlcCount) addTag(t("hero.dlc", r.dlcCount));
        fitHeroTags();
        $("hero").onclick = () => { if (!heroDragged) openModal(r); };
        const dots = $("hero-dots");
        dots.hidden = heroSlides.length < 2;
        dots.innerHTML = "";
        heroSlides.forEach((_, i) => {
          const b = document.createElement("button");
          b.type = "button"; b.className = i === heroIndex ? "on" : "";
          b.setAttribute("aria-label", t("hero.slide", i + 1));
          b.addEventListener("click", (e) => { e.stopPropagation(); showHero(i); });
          dots.appendChild(b);
        });
        if (animate) { const h = $("hero"); h.classList.remove("swap"); void h.offsetWidth; h.classList.add("swap"); }
      }

      // ─── 검수 칩 ────────────────────────────────────────────────────────────
      // What is known about a homebrew app, retro game, patch or save from people who
      // tried it: 검수됨 (the admin, on a console) and 잘 돼요 / 안 돼요 from signed-in
      // accounts and consoles (/api/votes). A list shows both on the name's line; a
      // detail shows one chip that opens a small popover to vote in. A vote redraws
      // every place the item shows, without a reload.
      const checks = (() => {
        // Lucide thumbs-up (ISC); thumbs-down is the same turned over.
        const THUMB = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>'; // privacy-ok: SVG path data
        const THUMB_DOWN = THUMB.replace("<svg ", '<svg class="thumb-down" ');
        const known = new Map();   // "kind:id" → { verified, at, up, down, mine }
        const voted = new Set();   // voted on here: a list fetched before keeps its older counts out
        const keyOf = (kind, id) => kind + ":" + id;
        const canVote = () => Boolean(session);
        const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
        function note(kind, it) {
          const key = keyOf(kind, it.id);
          const had = known.get(key);
          const fresh = { up: it.votes?.up ?? 0, down: it.votes?.down ?? 0, mine: it.my_vote ?? null };
          known.set(key, { verified: Boolean(it.verified), at: it.verified_at ?? null, ...(had && voted.has(key) ? { up: had.up, down: had.down, mine: had.mine } : fresh) });
          return known.get(key);
        }
        function paintVotes(p, s) {
          p.hidden = !(s.up > 0);
          // Nothing inside at none, so the name line's text stays the name.
          if (p.hidden) p.replaceChildren(); else { p.innerHTML = THUMB; p.append(String(s.up)); }
          p.title = t("check.worksN", s.up);
          p.setAttribute("aria-label", t("check.worksN", s.up));
        }
        // The name line's pills: 검수됨, then the 잘 돼요 count (kept hidden at none, so a vote can show it).
        function namePills(kind, it) {
          const s = note(kind, it);
          const out = [];
          if (s.verified) out.push(el("span", "pill verified", t("hb.verified")));
          const p = el("span", "pill votes"); p.dataset.check = keyOf(kind, it.id);
          paintVotes(p, s);
          out.push(p);
          return out;
        }
        function paintChip(b, s) {
          const showUp = s.up > 0 || canVote();
          b.hidden = !s.verified && !showUp;
          b.replaceChildren();
          if (s.verified) b.append(el("span", "cc-verified", t("hb.verified")));
          if (showUp) { const u = el("span", "cc-up" + (s.mine === "up" ? " mine" : "")); u.innerHTML = THUMB; u.append(String(s.up)); b.append(u); }
          b.setAttribute("aria-label", [t("check.label"), s.verified ? t("hb.verified") : "", t("check.worksN", s.up)].filter(Boolean).join(", "));
        }
        let pop = null;   // { box, chip, key, kind, id }
        function close(focus = false) {
          if (!pop) return;
          const { box, chip } = pop;
          pop = null;
          box.remove();
          chip.setAttribute("aria-expanded", "false");
          if (focus) chip.focus();
        }
        function fillPop() {
          const s = known.get(pop.key);
          const parts = [];
          if (s.verified) {
            parts.push(el("p", "cp-verified", t("hb.verified")));
            parts.push(el("p", "cp-sub", [t("check.byAdmin"), ymd(s.at)].filter(Boolean).join(" · ")));
          }
          parts.push(el("p", "cp-counts", t("check.counts", s.up, s.down)));
          if (canVote()) {
            const row = el("div", "cp-votes");
            for (const [v, label, icon] of [["up", t("check.works"), THUMB], ["down", t("check.broken"), THUMB_DOWN]]) {
              const b = el("button"); b.type = "button"; b.dataset.vote = v;
              b.setAttribute("aria-pressed", String(s.mine === v));
              b.innerHTML = icon; b.append(label);
              b.addEventListener("click", () => send(s.mine === v ? null : v, v));
              row.append(b);
            }
            parts.push(row);
          }
          pop.box.replaceChildren(...parts);
        }
        function place() {
          const { box, chip } = pop;
          const host = box.parentElement;
          box.style.top = chip.offsetTop + chip.offsetHeight + 6 + "px";
          box.style.left = Math.max(0, Math.min(chip.offsetLeft, host.clientWidth - box.offsetWidth)) + "px";
        }
        function open(chip, kind, id) {
          if (pop?.chip === chip) return close(true);
          close();
          const box = el("div", "check-pop");
          box.setAttribute("role", "dialog"); box.setAttribute("aria-label", t("check.label"));
          box.addEventListener("click", (e) => e.stopPropagation());
          pop = { box, chip, key: keyOf(kind, id), kind, id };
          fillPop();
          chip.after(box);
          chip.setAttribute("aria-expanded", "true");
          place();
          (box.querySelector('[aria-pressed="true"]') || box.querySelector("button"))?.focus();
        }
        // Every chip, name pill and open popover of the item, as it now stands.
        function redraw(key) {
          const s = known.get(key);
          for (const n of document.querySelectorAll(".pill.votes[data-check], .check-chip[data-check]")) {
            if (n.dataset.check !== key) continue;
            if (n.classList.contains("check-chip")) paintChip(n, s); else paintVotes(n, s);
          }
          if (pop?.key === key && pop.box.isConnected) { fillPop(); place(); }
        }
        // Pressing the pressed one takes the vote back; focus stays on the button pressed.
        async function send(v, pressed) {
          const { kind, id, key, box } = pop;
          for (const b of box.querySelectorAll("button")) b.disabled = true;
          try {
            const r = await fetch(`/api/votes/${encodeURIComponent(kind)}/${encodeURIComponent(id)}`, {
              method: "POST", headers: { Accept: "application/json", "Content-Type": "application/json" }, body: JSON.stringify({ vote: v }),
            });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(d.error || "");
            voted.add(key);
            known.set(key, { ...known.get(key), up: d.up, down: d.down, mine: d.mine });
            redraw(key);
            pop?.box.querySelector(`[data-vote="${pressed}"]`)?.focus();
          } catch {
            toast(t("check.failed"));
            for (const b of box.querySelectorAll("button")) b.disabled = false;
          }
        }
        // The detail's chip, or a hidden one when there is nothing to show (a later vote or edit fills it).
        function chip(kind, it) {
          const s = note(kind, it);
          const b = el("button", "check-chip"); b.type = "button"; b.dataset.check = keyOf(kind, it.id);
          b.setAttribute("aria-haspopup", "dialog"); b.setAttribute("aria-expanded", "false");
          paintChip(b, s);
          b.addEventListener("click", (e) => { e.stopPropagation(); open(b, kind, it.id); });
          return b;
        }
        // The edit panel turned 검수됨 on or off.
        function setVerified(kind, id, on) {
          const key = keyOf(kind, id);
          known.set(key, { ...(known.get(key) ?? { up: 0, down: 0, mine: null }), verified: on, at: on ? known.get(key)?.at ?? new Date().toISOString() : null });
          redraw(key);
        }
        // Signing in shows the chip where it had nothing to show.
        const repaint = () => { for (const n of document.querySelectorAll(".check-chip[data-check]")) if (known.has(n.dataset.check)) paintChip(n, known.get(n.dataset.check)); };
        document.addEventListener("click", (e) => { if (pop && !pop.box.contains(e.target) && e.target !== pop.chip && !pop.chip.contains(e.target)) close(); }, true);
        window.addEventListener("keydown", (e) => { if (e.key === "Escape" && pop) { e.stopPropagation(); close(true); } }, true);
        return { namePills, chip, setVerified, repaint, close };
      })();

      // ─── retro games (/api/retro) ───────────────────────────────────────────
      // One chip per console, square tiles the server draws, pages loaded as
      // the list scrolls. A multi-disc game downloads as its bundle (discs + .m3u).
      const retro = (() => {
        let systems = null, system = "", page = 1, shownPer = 0, seq = 0;
        // The labels' words, from every retro reply's "labels" (meta/card-labels.js RETRO_LABELS).
        let labelBook = {};
        const keepLabels = (d) => { if (d?.labels) labelBook = { ...labelBook, ...d.labels }; return d; };
        const box = () => $("retro-games");
        const nameOf = (s) => s.names?.[lang] || s.name;
        async function getJson(url) {
          const r = await fetch(url, { headers: { Accept: "application/json" } });
          if (!r.ok) throw new Error(String(r.status));
          return r.json();
        }
        function renderSystems() {
          const row = $("retro-systems");
          row.replaceChildren();
          const all = systems.reduce((n, s) => n + s.romCount, 0);
          const chip = (id, label, count, icon) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "chip" + (id === system ? " active" : "");
            if (icon) { const im = document.createElement("img"); im.src = icon; im.alt = ""; im.loading = "lazy"; b.append(im); }
            const n = document.createElement("span"); n.className = "n"; n.textContent = count;
            b.append(document.createTextNode(label), n);
            b.addEventListener("click", () => { system = id; renderSystems(); reload(); });
            return b;
          };
          row.append(chip("", t("retro.all"), all, null));
          for (const s of systems.filter((s) => s.romCount > 0)) row.append(chip(s.id, nameOf(s), s.romCount, s.iconUrl));
        }
        function card(g) {
          const a = document.createElement("button");
          a.type = "button";
          a.className = "game";
          a.title = g.name;
          a.addEventListener("click", () => openRetroModal(g, systems?.find((s) => s.id === g.system)));
          const poster = document.createElement("div"); poster.className = "poster";
          const letterCover = () => {
            const d = document.createElement("div"); d.className = "cover letter"; d.textContent = [...g.name.trim()][0] || "?";
            return d;
          };
          let cover;
          // The box art itself, filling the square card like a Switch icon. The server's square
          // (the whole cover on a blurred copy of itself) is for the client's small tiles and smears at web sizes.
          const art = g.boxartUrl ? g.boxartUrl + "&size=md" : g.iconUrl;
          if (art) {
            cover = document.createElement("img"); cover.className = "cover"; cover.src = art; cover.alt = ""; cover.loading = "lazy"; cover.decoding = "async";
            // Retry once (the server may be restarting), then show the letter tile, never a broken image.
            let retried = false;
            cover.addEventListener("error", () => {
              if (!retried) { retried = true; setTimeout(() => { cover.src = art + "&retry=1"; }, 3000); return; }
              cover.replaceWith(letterCover());
            });
          } else {
            cover = letterCover();
          }
          const size = document.createElement("span"); size.className = "poster-badge size-badge"; size.textContent = fmtBytes(g.size);
          poster.append(cover, size);
          const meta = document.createElement("div"); meta.className = "meta";
          const name = document.createElement("div"); name.className = "name"; name.textContent = g.name; name.title = g.name;
          const sub = document.createElement("div"); sub.className = "sub";
          // The server's labels, as the client draws them: 업적, 한글, its year, how many play at once.
          for (const ref of g.labels ?? []) {
            const [key, value] = Array.isArray(ref) ? ref : [ref];
            const entry = labelBook[key];
            if (!entry) continue; // a label this page has no words for is skipped, as on the client
            const p = document.createElement("span");
            p.textContent = String(entry[lang] ?? entry.en ?? "").replace("{0}", value ?? "");
            if (key === "achievements" || key === "achievements-title") {
              // Gold when this ROM earns them, grey when only its title matched.
              p.className = key === "achievements" ? "pill ach" : "pill ach title-only";
              p.title = t(key === "achievements" ? "retro.achHash" : "retro.achTitle");
              p.insertAdjacentHTML("afterbegin", '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>');
            } else {
              p.className = "pill tone-" + (entry.tone || "neutral");
              if (entry.icon && BTN_ICONS[entry.icon]) p.insertAdjacentHTML("afterbegin", BTN_ICONS[entry.icon]);
            }
            sub.append(p);
          }
          // Then 검수됨 and the 잘 돼요 count, shown once someone voted.
          sub.append(...checks.namePills("retro", g));
          meta.append(name, sub);
          a.append(poster, meta);
          return a;
        }
        // One page at a time, whole rows of cards, with the same pager as the game list.
        async function show(n, scroll = false) {
          const mine = ++seq;
          const perPage = fitPerPage(box());
          box().setAttribute("aria-busy", "true");
          if (!box().querySelector(".game")) box().replaceChildren(...skeletonCards(perPage));
          const q = new URLSearchParams({ page: String(n), pageSize: String(perPage), sort: $("retro-sort").value });
          if (system) q.set("system", system);
          const search = $("retro-search").value.trim();
          if (search) q.set("search", search);
          try {
            const d = keepLabels(await getJson("/api/retro/games?" + q));
            if (mine !== seq) return; // a newer search or system took over
            const pages = Math.max(1, Math.ceil(d.total / perPage));
            if (d.total && n > pages) return show(pages, scroll);
            page = n;
            shownPer = perPage;
            box().replaceChildren(...d.games.map(card));
            $("retro-count").textContent = d.total;
            $("retro-empty").hidden = d.total > 0;
            $("retro-empty").innerHTML = t(search ? "retro.empty" : "retro.none");
            const from = (n - 1) * perPage;
            renderPager($("retro-pager"), n, pages, d.total, from + 1, from + d.games.length, (to) => show(to, true));
            if (scroll) box().scrollIntoView({ behavior: "smooth", block: "start" });
          } catch {
            if (mine === seq) { box().replaceChildren(); $("retro-pager").replaceChildren(); }
          } finally {
            if (mine === seq) box().setAttribute("aria-busy", "false");
          }

        if (!bezelUrl) return;
        frame.onload = () => stage.classList.add("own-frame");
        frame.onerror = () => stage.classList.remove("own-frame");
        frame.src = bustUrl(bezelUrl);
      }

      function setBanner(bannerUrl, iconUrl) {
        const box = $("modal-banner");
        const empty = () => {
          box.style.backgroundImage = "";
          box.style.setProperty("--banner-art", iconUrl ? `url('${bustUrl(iconUrl)}')` : "none");
          box.classList.add("no-art");
        };
        box.dataset.want = bannerUrl;
        if (!bannerUrl) return empty();
        const img = new Image();
        img.onload = () => {
          if (box.dataset.want !== bannerUrl) return;
          box.classList.remove("no-art");
          box.style.backgroundImage = `url('${img.src}')`;
        };
        img.onerror = () => { if (box.dataset.want === bannerUrl) empty(); };
        img.src = bustUrl(bannerUrl);
      }

      // Screenshot-sized shimmer while a detail is on its way.
      const shotSkeletons = () => [0, 1, 2].map(() => Object.assign(document.createElement("div"), { className: "shot-skel sk" }));

      // ─── the detail window's parts, shared by Switch and retro games ───────
      // Pills under the heading: [text, class]; an empty text is left out.
      function fillPills(list) {
        $("modal-pills").replaceChildren(...list.filter(([text]) => text).map(([text, cls]) => {
          const p = document.createElement("span");
          p.className = "pill" + (cls ? " " + cls : ""); p.textContent = text; p.title = text;
          return p;
        }));
      }
      // The info table, in the client's order: [label, value, mono]. A null value
      // shimmers while the detail is on its way; an empty one leaves its cell out.
      function fillMeta(rows) {
        const box = $("modal-meta"); box.replaceChildren();
        for (const [k, v, mono] of rows) {
          if (v !== null && !v) continue;
          const cell = document.createElement("div");
          const label = document.createElement("span"); label.textContent = k;
          const value = document.createElement("strong");
          if (v === null) { value.className = "sk"; value.textContent = " "; } else { value.textContent = v; if (mono) value.className = "mono"; }
          cell.append(label, value);
          box.append(cell);
        }
      }
      // The description; without one, a card saying so (and, for retro games, where to look instead).
      function fillDesc(text, loading, sub = "") {
        const desc = $("modal-desc"); desc.replaceChildren();
        if (text) { desc.textContent = text; return; }
        if (loading) { desc.append(...[0, 1, 2].map(() => Object.assign(document.createElement("span"), { className: "desc-skel sk" }))); return; }
        const card = document.createElement("p"); card.className = "desc-empty";
        const head = document.createElement("strong"); head.textContent = t("modal.noDesc");
        card.append(head);
        if (sub) card.append(document.createTextNode(sub));
        desc.append(card);
      }
      // Chip lines under the table: [heading, [labels]], a line without labels left out.
      function fillChips(lines) {
        const box = $("modal-chips"); box.replaceChildren();
        for (const [head, labels] of lines) {
          if (!labels?.length) continue;
          const line = document.createElement("div"); line.className = "chip-line";
          const h = document.createElement("span"); h.className = "chips-head"; h.textContent = head;
          line.append(h, ...labels.map((l) => Object.assign(document.createElement("span"), { className: "chip", textContent: l })));
          box.append(line);
        }
      }
      // IGDB trailers (/api/videos), shown to admins only: YouTube's thumbnail with a play
      // mark, which becomes YouTube's player (the no-cookie address) only when clicked.
      const YOUTUBE_ID = /^[A-Za-z0-9_-]{11}$/;
      let videosSeq = 0;
      function loadVideos(path) {
        const mine = ++videosSeq;
        fillVideos([]);
        if (!path || (session && !session.admin)) return;
        fetch("/api/videos/" + path, { headers: { Accept: "application/json" } })
          .then((r) => (r.ok ? r.json() : null))
          .catch(() => null)
          .then((d) => { if (mine === videosSeq) fillVideos(Array.isArray(d?.videos) ? d.videos : []); });
      }
      function fillVideos(list) {
        const box = $("modal-videos");
        const videos = list.filter((v) => YOUTUBE_ID.test(v?.id ?? "")).slice(0, 8);
        box.replaceChildren();
        box.hidden = !videos.length;
        if (!videos.length) return;
        const row = Object.assign(document.createElement("div"), { className: "video-row" });
        for (const v of videos) {
          const name = typeof v.name === "string" ? v.name : "";
          const card = Object.assign(document.createElement("div"), { className: "video-card" });
          const thumb = Object.assign(document.createElement("button"), { type: "button", className: "video-thumb" });
          thumb.setAttribute("aria-label", name ? `${t("modal.videoPlay")}: ${name}` : t("modal.videoPlay"));
          const img = Object.assign(document.createElement("img"), { src: `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`, alt: "", loading: "lazy", decoding: "async" });
          const play = Object.assign(document.createElement("span"), { className: "play" });
          play.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
          thumb.append(img, play);
          thumb.addEventListener("click", () => {
            const frame = document.createElement("iframe");
            frame.src = `https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1`;
            frame.title = name || t("modal.videos");
            frame.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
            frame.allowFullscreen = true;
            // The page sends no referrer at all; YouTube's player refuses to start without its origin.
            frame.referrerPolicy = "strict-origin-when-cross-origin";
            thumb.replaceWith(frame);
          });
          card.append(thumb);
          if (name) card.append(Object.assign(document.createElement("span"), { className: "video-name", textContent: name, title: name }));
          row.append(card);
        }
        const head = document.createElement("h4");
        head.textContent = t("modal.videos");
        box.append(head, row);
      }
      function fillShots(urls, loading) {
        const scr = $("modal-screens"); scr.replaceChildren(...(loading ? shotSkeletons() : []));
        for (const url of urls) {
          const im = document.createElement("img");
          im.loading = "lazy"; im.src = bustUrl(url); im.alt = "";
          // A screenshot that is not on disk yet is hidden, never a broken-image glyph.
          im.onerror = () => im.remove();
          scr.append(im);
        }
      }
      // One row of a list in the window: [mark?, flag?] name over a second line, size on the right.
      // `tag` ({ kind, text }) puts a coloured badge before the name; `chips` ([{ text, tone }]) replaces `sub` with small badges.
      function detailRow(el, { name, sub = "", size = 0, flag = "", mark = false, title = "", tag = null, chips = null, clamp = false }) {
        el.classList.add("extra-row");
        const main = document.createElement("span"); main.className = "extra-main";
        if (mark) main.append(Object.assign(document.createElement("span"), { className: "mark" }));
        if (flag) main.append(Object.assign(document.createElement("span"), { className: "flag", textContent: flag }));
        if (tag) main.append(Object.assign(document.createElement("span"), { className: `type-tag ${tag.kind}`, textContent: tag.text }));
        const text = document.createElement("span"); text.className = "extra-text";
        const nameEl = document.createElement("span"); nameEl.className = clamp ? "extra-name clamp" : "extra-name"; nameEl.textContent = name;
        if (title || clamp) nameEl.title = title || name;
        const subEl = document.createElement("span");
        if (chips) {
          subEl.className = "extra-chips";
          for (const c of chips.filter((x) => x && x.text)) subEl.append(Object.assign(document.createElement("span"), { className: `mini ${c.tone || ""}`.trim(), textContent: c.text }));
        } else {
          subEl.className = "extra-sub"; subEl.textContent = sub;
        }
        text.append(nameEl, subEl);
        main.append(text);
        const sizeEl = document.createElement("span"); sizeEl.className = "extra-size"; sizeEl.textContent = size > 0 ? fmtBytes(size) : "";
        el.append(main, sizeEl);
        return el;
      }

      const fileVersion = (f) => f.version ?? 0;
      // The library's display version ("1.4.1") of one file, when it has read it.
      const versionName = (titleId, version) => sectionFiles.get(String(titleId || "").toUpperCase() + ":" + version)?.version_name;

      // What the window shows about a Switch game, from the list row, its sections
      // item and (once fetched) its detail; detail wins over the sparse rows.
      function switchFacts(r, detail, baseId) {
        const f = r.item;
        const td = detail;
        const m = sectionOf.get(baseId) || {};
        const group = renderedItems.filter((x) => (x.item.baseTitleId || x.item.titleId || "").toUpperCase() === baseId);
        const sc = Number.isFinite(td.score)
          ? { score: td.score, count: td.scoreCount, key: td.scoreLabelKey, label: td.scoreLabel }
          : scoreOf.has(baseId) ? { ...scoreOf.get(baseId), key: scoreOf.get(baseId).label, label: null } : null;
        const latest = td.latestVersion ?? m.latest_version ?? null;
        const latestFile = group.find((x) => x.kind === "update" && fileVersion(x.item) === latest);
        return {
          td, group,
          name: pickName(r.kind === "base" ? (td.names || m.names) : null, nameWithAlias(f.name || t("misc.unnamed"), td.aliases)),
          publisher: td.publisher || m.publisher || "",
          languages: td.languages || m.languages || [],
          score: sc,
          genres: Array.isArray(td.categoryLabels) ? td.categoryLabels : (m.categories || []).map(genreLabel),
          release: fmtDate(td.releaseDate || m.release_date),
          players: fmtPlayers(Number(td.numberOfPlayers ?? m.players)),
          baseSize: (r.kind === "base" ? r.size : 0) || group.find((x) => x.kind === "base")?.size || td.size || 0,
          installSize: m.install_size || 0,
          firmware: td.requiredFirmware || m.required_firmware || "",
          rating: [td.rating != null ? String(td.rating) : "", (td.ratingContent || []).join(", ")].filter(Boolean).join(" · "),
          dlcTotal: Number(td.dlcTotal ?? m.dlc_total) || 0,
          dlcHere: group.filter((x) => x.kind === "dlc").length,
          latest: latest != null ? fmtVersion(latest, latestFile && versionName(latestFile.item.titleId, latest)) : "",
          region: td.region || m.region || "",
        };
      }

      // Header, pills, notes, description, info table and chips of a Switch game.
      function renderSwitchModal(r, detail, baseId, loading) {
        const f = r.item;
        const x = switchFacts(r, detail, baseId);
        $("modal-title").textContent = x.name;
        $("modal-publisher").textContent = x.publisher === "CookingFoil" ? "" : x.publisher;
        const genreText = x.genres.join(", ");
        fillPills([
          [x.languages.includes("ko") ? t("pill.korean") : "", "need"],
          [x.score ? t("pill.score", x.score.score) : ""],
          [genreText.length <= 24 ? genreText : ""],
        ]);
        $("modal-notes-text").textContent = x.td.notes || "";
        $("modal-notes").hidden = !x.td.notes;
        fillDesc(x.td.description, loading);
        const known = (v) => (loading && !v ? null : v || "");
        const dlc = [x.dlcTotal ? t("modal.dlcOut", x.dlcTotal) : "", x.dlcHere ? t("modal.dlcHere", x.dlcHere) : ""].filter(Boolean).join(" · ");
        fillMeta([
          [x.score?.count ? t("modal.scoreN", x.score.count) : t("modal.score"), known(x.score ? scoreText(x.score.score, x.score.key, x.score.label) : "")],
          [t("modal.release"), known(x.release)],
          [t("modal.publisher"), known(x.publisher)],
          [t("modal.players"), known(x.players)],
          [t("modal.baseSize"), x.baseSize > 0 ? fmtBytes(x.baseSize) : ""],
          [t("modal.installSize"), x.installSize > 0 ? fmtBytes(x.installSize) : ""],
          [t("modal.firmware"), known(x.firmware)],
          [t("modal.ageRating"), known(x.rating)],
          [t("chip.dlc"), known(dlc)],
          [t("modal.latest"), known(x.latest)],
          [t("modal.format"), fmtExt(f.url || f.name)],
          [t("modal.region"), known(x.region)],
          [t("modal.titleId"), f.titleId || "", true],
        ]);
        fillChips([[t("modal.languages"), x.languages.map(langName)], [t("modal.category"), x.genres]]);
        return x;
      }

      // "What to install", as the console's panel lists it: the base game, the
      // newest update only, every DLC, then the patches that are not required.
      function renderInstall(group, patchGroup) {
        const box = $("modal-install");
        const rows = [];
        const link = (f) => {
          const a = document.createElement("a");
          a.href = f.url || "#"; a.target = "_blank"; a.rel = "noopener";
          return a;
        };
        // A game kept as several base files offers each, the one its card stands for first.
        const bases = group.filter((x) => x.kind === "base").sort(baseRank);
        bases.forEach((base, i) => {
          const v = fileVersion(base.item);
          const chips = [{ text: fmtVersion(v, versionName(base.item.titleId, v)) },
            ...(bases.length > 1 ? [{ text: fmtExt(base.item.url || base.item.name) }] : []),
            ...(i === 0 ? [{ text: t("install.required"), tone: "need" }] : [])];
          rows.push(detailRow(link(base.item), { name: (base.item.name || t("install.base")), tag: { kind: "base", text: t("install.tag.base") }, chips, size: base.size, clamp: true }));
        });
        const update = group.filter((x) => x.kind === "update").sort((a, b) => fileVersion(b.item) - fileVersion(a.item))[0];
        if (update) {
          const v = fileVersion(update.item);
          rows.push(detailRow(link(update.item), { name: (update.item.name || t("install.update")), tag: { kind: "update", text: t("install.tag.update") }, chips: [{ text: fmtVersion(v, versionName(update.item.titleId, v)) }, { text: t("install.latest"), tone: "latest" }], size: update.size, clamp: true }));
        }
        for (const d of group.filter((x) => x.kind === "dlc")) {
          rows.push(detailRow(link(d.item), { name: (d.item.name || t("misc.unnamed")), tag: { kind: "dlc", text: t("install.tag.dlc") }, size: d.size, clamp: true }));
        }
        box.replaceChildren();
        if (!rows.length && !patchGroup) { box.hidden = true; return; }
        const head = document.createElement("div"); head.className = "extras-head"; head.textContent = t("install.head");
        box.append(head, ...rows, ...(patchGroup ? [patchGroup] : []));
        box.hidden = false;
      }

      // What the file check found in this title's files ([{ file, kind, titleId, verdict }] from the
      // detail): one quiet line per file, named by what it is. It only informs; the download stays.
      function renderIntegrity(group, list) {
        const box = $("modal-integrity");
        box.replaceChildren();
        for (const { file, kind, titleId, verdict } of Array.isArray(list) ? list : []) {
          if (verdict !== "modified" && verdict !== "damaged") continue;
          const dlc = kind === "dlc" ? group.find((x) => x.kind === "dlc" && (x.item.titleId || "").toUpperCase() === String(titleId || "").toUpperCase()) : null;
          const what = kind === "base" ? t("install.base") : kind === "update" ? t("install.update") : dlc ? (dlc.item.name || t("chip.dlc")) : file;
          box.append(Object.assign(document.createElement("p"), { className: verdict, textContent: t(`integrity.${verdict}`, what), title: file }));
        }
        box.hidden = !box.childElementCount;
      }

      async function openModal(r) {
        currentModal = r;
        retroSeq++; // a retro detail still on its way must not land in this window
        const f = r.item;
        const baseId = (f.baseTitleId || f.titleId || "").toUpperCase();
        const validBase = /^[0-9A-F]{16}$/.test(baseId);
        const modalEl = document.querySelector("#modal .modal");
        const iconUrl = f.icon_url || (validBase ? `/api/library/icon/${baseId}` : "");
        const cached = validBase ? detailCache.get(baseId + ":" + lang) : null;

        // Open at once with what the row already knows, shimmering where the
        // detail will land, instead of waiting on the network with nothing shown.
        modalEl.classList.toggle("loading", validBase && !cached);
        setCover(iconUrl);
        setStage("");
        $("modal-flag").hidden = true; $("modal-where").hidden = true;
        const bannerBox = $("modal-banner");
        bannerBox.dataset.want = ""; bannerBox.classList.remove("no-art"); bannerBox.style.backgroundImage = "";
        renderSwitchModal(r, cached ? cached.detail : {}, baseId, validBase && !cached);
        fillShots([], validBase && !cached);
        $("modal-extras").replaceChildren(); $("modal-art").hidden = true;
        $("modal-install").replaceChildren(); $("modal-install").hidden = true;
        $("modal-patches").replaceChildren(); $("modal-patches").hidden = true;
        $("modal-integrity").replaceChildren(); $("modal-integrity").hidden = true;
        $("modal-download").href = f.url || "#";
        $("modal-download").removeAttribute("download");
        $("modal-download").textContent = t("action.download");
        openSheet("modal");
        loadVideos(validBase ? "title/" + baseId : null);

        // Rich metadata (description, publisher, screenshots, release, region,
        // rating, players) lives behind /api/title/:id, outside the catalog.
        // Fetch that detail alongside operator-supplied art (best effort) so
        // the modal shows full info instead of "—".
        let art = { icon: false, banner: false, screens: [] };
        let detail = {};
        if (cached) {
          ({ art, detail } = cached);
        } else if (validBase) {
          const [ar, dr] = await Promise.all([
            fetch(`/api/art/${baseId}`, { headers: { Accept: "application/json" } }).catch(() => null),
            // A game edited here is asked again past the browser's cache: the detail is kept a minute.
            fetch(`/api/title/${baseId}?lang=${lang}`, { headers: { Accept: "application/json" }, cache: editedDetails.has(baseId) ? "no-cache" : "default" }).catch(() => null),
          ]);
          try { if (ar && ar.ok) art = await ar.json(); } catch { /* best effort */ }
          try { if (dr && dr.ok) detail = await dr.json(); } catch { /* best effort */ }
          detailCache.set(baseId + ":" + lang, { art, detail });
        }
        if (currentModal !== r) return; // another title was opened meanwhile
        modalEl.classList.remove("loading");
        const x = renderSwitchModal(r, detail, baseId, false);

        // The banner, or the blurred icon when the game has none.
        const bannerUrl = x.td.bannerUrl || (validBase && art.banner ? `/api/library/banner/${baseId}` : "");
        setBanner(bannerUrl, iconUrl);

        const shots = Array.isArray(x.td.screenshots) ? [...x.td.screenshots] : [];
        if (validBase) for (const i of (art.screens || [])) shots.push(`/api/library/screenshot/${baseId}/${i}`);
        fillShots(shots, false);

        // The patches a game needs sit above its notes; the rest go with what to install.
        const related = renderModalPatches(Array.isArray(detail.patches) ? detail.patches : []);
        if (validBase) renderInstall(x.group, related);
        renderIntegrity(x.group, detail.integrity);

        // Artwork edit controls — only when uploads are enabled.
        renderArtEditor(baseId, validBase, art, x.group, x.name);

        // The other files in the title's folder, which only the web lists.
        if (validBase) loadExtras(baseId, $("modal-extras"));
      }

      // ── the artwork editor (admins): games, homebrew and patches use this one card ──
      // slots: { icon?: { url, custom }, banner?: { url, custom }, shots: [{ url, removable }], maxShots }
      // upload(slot, file) and remove(slot, n?) return promises; the caller repaints when they settle.
      const ART_EMPTY = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/></svg>';
      const ART_PLUS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
      // The shape each slot is cut to: a square icon, wide banners and screenshots (as they are stored and shown).
      const ART_ASPECT = { icon: 1, banner: 16 / 9, screenshot: 16 / 9 };
      const ART_CROP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>';
      // slots.*.original: { src, crop } when the upload is kept and can be cut again; recrop(slot, n, crop) does it.
      // find: { q, base } offers a search beside each slot (meta/art-search.js on the server).
      const ART_FIND = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
      // reread: { title, run, note } adds a button that reads the item's folder again (pictures put there by hand),
      // and `note` says under the head what becomes of them.
      // cut: false sends the picture as chosen (no crop view); note: a line under the head; slots.icon.caption names the icon tile;
      // slots.shots: null leaves the screenshots out.
      function artEditor({ slots, upload, remove, recrop = null, find = null, reread = null, cut = true, note = null }) {
        const card = document.createElement("section"); card.className = "arted";
        // The crop view in the card's place. The area to keep, null when cancelled, false without the widget (all of it).
        async function cropIn(slot, src, crop = null) {
          if (typeof window.cfCrop !== "function") return false;
          card.classList.add("cropping");
          try {
            return await window.cfCrop({ host: card, src, aspect: ART_ASPECT[slot], crop,
              labels: { title: t("art.cropTitle"), hint: t("art.cropHint"), box: t("art.cropBox"), apply: t("art.cropApply"), cancel: t("art.cropCancel") } });
          } finally { card.classList.remove("cropping"); }
        }
        const cutAndUpload = (slot) => async (file) => {
          if (!cut) return upload(slot, file, null);
          const src = URL.createObjectURL(file);
          try {
            const crop = await cropIn(slot, src);
            if (crop !== null) await upload(slot, file, crop || null);
          } finally { URL.revokeObjectURL(src); }
        };
        const recut = (slot, n, original) => (original && recrop ? async (fig) => {
          const crop = await cropIn(slot, `${original.src}?_=${Date.now().toString(36)}`, original.crop);
          if (!crop) return;
          fig.classList.add("busy");
          try { await recrop(slot, n, crop); } finally { fig.classList.remove("busy"); }
        } : null);
        // The finder in the card's place: a query, the pictures every source has, and one click to cut and save.
        function openFinder(slot) {
          const panel = document.createElement("div"); panel.className = "arted-find " + slot;
          const close = () => { panel.remove(); card.classList.remove("finding"); };
          const top = document.createElement("header");
          const shut = Object.assign(document.createElement("button"), { type: "button", className: "close", textContent: t("art.findClose") });
          shut.addEventListener("click", close);
          top.append(Object.assign(document.createElement("h4"), { textContent: t("art.findHead", t(find.slot === "boxart" ? "art.boxart" : slot === "screenshot" ? "art.screens" : "art." + slot)) }), shut);
          const form = document.createElement("form");
          const input = Object.assign(document.createElement("input"), { type: "search", value: find.q || "", placeholder: t("art.findPlaceholder") });
          input.setAttribute("aria-label", t("art.findPlaceholder"));
          form.append(input, Object.assign(document.createElement("button"), { type: "submit", className: "go", textContent: t("art.find") }));
          const state = Object.assign(document.createElement("p"), { className: "state" });
          const results = document.createElement("div"); results.className = "results";
          panel.append(top, form, state, results);
          const SOURCE = { libretro: "libretro", sgdb: "SteamGridDB", igdb: "IGDB" };
          let seq = 0;
          async function search() {
            const mine = ++seq;
            state.textContent = t("art.findLoading"); state.hidden = false;
            results.replaceChildren(...Array.from({ length: 6 }, () => Object.assign(document.createElement("div"), { className: "pick sk" })));
            // A retro game's cover searches its own slot (boxart) by the game's id.
            const qs = new URLSearchParams({ slot: find.slot || slot, q: input.value.trim() });
            if (find.base) qs.set("base", find.base);
            if (find.retro) qs.set("retro", find.retro);
            let d;
            try { const r = await fetch("/api/art/search?" + qs, { headers: { Accept: "application/json" } }); d = await r.json(); if (!r.ok) throw new Error(d.error); }
            catch { if (mine === seq) state.textContent = t("art.findFailed"); return; }

      // A game is every file of its title: the base game, the updates and the DLC. The file's own path is its address, undone from the wire format.

      // Drop the cached detail of every language, then repaint the open modal.

        }
