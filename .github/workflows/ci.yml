name: CI

# Until v0.8.2 the only workflow here was ghcr-publish, which fires on tags and
# does nothing but build & push. The 200+ unit tests never ran in CI at all —
# they ran when a human remembered to. That is how a one-line missing import
# reached :latest and 500'd every request.
#
# Lint (catches "used but never imported") + unit tests. They run when the
# version goes up: ghcr-publish calls this before it builds, so a release can't
# skip them. Every push also runs them locally first (the git hook refuses a
# push without tests), so a PR does not spend a runner on them again.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # --ignore-scripts: postinstall only arms local git hooks, pointless here.
      - name: Install
        run: npm ci --ignore-scripts

      # Fails on errors only; the pre-existing unused-var warnings stay advisory.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Web interaction and screenshot tests
        run: npm run test:web
      - name: Web screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screens
          path: out/web/*.png
