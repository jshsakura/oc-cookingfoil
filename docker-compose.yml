# CookingFoil: a personal, self-hosted homebrew file server.
#
# Needs Docker Compose v2 (`docker compose`); on a Synology NAS, Container
# Manager on DSM 7.2 or later (Project, then Create, with this file).
#
#   1. docker compose up -d
#   2. docker compose logs cookingfoil | grep "setup code"
#   3. open http://<this machine>:9080/setup, enter the code, make the admin
#      account and register an authenticator app
#   4. everything else (devices, uploads, homebrew, outside-service keys such as
#      IGDB, SteamGridDB, Dropbox and GitHub, Google sign-in, Telegram alerts) is
#      set on the admin page, which says where to get each key
#
# Every option is optional and lives in .env (copy .env.example, which explains
# each one). The whole file reaches the container through env_file, so nothing
# has to be listed here. A value saved on the admin page wins over .env.
#
# Behind a reverse proxy or tunnel, set COOK_TRUST_PROXY in .env to the proxy's
# hops only (for example "loopback, uniquelocal"). For the optional direct
# download address, COOK_DIRECT_EDGE_SECRET also goes in .env, not in this
# file. Ready-made Caddy, nginx, Cloudflare Tunnel and direct-download setups
# are in examples/. Update with: docker compose pull && docker compose up -d
services:
  cookingfoil:
    image: ghcr.io/jshsakura/oc-cookingfoil:latest
    container_name: cookingfoil
    hostname: cookingfoil
    restart: unless-stopped
    # A stop lets running downloads finish (COOK_RESTART_GRACE, 25 s by default,
    # at most 35 s) before the server exits; docker's own 10 s would cut them.
    stop_grace_period: 40s
    # .env reaches the container whole, COOK_SECRET_KEY (required) included.
    env_file:
      - .env
    environment:
      # The user the server runs as, so what it writes is yours. `id` on the host
      # prints yours; on Synology the first admin is usually 1026 and users 100.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      DEBUG: ${DEBUG:-oc-cookingfoil*}
      # Inside the container these never move; choose the host folder below.
      COOK_PORT: 80
      COOK_STORAGE_DIR: /storage
      # Folder settings meant for running from source (an .env copied from
      # .env.example, or an older one) must not move data inside the container,
      # where it would be lost with it: here every folder comes from /storage.
      COOK_GAMES_DIR: ""
      COOK_DATA_DIR: ""
      COOK_KEYS_DIR: ""
      COOK_RETRO_DIR: ""
      COOK_PATCHES_DIR: ""
      COOK_SAVES_DIR: ""
      COOK_HOMEBREW_DIR: ""
      COOK_INCOMING_DIR: ""
      ROMS_DIR_FULLPATH: ""
      COOK_PROD_KEYS_PATH: ""
    ports:
      # Host:container. Change the host side freely; the container side stays 80.
      - "${COOK_HOST_PORT:-9080}:80"
    volumes:
      # One host folder holds everything, beside this file unless COOK_STORAGE_PATH
      # in .env puts it somewhere else (for example COOK_STORAGE_PATH=/volume1/cookingfoil).
      # The server makes these inside it on the first start:
      #   incoming  drop files here; the server sorts them into the folders below
      #   games     sorted Switch games, one folder per game with update/ and DLC/
      #   homebrew  .nro apps and app folders
      #   retro     retro ROMs, art and your RetroArch base pack
      #   patches   patches by base title id
      #   saves     save files by title id
      #   keys      your own prod.keys
      #   data      accounts, settings and caches. Back this one up
      # Plain ${VAR:-default} only, so older Compose releases such as the one in
      # Synology Container Manager read it.
      - ${COOK_STORAGE_PATH:-./storage}:/storage
      # Upgrading an install that mounted /games, /data, /keys, ... separately?
      # Add docker-compose.legacy.yml (see the file) until their contents are moved.
