# CookingFoil: a personal, self-hosted homebrew file server.
#
#   1. docker compose up -d
#   2. docker compose logs cookingfoil | grep "setup code"
#   3. open http://<this machine>:9080/setup, enter the code, make the admin
#      account and register an authenticator app
#   4. outside-service keys (IGDB, SteamGridDB, Dropbox, GitHub …) go in the
#      admin page's settings tab, each with where to get it
#
# Every option is optional and lives in .env (copy .env.example). The whole file
# reaches the container; nothing has to be listed here.
services:
  cookingfoil:
    image: ghcr.io/jshsakura/oc-cookingfoil:latest
    container_name: cookingfoil
    hostname: cookingfoil
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: ${DEBUG:-oc-cookingfoil*}
      # Fixed by this file's volumes; .env cannot move them.
      COOK_PORT: 80
      COOK_GAMES_DIR: /games
      COOK_DATA_DIR: /data
      COOK_KEYS_DIR: /keys
    ports:
      # Host:container. Change the host side freely; the container side stays 80.
      - "${COOK_HOST_PORT:-9080}:80"
    volumes:
      # Your file library.
      - ./games:/games
      # Accounts, keys you save on the admin page, caches. Back this one up.
      - ./data:/data
      # Your own prod.keys, read-only. Without it icons and names come from titledb.
      - ./keys:/keys:ro
      # Optional folders; each feature stays off until its folder is mounted.
      # Retro files live in ./data/retro unless you mount them elsewhere.
      # - ./retro:/data/retro
      # - ./patches:/patches:ro
      # - ./saves:/saves:ro
      # - ./homebrew:/homebrew
      # Optional template overrides. Create the file first: if it is missing,
      # Docker makes a directory in its place.
      # - ./shop_template.jsonc:/shop_template.jsonc:ro
