# nginx on the host, in front of the library published on port 9080 (the default
# in docker-compose.yml). In .env: COOK_TRUST_PROXY=loopback, uniquelocal
server {
  listen 443 ssl;
  http2 on;
  server_name library.example.org;
  ssl_certificate     /etc/ssl/library.example.org/fullchain.pem;
  ssl_certificate_key /etc/ssl/library.example.org/privkey.pem;

  # Uploads from the admin page and the share box: no limit here, the library's
  # COOK_UPLOAD_MAX_BYTES is the one that counts.
  client_max_body_size 0;

  location / {
    proxy_pass http://127.0.0.1:9080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Downloads are large and resumed in Range requests: stream them, never time out mid-file.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
}

server {
  listen 80;
  server_name library.example.org;
  return 301 https://$host$request_uri;
}
