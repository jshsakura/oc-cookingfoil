# A Cloudflare Tunnel to the library published on port 9080 (cloudflared on the
# host). Create the tunnel and its DNS route with:
#   cloudflared tunnel create cookingfoil
#   cloudflared tunnel route dns cookingfoil library.example.org
# In .env: COOK_TRUST_PROXY=loopback, uniquelocal (cloudflared reaches the
# published port through Docker's gateway).
#
# cloudflared adds the visitor's address to X-Forwarded-For. Uploads through
# the tunnel are limited by your Cloudflare plan (100 MB per request on the
# free plan); upload large files on the home network instead.
tunnel: cookingfoil
credentials-file: /etc/cloudflared/cookingfoil.json

ingress:
  - hostname: library.example.org
    service: http://127.0.0.1:9080
  - service: http_status:404
