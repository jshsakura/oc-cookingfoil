# CookingFoil with Caddy in front, in one stack: Caddy gets a certificate for
# library.example.org by itself (ports 80 and 443 must reach this machine) and
# passes everything to the library over the stack's own network.
#
#   1. point library.example.org at this machine (an A record)
#   2. cp ../../.env.example .env, and set in it:
#        COOK_TRUST_PROXY=uniquelocal
#   3. docker compose up -d
#   4. docker compose logs cookingfoil | grep "setup code"
#      then open https://library.example.org/setup
services:
  cookingfoil:
    image: ghcr.io/jshsakura/oc-cookingfoil:latest
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - .env
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      COOK_PORT: 80
      # Every folder lives in /storage (see the main docker-compose.yml).
      COOK_STORAGE_DIR: /storage
      COOK_GAMES_DIR: ""
      COOK_DATA_DIR: ""
      COOK_KEYS_DIR: ""
      COOK_RETRO_DIR: ""
      COOK_PATCHES_DIR: ""
      COOK_SAVES_DIR: ""
      COOK_HOMEBREW_DIR: ""
      COOK_INCOMING_DIR: ""
      ROMS_DIR_FULLPATH: ""
    # No ports: only Caddy reaches the library.
    volumes:
      - ./storage:/storage

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      - cookingfoil
