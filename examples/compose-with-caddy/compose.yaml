# CookingFoil with Caddy in front, in one stack: Caddy gets a certificate for
# shop.example.org by itself (ports 80 and 443 must reach this machine) and
# passes everything to the shop over the stack's own network.
#
#   1. point shop.example.org at this machine (an A record)
#   2. cp ../../.env.example .env, and set in it:
#        COOK_TRUST_PROXY=uniquelocal
#   3. docker compose up -d
#   4. docker compose logs cookingfoil | grep "setup code"
#      then open https://shop.example.org/setup
services:
  cookingfoil:
    image: ghcr.io/jshsakura/oc-cookingfoil:latest
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - .env
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      COOK_PORT: 80
      COOK_GAMES_DIR: /games
      COOK_DATA_DIR: /data
      COOK_KEYS_DIR: /keys
      COOK_RETRO_DIR: /retro
      COOK_PATCHES_DIR: /patches
      COOK_SAVES_DIR: /saves
      COOK_HOMEBREW_DIR: /homebrew
    # No ports: only Caddy reaches the shop.
    volumes:
      - ./games:/games
      - ./data:/data
      - ./keys:/keys:ro
      - ./retro:/retro
      - ./patches:/patches
      - ./saves:/saves
      - ./homebrew:/homebrew

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      - cookingfoil
